:root[data-bg]{--card:rgba(255,255,255,.68);--chip:rgba(0,0,0,.045);--line:rgba(0,0,0,.07);--track:rgba(0,0,0,.07);--solid:#fff}
:root[data-theme="dark"][data-bg]{--card:rgba(255,255,255,.075);--chip:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--solid:#1c1c1e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg]{--card:rgba(255,255,255,.075);--chip:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--solid:#1c1c1e}}
html[data-bg]{background:var(--bgimg) var(--bgtop,var(--bg));background-repeat:no-repeat;background-size:100% 100%}
/* The status bar shows the page's own colour (the dark / light top). Below the page (behind the keyboard's ^ v ✓ bar) a
   separate layer continues with the colour at the bottom of the background. */
html[data-bg] body::after{content:'';position:fixed;left:0;right:0;top:100%;height:100vh;background:var(--bgend,var(--bg));pointer-events:none}
:root[data-bg] body{background:transparent}
:root[data-bg] #chatScreen{background:transparent}
:root[data-bg] .chatbar,:root[data-bg] .dfoot{background:transparent}
:root[data-bg] .sheet,:root[data-bg] .sheethead,:root[data-bg] .celcard,:root[data-bg] .ttip,:root[data-bg] .pmenu{background:var(--solid)}
:root[data-bg] .seg button.on{background:var(--solid)}
.bgrow{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:10px 12px 10px 10px;border-radius:16px;background:var(--chip);text-align:left}
.bgthumb{width:34px;height:44px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.bggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.bgtile{aspect-ratio:3/4;border-radius:18px;position:relative;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);transition:transform .15s}
.bgtile:active{transform:scale(.96)}
.bgtile.on{box-shadow:0 0 0 3px var(--solid,var(--card)),0 0 0 5.5px var(--text)}
.bgtile span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;font-weight:700;color:var(--tc)}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
body{transition:background .25s;overflow:hidden;height:100%}
html{height:100%;overflow:hidden}
#scroller{position:fixed;left:0;right:0;top:0;bottom:var(--tabh,82px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#scroller #view{padding-bottom:36px}
/* Soft fade at the bottom edge so the page blends into the tab bar instead of stopping at a hard line */
#scroller,.msgscroll{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.tabbar{border-top-color:transparent}
body.chatting #scroller{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);width:100%;padding:14px 16px;border-radius:14px;
  border:0;background:var(--chip);outline:none}
textarea{resize:none;min-height:96px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:22px 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:var(--on-ink);
  border-radius:999px;padding:17px;font-weight:600;font-size:17px}
.btn:disabled{opacity:.3}
.btn.outline{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{width:auto;padding:10px 18px;font-size:15px}
.chipbtn{background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}

/* Rings */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}

/* Header + week */
.top{padding:calc(8px + env(safe-area-inset-top)) 0 4px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand img{width:30px;height:30px;border-radius:8px}
.brand,.chipbtn{white-space:nowrap}
.streak{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;box-shadow:var(--shadow)}
.themebtn{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:17px}
.week{display:flex;align-items:center;margin:12px -6px 14px}
.week .nav{width:22px;color:var(--muted);font-size:20px}
.days{flex:1;display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 5px;border-radius:16px;min-width:42px}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.future{opacity:.35;pointer-events:none}
.day .dl{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  border:2px dashed var(--line)}
.day .dn.logged{border:2px solid var(--text)}
.day .dn.over{border:2px solid var(--bad)}

/* Home cards */
.calcard{display:flex;justify-content:space-between;align-items:center;padding:24px 22px}
.bignum{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.bignum small{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.mcard{background:var(--card);border-radius:20px;padding:16px 12px 14px;box-shadow:var(--shadow);text-align:left}
.mcard .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.mcard .v small{font-size:13px;color:var(--muted);font-weight:600}
.mcard .l{font-size:12.5px;color:var(--muted);margin:2px 0 12px;font-weight:500}
.mcard .ring{margin:0 auto}
.burncard{display:flex;align-items:center;gap:14px;margin-top:4px;flex-wrap:wrap}
.burncard .note{flex-basis:100%;margin-top:-4px}
.hcard .spread{flex-wrap:wrap;row-gap:4px}
.hcard .spread>span:first-child{white-space:nowrap}
.burncard .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.planchip{display:flex;width:100%;align-items:center;flex-wrap:wrap;gap:4px 8px;max-width:100%;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:8px 14px;font-size:14px;margin:0 0 12px;text-align:left}
.planchip>*{white-space:nowrap}
.frow{margin-top:12px}
.frow .spread{font-size:14px}
.opt.cmp{padding:14px 16px;font-size:16px;margin-bottom:8px}
.hcard{padding:13px 16px}
.nmini{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:9px;opacity:.72}
.nm{min-width:0}
.nm-l{display:block;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm-v{display:block;margin-top:1px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nm-v b{font-weight:600;color:var(--text);opacity:.8}
.nm-bar{height:2.5px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:4px}
.nm-bar i{display:block;height:100%;border-radius:2px;opacity:.6;transition:width .5s ease}
.hcard .hscale{height:7px;border-radius:4px;background:linear-gradient(90deg,#ff5a4f 0%,#f5b83d 45%,#34c759 75%,#1fa64a 100%);position:relative;margin:11px 0 5px}
.hcard .hscale b{position:absolute;top:-5px;width:17px;height:17px;border-radius:50%;background:var(--card);border:3px solid var(--text);transform:translateX(-50%);transition:left .6s ease}

/* Entries */
.entry{display:flex;gap:12px;background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:92px;height:92px;border-radius:14px;flex:none;background:var(--chip);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.einfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-right:4px}
.ename{font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.einfo>.spread{align-items:flex-start}
.etime{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 8px;border-radius:999px;flex:none}
.ecal{font-weight:700;font-size:15px}
.emac{display:flex;gap:12px;font-size:13px;color:var(--muted);font-weight:500}
.skel{height:10px;border-radius:6px;background:var(--chip);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.empty{text-align:center;padding:30px 20px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.empty b{display:block;font-size:17px;margin-bottom:6px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:8px 18px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--text)}
.fab{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);margin:-26px 0 0 18px;flex:none}
.fab svg{width:28px;height:28px}
/* Smooth page switches: the new page fades and glides in; tab icons react to taps */
.tab{transition:color .25s ease}
.tab svg{transition:transform .18s ease}
.tab:active svg{transform:scale(.86)}
.fab{animation:fabIn .3s cubic-bezier(.2,1.4,.4,1)}
.fab:active{transform:scale(.92)}
@keyframes fabIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#view.pagein{animation:pageIn .5s cubic-bezier(.22,.75,.25,1)}
#chatScreen.pagein{animation:pageFade .45s ease}
#chatScreen.pagein #msgScroll{animation:pageIn .5s cubic-bezier(.22,.75,.25,1)}
#view.pageout,#chatScreen.pageout{animation:pageOut .18s ease forwards}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@keyframes pageOut{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){#view.pagein,#chatScreen.pagein,#chatScreen.pagein #msgScroll,#view.pageout,#chatScreen.pageout,.fab{animation:none}}

/* Sheets & pages */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheethead{position:sticky;top:-8px;z-index:2;background:var(--card);margin:-8px -20px 6px;padding:10px 20px 4px;display:flex;justify-content:center;touch-action:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheetx{position:absolute;right:14px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sheet h3{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.addtile{background:var(--chip);border-radius:20px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;text-align:center}
.addtile span{font-size:30px}
.addtile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;padding:16px 12px}
.addtile.wide span{font-size:24px}
.fav-row{gap:8px}
.fav-ic{width:34px;height:34px;flex:none;font-size:18px;display:flex;align-items:center;justify-content:center}
.fav-add{width:40px;height:40px;padding:0;flex:none;font-size:20px}
.bkcode{margin:14px 0;padding:14px 10px;border-radius:14px;background:var(--chip);font:800 20px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;user-select:all;-webkit-user-select:all}
.barlive{margin-top:14px;border-radius:18px;overflow:hidden;background:#000;min-height:140px;position:relative}
.barlive video{width:100%;aspect-ratio:4/3;display:block;object-fit:cover}
.barframe{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.92);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.priv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.priv-ic{font-size:22px;width:30px;text-align:center;flex:none}
.priv p{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.mp-ate{margin-top:8px;padding:7px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700}
.mp-ate.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}

/* Detail */
.hero{height:330px;background:var(--chip);position:relative;display:flex;align-items:center;justify-content:center;font-size:90px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero.short{height:calc(130px + env(safe-area-inset-top))}
.herobar{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px;display:flex;justify-content:space-between}
.circ{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dbody{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-30px;position:relative;padding:22px 18px calc(110px + env(safe-area-inset-bottom))}
.tinput{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;background:none;padding:4px 0;border-radius:0;min-height:0;resize:none;overflow:hidden}
.pwbox{position:relative}
.pwbox input{padding-right:52px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pweye svg{width:22px;height:22px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;font-size:20px;font-weight:600}
.stepper b{min-width:28px;text-align:center}
.portion{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.pchips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.stepper.sm{padding:2px}
.stepper.sm button{width:28px;height:28px;font-size:18px}
.stepper.sm b{min-width:40px;font-size:14px}
.pchips button{flex:1 1 0;min-width:0;padding:8px 6px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px;transition:background .15s,color .15s}
.pchips button.on{background:var(--ink);color:var(--on-ink)}
.ptag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:700;vertical-align:2px}
.bigcal{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left}
.bigcal .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px}
.dmac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dm{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left}
.dm .t{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;gap:4px;align-items:center}
.dm b{font-size:19px;display:block;margin-top:4px}
.hbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:10px}
.hbar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.ing{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.ing-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;width:100%;text-align:left}
.ing-edit{padding:0 16px 16px}
.ing-edit .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ing-edit .g4 input{padding:11px 4px;text-align:center}
.ing-edit .g4 .lbl{text-align:center;margin:8px 0 4px;font-size:11px}
.dfoot{position:fixed;left:0;right:0;bottom:0;z-index:31;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.dfoot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}

/* Onboarding */
.onb{display:flex;flex-direction:column;min-height:100%;padding:calc(10px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.onb-top{display:flex;align-items:center;gap:14px;height:44px}
.onb-back{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:18px;flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.onb h1{font-size:31px;line-height:1.12;letter-spacing:-.03em;margin:26px 0 8px}
.onb .sub{color:var(--muted);margin:0 0 28px}
.onb-body{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--chip);border-radius:18px;padding:19px 20px;font-weight:600;font-size:17px;margin-bottom:12px;transition:.15s}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.opt.on{background:var(--ink);color:var(--on-ink)}
.opt.on small{color:inherit;opacity:.7}
.speedv{text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em;margin:10px 0}
.animals{display:flex;justify-content:space-between;font-size:30px;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:16px 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--ink);margin-top:-11px;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tip{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:14px;margin-top:16px}
/* Meal plan */
.mpcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px}
.mpcard .ic{width:40px;height:40px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.mp-sub{margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mp-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.mp-back{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;padding-bottom:3px}
.mp-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mp-body{padding-top:6px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.mp-empty{text-align:center;padding:30px 22px}
.mp-empty h3{margin:14px 0 6px}.mp-empty p{margin:0 0 20px}
.mp-emoji{width:76px;height:76px;margin:0 auto;border-radius:24px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:38px}
.mp-cat{padding:14px 16px 6px}
.mp-catname{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.mp-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:16px}
.mp-item:first-of-type{border-top:0}
.mp-check{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;transition:.15s}
.mp-item.have .mp-check{background:var(--good);box-shadow:none;color:#fff}
.mp-item.have .mp-iname{text-decoration:line-through;color:var(--muted)}
.mp-qty{color:var(--muted);font-size:14px;font-weight:600;text-align:right;max-width:40%}
.mp-day.today{box-shadow:var(--shadow),inset 0 0 0 2px var(--ink)}
.mp-dayhead{margin-bottom:4px}
.mp-meal{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mp-type{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mp-name{font-weight:700;font-size:16px;margin:2px 0}
.mp-mac{font-size:13px;font-weight:600;margin-top:4px}
.mp-swap{width:38px;height:38px;border-radius:50%;background:var(--chip);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.mp-tips{margin:8px 0 0;padding-left:20px}.mp-tips li{margin:6px 0}
.mp-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.mp-auto{display:block;margin:0 auto 12px;font-size:13px;font-weight:600;color:var(--muted);padding:4px 10px}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mini{margin:0;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.mini .spread{align-items:center}
.mini-ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px}
.mini-plus{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.mini-v{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.mini-v small{font-size:13px;font-weight:600;color:var(--muted)}
.mini-l{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:22px;font-weight:600;flex:none;display:flex;align-items:center;justify-content:center}
.addtile small{font-size:12px;font-weight:600}
/* Personal details */
.pd-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.pd-av{width:48px;height:48px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.pd-sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 8px}
.pd-seg,.pd-wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pd-wk{grid-template-columns:repeat(4,1fr)}
.pd-seg button,.pd-wk button{background:var(--chip);border-radius:16px;padding:12px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,color .15s}
.pd-seg button span{font-size:20px;line-height:1.1}
.pd-seg button.on,.pd-wk button.on{background:var(--ink);color:var(--on-ink)}
.pd-wk .pd-wic{font-size:22px;line-height:1.2}
.pd-wk small{font-size:11px;font-weight:600;opacity:.75;text-align:center;line-height:1.2}
.pd-row{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:16px;padding:14px 16px}
.pd-ic{font-size:22px}
.pd-date{position:relative;cursor:pointer}
.pd-date input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;margin:0;border:0}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pd-num{background:var(--chip);border-radius:18px;padding:12px 14px;min-width:0}
.pd-val{display:flex;align-items:baseline;gap:4px;margin:2px 0 10px}
.pd-val input{background:none;border:0;padding:0;margin:0;font-size:30px;font-weight:800;width:100%;min-width:0;letter-spacing:-.02em;box-shadow:none;border-radius:0}
.pd-val span{font-weight:700;color:var(--muted)}
.pd-step{display:flex;gap:8px}
.pd-step button{flex:1;height:36px;border-radius:12px;background:var(--card);font-size:20px;font-weight:700}
.pd-prev{margin-top:18px;background:var(--chip);border-radius:20px;padding:16px}
.pd-kcal{display:flex;align-items:baseline;gap:6px;margin:6px 0 12px;font-weight:700;color:var(--muted)}
.pd-kcal b{font-size:34px;font-weight:800;color:var(--text);letter-spacing:-.03em}
.pd-kcal span{font-size:24px;align-self:center}
.pd-mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pd-mac div{background:var(--card);border-radius:14px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:1px;box-shadow:inset 0 3px 0 var(--c)}
.pd-mac span{font-size:16px}
.pd-mac b{font-size:17px}
.pd-mac small{font-size:12px;color:var(--muted);font-weight:600}
.pd-when{margin-top:12px;font-size:14px}
.wwhy{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--chip)}
.wwhy .spread{padding:3px 0}
.addtile .wicon{height:64px;display:flex;align-items:flex-end;justify-content:center}
.addtile .wicon svg{width:auto;display:block}
.rtimes{margin-top:12px;border-radius:16px;background:var(--chip);overflow:hidden}
.rrow{padding:12px 14px}
.rrow+.rrow{border-top:1px solid var(--line)}
.rhead{display:flex;align-items:center;gap:12px}
.rhead .ic{font-size:20px;width:26px;text-align:center;flex:none}
.rhead .rt{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.rhead .rt small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.rpick{display:flex;gap:8px;margin:10px 0 0 38px}
.rpick .rsel{flex:1;min-width:0}
.rpick .rsel:first-child:not(:last-child){flex:1.5}
.rsel{width:auto;padding:9px 10px;border-radius:12px;font-size:15px;background:var(--card)}
.tog{position:relative;width:51px;height:31px;border-radius:999px;background:color-mix(in srgb,var(--muted) 40%,transparent);flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.tog.on{background:var(--good)}
.tog.on::after{transform:translateX(20px)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2000}
.celpop{position:fixed;inset:0;z-index:1500;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);animation:fade .2s;padding:20px}
.celpop.out{opacity:0;transition:opacity .3s}
.celcard{background:var(--card);border-radius:28px;padding:26px 28px 24px;text-align:center;max-width:300px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:celIn .5s cubic-bezier(.2,1.4,.4,1)}
.celic{font-size:58px;line-height:1.1;margin-bottom:10px;animation:celBounce .9s ease .25s}
.celcard b{display:block;font-size:20px;margin-bottom:4px}
@keyframes celIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes celBounce{40%{transform:scale(1.25) rotate(-8deg)}70%{transform:scale(.95) rotate(4deg)}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;background:var(--chip);min-width:0}
.badge .bic{font-size:28px;line-height:1.1;filter:grayscale(1);opacity:.35}
.badge.on .bic{filter:none;opacity:1}
.badge .bname{font-size:10.5px;font-weight:700;text-align:center;line-height:1.2;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.badge.on .bname{color:var(--text)}
.bmore{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:12px;padding:10px;border-radius:14px;background:var(--chip);font-size:14px;font-weight:700;color:var(--text)}
.bmore svg{width:12px;height:8px;flex:none;transition:transform .2s}
.bmore.open svg{transform:rotate(180deg)}
.bbar{width:70%;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.bbar i{display:block;height:100%;background:var(--flame);border-radius:2px}
.bigbadge{width:96px;height:96px;margin:0 auto;border-radius:30px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:54px;filter:grayscale(1);opacity:.45}
.bigbadge.on{filter:none;opacity:1;animation:celIn .5s cubic-bezier(.2,1.4,.4,1)}
.chipprog{display:block;flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-left:4px;vertical-align:middle}
.chipprog i{display:block;height:100%;background:var(--flame)}
.chippct{font-size:12px}
.planchip>.chipsub{flex-basis:100%;font-size:12px;font-weight:600;color:var(--muted);white-space:normal;padding-left:2px}
.gp{text-align:center;padding-top:calc(30px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.gp-trophy{font-size:96px;animation:celIn .7s cubic-bezier(.2,1.4,.4,1),celBounce 1.2s ease .6s}
.gp h1{margin:8px 0 6px}
.gp-stats{text-align:left;margin:20px 0 14px}
.gp-stats .spread{padding:7px 0;border-top:1px solid var(--line)}
.gp-big{font-size:28px;font-weight:800;text-align:center;margin-bottom:10px;letter-spacing:-.02em}
.gp-big span{color:var(--flame)}
.gp .opt{text-align:left}
#tourLayer{position:fixed;inset:0;z-index:95;animation:fade .3s}
#tourLayer.out{opacity:0;transition:opacity .3s}
.tspot{position:fixed;left:0;top:0;will-change:transform,width,height;box-shadow:0 0 0 9999px rgba(0,0,0,.66),0 0 0 3px rgba(255,255,255,.9),0 0 24px rgba(255,255,255,.25);pointer-events:none}
.ttip{position:fixed;left:16px;right:16px;top:0;max-width:420px;margin:0 auto;will-change:transform;background:var(--card);color:var(--text);border-radius:22px;padding:14px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.45);transition:opacity .25s ease}
.ttip-body{transition:opacity .16s ease}
.ttip-body.swap{opacity:0}
.ttip-t{display:block;font-size:18px;margin:6px 0 4px}
.ttip-x{margin:0 0 14px;font-size:15px;line-height:1.45;color:var(--muted)}
.ttip-skip{font-size:14px;font-weight:600;color:var(--muted);padding:4px 6px}
.inpop{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:70;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:12px 10px 12px 14px;border-radius:20px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 0 0 1px var(--line);animation:popIn .5s cubic-bezier(.2,1.2,.4,1)}
.inpop.out{opacity:0;transform:translateY(-24px);transition:.3s ease}
.inpop-ic{font-size:26px;flex:none}
.inpop .small{margin-top:2px;line-height:1.35}
.inpop .chipbtn{flex:none}
.inpop-x{color:var(--muted);font-size:14px;padding:6px;flex:none}
@keyframes popIn{from{opacity:0;transform:translateY(-34px) scale(.96)}to{opacity:1;transform:none}}
.mp-actions{gap:10px}.mp-actions .btn{font-size:14px;white-space:nowrap;padding:11px 8px}
.mp-chips .chipbtn.on{background:var(--ink);color:var(--on-ink)}
/* Language choice on the first setup screen: big and easy to find */
.langpick{margin:0 0 14px;text-align:center}
.lp-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;font-weight:600}
.lp-flag{font-size:14px;line-height:1}
.lp-change{color:var(--muted);margin-top:-4px}
.askbell{width:76px;height:76px;margin:0 auto;border-radius:24px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:38px;animation:bellIn .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes bellIn{from{transform:scale(.5) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.plan4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan4 .card{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px}

/* Progress */
.pills{display:flex;gap:6px;background:var(--chip);border-radius:999px;padding:4px}
.pills button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.pills button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.two .card{margin:0}
.wdots{display:flex;justify-content:space-between;margin-top:12px}
.wdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.wdots i{width:14px;height:14px;border-radius:50%;background:var(--track)}
.wdots i.on{background:var(--flame)}
.bmi-bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#5aa9f2 0%,#5aa9f2 14%,#34c759 14%,#34c759 40%,#f5b83d 40%,#f5b83d 60%,#ff5a4f 60%);position:relative;margin:18px 0 10px}
.bmi-bar b{position:absolute;top:-6px;width:4px;height:22px;border-radius:2px;background:var(--text);transform:translateX(-50%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.nbars{display:flex;align-items:flex-end;gap:10px;height:150px;position:relative;margin-top:14px}
.nbars .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.nbars .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;background:var(--track);min-height:4px}
.nbars .col span{font-size:11px;color:var(--muted);font-weight:600}
.nbars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.chart{width:100%;height:auto;display:block}

/* Settings */
.list{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;text-align:left;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{font-size:20px;width:26px;text-align:center}
.li .chev{color:var(--muted)}
.li .val{color:var(--muted);font-size:15px}
.stats3{display:flex;justify-content:space-around;text-align:center}
.stats3 b{display:block;font-size:20px}
.seg{display:flex;gap:6px;background:var(--chip);border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* Chat */
body.chatting{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.chatting .fab,body.nofab .fab{display:none}
.tabbar{transition:opacity .2s ease}
body.typing .tabbar{opacity:0;pointer-events:none}
#chatScreen{position:fixed;left:0;right:0;top:0;height:100%;z-index:5;display:flex;flex-direction:column;background:var(--bg);transition:height .3s cubic-bezier(.25,.8,.25,1)}
body.chatting{overflow:hidden;padding-bottom:0}
.chathead{flex:none;width:100%}
.msgscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msgscroll .wrap{padding-bottom:14px}
#chatScreen .chatbar{position:relative;left:auto;right:auto;bottom:auto;flex:none;padding:8px 14px calc(74px + env(safe-area-inset-bottom));transition:padding-bottom .3s cubic-bezier(.25,.8,.25,1)}
body.typing #chatScreen .chatbar{padding-bottom:8px}
body.typing .chatbar{bottom:0;padding-bottom:6px}
.chatbar.hasText .chips{display:none}

.msgs{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.55;word-wrap:break-word}
.msg.new{animation:msgIn .35s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}
.memnote{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}
.msgtime{align-self:flex-end;font-size:11px;color:var(--muted);margin:-8px 6px 0;font-variant-numeric:tabular-nums}
.msg.user{align-self:flex-end;background:var(--chip);color:var(--text);border-radius:18px;padding:10px 16px}
.msg.ai{align-self:stretch;max-width:100%;background:none;padding:2px 2px 6px;border-radius:0}
.msg.err{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad);padding:10px 14px;border-radius:14px}
.msg img{display:block;max-width:180px;border-radius:12px;margin-bottom:6px}
.msg .imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px;width:228px;max-width:100%}
.msg .imgs img{width:100%;max-width:none;aspect-ratio:1;object-fit:cover;margin:0;border-radius:8px}
.attstrip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none}
.attstrip::-webkit-scrollbar{display:none}
.att{position:relative;flex:none;width:58px;height:58px;border-radius:12px;background:var(--chip);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.att img{width:100%;height:100%;object-fit:cover}
.att .fn{font-size:9px;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.att .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.msg ul,.msg ol{margin:6px 0 8px;padding-left:20px}
.msg li{margin:3px 0}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;border-radius:2px;background:var(--muted);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:pulse 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.chatbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:19;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 14px}
.chatbar .in{max-width:560px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600}
.chatbar .in{position:relative}
.chatbar .mic{color:var(--muted)}
.chatbar .mic svg{width:22px;height:22px}
.chatbar .composer .send{display:none}
.chatbar.hasText .composer .send{display:flex}
.chatbar.hasText .composer .mic{display:none}
.composer textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmenu{position:absolute;left:0;bottom:62px;z-index:3;width:min(300px,82vw);padding:8px 6px;border-radius:24px;background:var(--card);
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);
  opacity:0;transform:translateY(10px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:.18s ease}
.chatbar.menuOpen .pmenu{opacity:1;transform:none;pointer-events:auto}
.pmenu button{display:flex;align-items:center;gap:16px;width:100%;padding:15px 16px;text-transform:uppercase;letter-spacing:.09em;font-size:14px;font-weight:700;text-align:left}
.pmenu svg{width:28px;height:28px;color:var(--muted);flex:none}
.recbar{display:none;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:6px 8px;box-shadow:inset 0 0 0 1.5px var(--line),0 0 24px color-mix(in srgb,var(--fat) 35%,transparent)}
.chatbar.recording .recbar{display:flex}
.chatbar.recording .crow{display:none}
.recbar .cbtn{width:42px;height:42px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.recbar .ok{color:var(--fat);font-size:24px}
.wave{flex:1;min-width:0;height:40px;display:flex;align-items:center;justify-content:flex-end;gap:3px;overflow:hidden}
.wave i{width:4px;border-radius:2px;background:var(--muted);transition:height .07s}
.wave i.dot{height:4px;opacity:.5}
.downbtn{position:absolute;left:50%;top:-58px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:20px;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.downbtn.show{opacity:1;transform:none;pointer-events:auto}
.filetag{font-size:13px;font-weight:600;margin-bottom:4px}
.crow{display:flex;gap:10px;align-items:flex-end}
.plusbtn{width:50px;height:50px;border-radius:16px;flex:none;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center}
.composer{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:18px;padding:5px 5px 5px 10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.composer textarea{min-height:0;height:40px;max-height:120px;overflow-y:hidden;background:none;padding:10px 6px;border-radius:0}
.composer .cbtn{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
.composer .send{background:var(--ink);color:var(--on-ink)}
.attach{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.attach img{width:44px;height:44px;border-radius:10px;object-fit:cover}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--on-ink);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hiddenfile{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.code{font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--chip);border-radius:12px;padding:10px 12px;word-break:break-all;max-height:84px;overflow:hidden;color:var(--muted);margin-top:10px}

/* ===== Premium finish: softer depth, hairline edges, a faint sheen in dark mode, and everything reacts to a tap ===== */
:root{
  --shadow:0 0 0 .5px rgba(17,17,26,.06),0 1px 2px rgba(17,17,26,.04),0 10px 26px -12px rgba(17,17,26,.14);
  --sheen:none;--btnimg:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 62%);
  --btnshadow:0 1px 1px rgba(0,0,0,.06),0 10px 22px -12px rgba(0,0,0,.6);
  --fabshadow:0 12px 28px -8px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.16);
  --sheetshadow:0 -12px 44px rgba(0,0,0,.16);--focus:rgba(17,17,19,.3);--press:rgba(17,17,26,.05);
  --spring:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  --shadow:inset 0 .5px 0 rgba(255,255,255,.07),0 0 0 .5px rgba(255,255,255,.045);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 58%);--btnimg:linear-gradient(180deg,#fff,#e2e2e8);
  --btnshadow:0 10px 26px -16px rgba(255,255,255,.45);--fabshadow:0 10px 28px -8px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.25);
  --sheetshadow:inset 0 .5px 0 rgba(255,255,255,.12);--focus:rgba(255,255,255,.35);--press:rgba(255,255,255,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --shadow:inset 0 .5px 0 rgba(255,255,255,.07),0 0 0 .5px rgba(255,255,255,.045);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,0) 58%);--btnimg:linear-gradient(180deg,#fff,#e2e2e8);
  --btnshadow:0 10px 26px -16px rgba(255,255,255,.45);--fabshadow:0 10px 28px -8px rgba(0,0,0,.8),0 0 0 .5px rgba(255,255,255,.25);
  --sheetshadow:inset 0 .5px 0 rgba(255,255,255,.12);--focus:rgba(255,255,255,.35);--press:rgba(255,255,255,.06);
}}
:root[data-bg]{--sheen:none}
.card,.mcard,.list,.entry,.dm,.ing,.empty,.streak,.themebtn,.planchip,.day.sel{background-image:var(--sheen)}
/* Type: tighter headings, steady numbers */
.h2{font-weight:750;letter-spacing:-.022em}
.sheet h3{letter-spacing:-.025em}
.onb h1{letter-spacing:-.035em}
.bignum,.mcard .v,.mini-v,.dm b,.stats3 b,.pd-kcal b,.speedv{font-variant-numeric:tabular-nums}
/* Buttons */
.btn{background-image:var(--btnimg);box-shadow:var(--btnshadow);letter-spacing:-.01em}
.btn.outline{background-image:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{box-shadow:none}
.fab{background-image:var(--btnimg);box-shadow:var(--fabshadow)}
.mini-plus,.composer .send,.chips button{background-image:var(--btnimg)}
.opt.on,.pchips button.on,.pd-seg button.on,.pd-wk button.on,.mp-chips .chipbtn.on{background-image:var(--btnimg);box-shadow:var(--btnshadow)}
/* Tap feedback */
.btn,.chipbtn,.opt,.addtile,.entry,.mini,.calcard,.bigcal,.mpcard,.planchip,.bgrow,.badge,.bmore,.lp-btn,.themebtn,.streak,.pd-seg button,.pd-wk button,.mp-swap,.wbtn,.mini-plus,.sheetx,.onb-back,.mp-back,.circ,.plusbtn,.stepper button,.pd-step button,.day{
  transition:transform .18s var(--spring),background-color .2s,color .2s,box-shadow .2s,opacity .2s}
.btn:active,.chipbtn:active,.opt:active,.lp-btn:active,.themebtn:active,.streak:active,.bmore:active,.bgrow:active,.pd-seg button:active,.pd-wk button:active{transform:scale(.97)}
.addtile:active,.entry:active,.mini:active,.calcard:active,.bigcal:active,.mpcard:active,.planchip:active,.badge:active{transform:scale(.975)}
.mp-swap:active,.wbtn:active,.mini-plus:active,.sheetx:active,.onb-back:active,.mp-back:active,.circ:active,.plusbtn:active,.stepper button:active,.pd-step button:active,.day:active{transform:scale(.9)}
.btn:disabled:active{transform:none}
.li{transition:background-color .15s}
.li:active{background-color:var(--press)}
/* Sheets: blurred page behind, a soft spring up */
.backdrop{background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{box-shadow:var(--sheetshadow);animation:up .42s var(--spring)}
.page{animation:slide .34s var(--spring)}
.sheetx{font-size:13px}
/* Fields: a clear ring while typing */
input:not([type=range]):not(.tinput),select,textarea{transition:box-shadow .2s,background-color .2s}
input:not([type=range]):not(.tinput):focus,select:focus,textarea:focus{box-shadow:inset 0 0 0 1.5px var(--focus)}
.pd-val input:focus,.composer textarea:focus{box-shadow:none}
.composer:focus-within{box-shadow:inset 0 0 0 1.5px var(--focus)}
/* Bars, toast, tab bar */
.tabbar{-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line)}
.tab.on:not(:active) svg{transform:scale(1.06)}
#toast{box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.prog i{transition:width .45s var(--spring)}
.inpop{animation-timing-function:var(--spring)}
.ttip{box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 .5px var(--line)}
.hero.short{background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--flame) 12%,var(--chip)),var(--chip) 70%)}

#busy{position:fixed;inset:0;z-index:2600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;

function sheet(html, mount) {
  closeSheet();
  const b = document.createElement('div');
  b.className = 'backdrop';
  b.innerHTML = `<div class="sheet"><div class="sheethead"><div class="grab"></div><button class="sheetx" aria-label="${T('Close')}">✕</button></div>${html}</div>`;
  b.onclick = e => { if (e.target === b) dismissSheet(); };
  document.body.appendChild(b);
  const sh = b.querySelector('.sheet');
  sh.querySelector('.sheetx').onclick = dismissSheet;
  // Swipe down to close: from the top bar, or anywhere while the sheet is scrolled to the top
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => {
    const onHead = e.target.closest('.sheethead');
    y0 = (onHead || sh.scrollTop <= 0) && !e.target.closest('input,textarea,select') ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && (sh.scrollTop <= 0 || e.target.closest('.sheethead'))) { e.preventDefault(); sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
    else if (dy < 0) y0 = null;
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 === null) return;
    y0 = null; sh.style.transition = 'transform .2s ease';
    if (dy > 90) dismissSheet(); else sh.style.transform = '';
  });
  if (mount) mount(sh);
}
function closeSheet() { document.querySelectorAll('.backdrop').forEach(x => x.remove()); }
// Closing by hand slides the sheet down first
function dismissSheet() {
  const b = $('.backdrop'), sh = b && b.querySelector('.sheet');
  if (!sh) return;
  sh.style.transition = 'transform .2s ease'; sh.style.transform = 'translateY(105%)'; b.style.transition = 'opacity .2s'; b.style.opacity = '0';
  setTimeout(() => b.remove(), 200);
}

// Food names come back in the app language

2. Count only what is there: for an open bottle, glass or cup, estimate how full it is and count only that part.
3. Glasses and cups: small glass about 200 ml, normal glass 250-300 ml, mug 250-350 ml, takeaway cup 250 / 350 / 450 ml (small / medium / large), then adjust for how full it is.
4. Food on plates and in bowls: measure against known sizes in the photo (dinner plate about 26 cm, side plate 20 cm, fork 19 cm, spoon 15 cm, smartphone 15 cm, adult hand about 18 cm long, can 12 cm high). Estimate the area and thickness of each food from that.
5. Drinks and other liquids: "unit" is "ml" and "grams" is the volume in ml. Use the nutrition of exactly that drink: regular lemonade or soda about 35-45 kcal per 100 ml, diet / zero about 0-1, juice about 45, milk (3.5 %) 64, beer 43, wine 83.
6. When unsure, choose the most typical portion of that item, not a large one. Never inflate portions.
Include cooking oils, sauces and dressings. In "notes", say briefly which size you used and why (e.g. "330 ml can, label readable").
Return ONLY JSON in this exact shape:
{"name": "short appetising meal name", "items": [{"name": "ingredient", "grams": 0, "unit": "g", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0, "sugar": 0, "fiber": 0, "sodium": 0}], "health_score": 7, "notes": "short"}
Numbers are for the whole portion (not per 100 g); macros, sugar and fiber in grams, sodium in milligrams. health_score is an integer 1-10 (10 = very healthy: whole foods, high protein and fibre, low sugar). If there is no food, return "items": [] and explain in notes.

/* --- AI engine ---
   Parts format: [{ text }, { image: base64jpeg }]. Tries every free Google model in turn (each has its
   own daily limit), skipping ones that are rate-limited, then Claude if a Claude key is set. */
const getClaudeKey = () => LS.get('ft_claude_key', '');
const hasAI = () => !!(geminiKey() || getClaudeKey());
let lastAI = '';
const GEMINI = [
  { id: 'gemini-3.5-flash-lite' },                                   // fastest, minimal thinking by default
  { id: 'gemini-3.1-flash-lite' },
  { id: 'gemini-3.6-flash', think: { thinkingLevel: 'minimal' } },
  { id: 'gemini-3.8-flash', think: { thinkingLevel: 'low' } },

];
const SLOW_CHAT = 'gemini-3.8-flash';   // thinks first: can take over a minute to start, so only a last resort for chat
const aiErr = (msg, fatal) => Object.assign(new Error(msg), { fatal });
function parseJSON(text) {
  const t = String(text || '').replace(/```(json)?/g, '').trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) try { return JSON.parse(t.slice(a, b + 1)); } catch {}
  throw aiErr(T('The AI gave an unreadable answer. Please try again.'));
}
function untilQuotaReset() { const d = new Date(); d.setUTCHours(8, 5, 0, 0); if (d <= new Date()) d.setUTCDate(d.getUTCDate() + 1); return d - new Date(); }
// Merge consecutive same-role messages so the conversation alternates user/assistant
function normMsgs(msgs) {
  const out = [];
  for (const m of msgs) { const prev = out.at(-1); if (prev && prev.role === m.role) prev.parts = prev.parts.concat(m.parts); else out.push({ role: m.role, parts: [...m.parts] }); }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}
async function askAI(parts, opt = {}) {
  const json = opt.json !== false;
  const msgs = normMsgs([...(opt.history || []), { role: 'user', parts }]);
  const g = geminiKey(), c = getClaudeKey();
  if (!g && !c) throw new Error('NOKEY');
  const prov = [];
  if (g) prov.push(() => geminiChain(g, msgs, opt.system, json, opt.onText, opt.timeout, opt.strong));
  if (c) prov.push(() => claudeCall(c, msgs, opt.system, json, opt.onText));
  if (LS.get('ft_ai_first', 'gemini') === 'claude') prov.reverse();
  let err;
  for (const run of prov) {
    try { const text = await run(); return json ? parseJSON(text) : text; }
    catch (e) { err = e; }
  }
  throw err;
}
const aiMsg = e => e.message === 'NOKEY' ? T('Add your free AI key in Settings first.') : e.message;
// Reads a server-sent-events stream and calls onEvent with each parsed JSON "data:" payload
async function readSSE(res, onEvent) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const data = buf.slice(0, i).split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n');
      buf = buf.slice(i + 2);
      if (data && data !== '[DONE]') { let ev; try { ev = JSON.parse(data); } catch { continue; } onEvent(ev); }
    }
  }
}
async function geminiOnce(key, model, msgs, system, json, onText, ms, stop) {
  const def = GEMINI.find(m => m.id === model) || {};
  const noThink = JSON.parse(LS.get('ft_nothink', '[]'));
  const think = def.think && !noThink.includes(model) ? def.think : null;
  const body = {
    contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user',
      parts: m.parts.map(p => p.image ? { inlineData: { mimeType: 'image/jpeg', data: p.image } } : p.inline ? { inlineData: { mimeType: p.inline.mime, data: p.inline.data } } : { text: p.text }) })),
    generationConfig: { temperature: json ? 0.2 : 0.7, ...(json ? { responseMimeType: 'application/json' } : {}), ...(think ? { thinkingConfig: think } : {}) }
  };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 30000);
  if (stop) { if (stop.aborted) ctl.abort(); else stop.addEventListener('abort', () => ctl.abort()); }
  let res;
  try {
    const viaServer = key === SHARED, method = onText ? 'streamGenerateContent' : 'generateContent';
    const url = viaServer ? `${SERVER_URL}/gemini/${encodeURIComponent(model)}:${method}`
      : `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:${method}${onText ? '?alt=sse' : ''}`;
    res = await fetch(url, { method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', ...(viaServer ? {} : { 'x-goog-api-key': key }) }, body: JSON.stringify(body) });
  } catch (e) { if (stop && stop.aborted) return { ok: false, status: -1, msg: 'stopped' }; return { ok: false, status: e.name === 'AbortError' ? 504 : 0, msg: e.name === 'AbortError' ? 'took too long' : 'no connection' }; }
  finally { clearTimeout(timer); }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    const msg = (Array.isArray(data) ? data[0] : data)?.error?.message || 'HTTP ' + res.status;
    if (think && res.status === 400 && /think/i.test(msg)) { noThink.push(model); LS.set('ft_nothink', JSON.stringify(noThink)); return geminiOnce(key, model, msgs, system, json, onText, ms, stop); }
    return { ok: false, status: res.status, msg };
  }
  if (onText) {
    let full = '', why = '';
    try {
      await readSSE(res, ev => {
        const c = ev.candidates?.[0];
        const piece = (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
        if (piece) { full += piece; onText(full); }
        if (c?.finishReason) why = c.finishReason;
      });
    } catch { if (stop && stop.aborted) return { ok: false, status: -1, msg: 'stopped' }; if (!full) return { ok: false, status: 0, msg: 'connection lost' }; }
    return full ? { ok: true, text: full } : { ok: false, status: 500, msg: 'empty answer (' + (why || 'unknown') + ')' };
  }
  const data = await res.json().catch(() => ({}));
  const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  return text ? { ok: true, text } : { ok: false, status: 500, msg: 'empty answer (' + (data.candidates?.[0]?.finishReason || data.promptFeedback?.blockReason || 'unknown') + ')' };
}

const devId = () => { let d = LS.get('ft_dev', ''); if (!/^[a-f0-9]{32}$/.test(d)) { d = hexOf(crypto.getRandomValues(new Uint8Array(16))); LS.set('ft_dev', d); } return d; };
async function geminiChain(key, msgs, system, json, onText, ms, strong) {
  const cool = JSON.parse(LS.get('ft_cool', '{}')), now = Date.now();
  let list = GEMINI.map(m => m.id);

  if (custom) list = [custom, ...list.filter(x => x !== custom)];

  let err = aiErr(getClaudeKey() || !isAdmin() ? T('All free Google AI models are busy right now. Try again in a minute.') : T('All free Google AI models are busy right now. Try again in a minute, or add a Claude key in Settings.'));

  // What a failed try means: count it, rest that model for a while, or stop for good (no internet, wrong key)
  const failed = (model, r) => {

    if (r.status === 0 && ++offline >= 2) throw aiErr(T('No connection to the AI. Check your internet.'));
    if (key !== SHARED && (/api[_ ]?key|API_KEY_INVALID|unauthenticated/i.test(r.msg) || r.status === 401)) throw aiErr(T('Your Google AI key was rejected. Check it in Settings.'), true);

    if (r.status === 429) wait = /day|PerDay/i.test(r.msg) ? untilQuotaReset() : 60e3;

  };

  // Whichever writes first wins and the other is stopped, so a slow or busy model never keeps people waiting.
  if (onText && !strong) return await new Promise((resolve, reject) => {

async function claudeCall(key, msgs, system, json, onText) {
  const model = LS.get('ft_claude_model', '') || 'claude-opus-5-5', isOpus = model === 'claude-opus-5-5';
  const jsonRule = 'Respond with only the JSON object, no other text.';
  const body = {
    model, max_tokens: 8000, output_config: { effort: 'low' },
    messages: msgs.map(m => ({ role: m.role, content: m.parts.map(p => p.image
      ? { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.image } }
      : p.inline ? (p.inline.mime === 'application/pdf' ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: p.inline.data } } : { type: 'text', text: '[attachment type not supported]' })
      : { type: 'text', text: p.text }) }))
  };
  if (system || json) body.system = [system, json ? jsonRule : ''].filter(Boolean).join('\n\n');
  if (isOpus) body.fallbacks = 'default';   // re-runs a declined request on Anthropic's recommended fallback model
  if (onText) body.stream = true;

    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', body: JSON.stringify(body), headers: {
      'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',

    let full = '', stop = '', err = '';

      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { full += ev.delta.text; onText(full); }
      else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
      else if (ev.type === 'error') err = ev.error?.message || 'stream error';
    }).catch(() => { err = err || 'connection lost'; });
    if (stop === 'refusal') throw aiErr(T('Claude declined this request.'));
    if (!full) throw aiErr(err ? 'Claude: ' + err : T('Claude gave an empty answer. Please try again.'));
    lastAI = 'Claude'; return full;
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || 'HTTP ' + res.status;
    if (res.status === 401 || res.status === 403) throw aiErr(T('Your Claude key was rejected. Check it in Settings.'));
    if (/credit balance/i.test(msg)) throw aiErr(T('Your Claude account has no credit left. Add credit at console.anthropic.com.'));
    if (res.status === 429 || res.status === 529) throw aiErr(T('Claude is busy right now. Try again in a moment.'));
    throw aiErr('Claude: ' + msg);
  }
  if (data.stop_reason === 'refusal') throw aiErr(T('Claude declined this request.'));
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if (!text) throw aiErr(T('Claude gave an empty answer. Please try again.'));
  lastAI = 'Claude'; return text;
}

/* Photos and descriptions waiting to be analysed are also kept on the phone (IndexedDB), so nothing is lost

function savePendingQ() {

// Really offline? (the phone's own flag, plus a tiny request to the server to be sure)
async function isOffline() {

async function processQueue() {

  qBusy = true;

    for (const p of pending.filter(x => x.status === 'waiting')) { await runAnalysis(p); if (p.status === 'waiting') break; }   // still offline: try later
  } finally { qBusy = false; }
}
function addPending(preview, parts, at = {}) {
  const p = { id: at.id || uid(), date: at.date || sel, time: at.time || nowTime(), preview, parts, pct: 2, status: 'analyzing' };
  pending.unshift(p); savePendingQ();
  if (tab !== 'home') go('home'); else renderHome();
  if (!navigator.onLine) { p.status = 'waiting'; toast(T('No internet. Saved, it will be analysed automatically.')); renderHome(); return; }

async function runAnalysis(p) {

    p.pct += (95 - p.pct) * 0.045;

  }, 200);
  if (tab === 'home') renderHome();
  try {
    const res = await askAI(p.parts);
    const items = normItems(res.items);
    if (!items.length) throw new Error(res.notes || T('No food recognised. Try a clearer photo.'));
    const m = { id: p.id, date: p.date, time: p.time, name: res.name || items.map(i => i.name).join(', '), items, servings: 1,
      health: healthOf(res.health_score), source: p.preview ? 'photo' : 'text', photo: !!p.preview };
    if (p.preview) { await idb.set(m.id, p.preview); photoCache[m.id] = p.preview; }
    db.meals.push(m); save();
    clearInterval(p.timer); pending = pending.filter(x => x !== p);

  } catch (e) {

}

/* ================= Account & automatic backup =================
   People sign up with their email and a password (the iPhone can save it in its Keychain, so there's
   nothing to remember). Once a day the app saves an encrypted copy of the data on the Food Tracker server.
   The key comes from the password and never leaves the phone, so nobody else (not even the app owner)
   can read it. Meal photos are saved too (see photoSync). Signing in on a new phone brings everything back.

/* ================= Rewards: celebrations, badges, goal reached, maintenance =================
   Friendly motivation only: real progress is celebrated, nothing is ever taken away or used to
   make people feel guilty. */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = Math.min(2, devicePixelRatio || 1), W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr, x = c.getContext('2d');
  const cols = ['#ff9500', '#34c759', '#4b8cf5', '#e3605b', '#f5b83d', '#af52de'];
  const ps = [...Array(150)].map((_, i) => ({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.4, vx: (Math.random() - 0.5) * 20 * dpr,
    vy: (-Math.random() * 17 - 7) * dpr, s: (6 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] }));
  const t0 = performance.now();
  const step = now => {
    const el = now - t0; x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += 0.55 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - el / 2800); x.fillStyle = p.c;
      x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    }
    if (el < 2800) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

// Progress towards the weight goal (start = weight when the goal was set, or the first weigh-in)
// Trend weight, made for one weigh-in a week: a straight line through the weigh-ins of the last 6 weeks,
// read at the latest one. One heavy or light morning barely moves it, and unlike an average it doesn't lag
// behind real progress. With fewer than 3 weigh-ins it is simply the latest weight.
function trendWeight() {
  const ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
  if (!ws.length) return currentWeight();
  const last = ws.at(-1), rec = ws.filter(w => daysBetween(w.date, last.date) <= 42);
  if (rec.length < 3 || daysBetween(rec[0].date, last.date) < 10) return last.kg;
  const xs = rec.map(w => -daysBetween(w.date, last.date)), mx = xs.reduce((a, b) => a + b) / xs.length, my = rec.reduce((a, w) => a + w.kg, 0) / rec.length;

}
// Progress towards the weight goal, based on the trend: how far along, kilos and weeks to go, and whether

  const days = Math.max(0, daysBetween(startDate, iso())), shouldBe = Math.min(total, (p.pace || 0) * days / 7), diff = done - shouldBe;
  const since = ws.filter(w => w.date > startDate).length;   // weekly weigh-ins since the start
  const status = days < 14 || since < 2 ? 'new' : diff > 0.4 ? 'ahead' : diff < -0.6 ? 'behind' : 'on';
  return { start, cur, tgt, kgDone: r1(Math.max(0, done)), pct: total ? clamp(done / total * 100, 0, 100) : 100, reached: up ? cur >= tgt : cur <= tgt,
    toGo: r1(toGo), weeks, status, shouldBe: r1(up ? start + shouldBe : start - shouldBe), days };
}
const goalStatusText = st => ({ new: '🌱 ' + T('Just started'), on: '✓ ' + T('On track'), ahead: '🚀 ' + T('Ahead of plan'), behind: '⏳ ' + T('A bit behind') })[st];
const goalLine = gp => gp.reached ? '🏁 ' + T('Goal reached') : `${T('{w} kg to go', { w: gp.toGo })}${gp.weeks ? ' · ' + T('~{n} weeks', { n: gp.weeks }) : ''} · ${goalStatusText(gp.status)}`;

/* Reminders that are already done today aren't sent: the phone tells the server "done" (only which
   reminder and the date, no numbers). Checked after every change and whenever the app opens. */
async function syncDone() {
  if (!SERVER_URL || !db.profile) return;
  let sub; try { sub = JSON.parse(LS.get('ft_push', 'null')); } catch {}
  if (!sub || !sub.endpoint) return;
  const today = iso(), sent = JSON.parse(LS.get('ft_done_sent', '{}')), todo = [], pf = pushPrefs(), now = new Date(), hr = now.getHours(), wd = now.getDay();
  // The server can send a reminder up to 3 hours after its time; after that a "done" note changes nothing
  if (pf.burn >= 0 && hr < pf.burn + 3 && dayBurned(today) > 0) todo.push(['burn', today]);
  const lastW = db.weights.map(w => w.date).sort().pop();
  if (pf.wDay >= 0 && lastW) {
    let until = (pf.wDay - wd + 7) % 7; if (until === 0 && hr >= pf.wTime + 3) until = 7;
    if (daysBetween(lastW, today) + until <= 3) todo.push(['weight', lastW]);   // the weigh-in reminder is skipped within 3 days of a weigh-in
  }
  if (pf.ci >= 0 && wd === (pf.cd ?? 0) && hr < pf.ci + 3 && LS.get('ft_checkin', '') === today) todo.push(['checkin', today]);
  for (const [kind, date] of todo) {
    if (sent[kind] === date) continue;
    try {
      const r = await fetch(SERVER_URL + '/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint, kind, date }) });
      if (r.ok || r.status === 404) { sent[kind] = date; LS.set('ft_done_sent', JSON.stringify(sent)); }

}

  if (!L || !SERVER_URL || linkBusy) return;
  // Fresh numbers whenever someone looks: every 5 minutes on its own, after 1 minute when they open the burned-calories window
  if (!force && Date.now() - (L.tried || 0) < (force === 0 ? 60e3 : 5 * 60e3)) return;
  linkBusy = true; L.tried = Date.now();
  const post = (path, body) => fetch(SERVER_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let changed = false;
  try {
    if (L.p === 'apple') {
      const r = await post('/health/pull', { code: healthCode() });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const got = await r.json(), list = Array.isArray(got) ? got : Object.entries(got).map(([d, k]) => ({ d, k, t: 0 })), best = {};
      for (const x of list) { const d = x.d || iso(new Date(x.t)); if (!best[d] || x.t >= best[d].t) best[d] = x; }
      for (const [d, x] of Object.entries(best)) changed = applyAutoBurn(d, x.k, 'apple') || changed;
      if (list.length) { L.ok = Date.now(); L.last = Math.max(...list.map(x => x.t || 0)); L.err = ''; }
      L.warn = shortcutCheck(list);
    } else {
      // Keys still on this phone (connected with an older version): hand them to the server's vault once
      if (!L.vid && (L.refresh || L.access)) {
        try {
          const r = await post('/link/vault/new', { p: L.p, access: L.access, refresh: L.refresh, exp: L.exp });
          if (r.ok) { const v = await r.json(); if (v.vid) { L.vid = v.vid; L.vs = v.vs; delete L.access; delete L.refresh; delete L.exp; LS.set('ft_link', JSON.stringify(L)); } }
        } catch {}
      }
      let days;
      if (L.vid) {   // the server renews the key itself and keeps it safe, so the connection does not expire
        const r = await post(`/link/${L.p}/vault`, { vid: L.vid, vs: L.vs, from: addDays(iso(), -1), to: iso() });
        if (r.status === 401) throw new Error('reconnect');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        ({ days } = await r.json());
      } else {
      const refresh = async () => {
        if (!L.refresh) throw new Error('reconnect');
        const r = await post(`/link/${L.p}/refresh`, { refresh: L.refresh });
        if (!r.ok) throw new Error(r.status === 401 ? 'reconnect' : 'HTTP ' + r.status);
        const t = await r.json(); L.access = t.access; if (t.refresh) L.refresh = t.refresh; L.exp = t.exp;
        LS.set('ft_link', JSON.stringify(L));   // the old key stops working, so save the new one right away
      };
      if (L.exp && Date.now() > L.exp) await refresh();
      const ask = () => post(`/link/${L.p}/data`, { access: L.access, from: addDays(iso(), -1), to: iso() });
      let r = await ask();
      if (r.status === 401) { await refresh(); r = await ask(); }
      if (r.status === 401) throw new Error('reconnect');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      ({ days } = await r.json());
      }
      const bmr = targets().bmr || 1600;
      for (const d of days || []) {
        // WHOOP gives the total burn incl. what the body burns at rest; the app wants the active part
        // Oura, Polar, Withings: the active part directly, plus their total (shown like in their own app)
        if (d.active != null) { const tt = num(d.total); changed = applyAutoBurn(d.date, d.active, L.p, tt > 0 ? { total: tt, rest: Math.max(0, tt - num(d.active)) } : null) || changed; continue; }
        const rest = bmr * Math.min(30, d.hours || 24) / 24;   // what the body burns at rest in that time (already in the daily goal)
        changed = applyAutoBurn(d.date, Math.max(0, (d.total || 0) - rest), L.p, { total: d.total || 0, rest }) || changed;
      }
      L.ok = Date.now(); L.err = '';
    }
  } catch (e) { L.err = e.message === 'reconnect' ? 'reconnect' : 'net'; }
  finally {
    LS.set('ft_link', JSON.stringify(L)); linkBusy = false;
    if (changed) { save(); if (tab === 'home' && !$('.page')) renderHome(); }
    if (changed && $('#bKcal') && !$('#bKcal').value && !$('#bName').value) openBurnSheet();   // the open burned-calories window shows the new numbers
    if ($('#trkSheet')) openTrackerSheet();
  }
}

// Signs that the Shortcut is set up wrong (e.g. a fixed date instead of "is today", or "in the last 7 days")
function shortcutCheck(list) {
  const days = {};
  for (const x of list) { const t = x.t || Date.parse((x.d || '') + 'T20:00:00'); if (!t) continue; const d = x.d || iso(new Date(t)); if (!days[d] || t >= days[d].t) days[d] = { k: num(x.k), t }; }
  const v = Object.entries(days).sort((a, b) => a[0] < b[0] ? -1 : 1).map(([d, x]) => ({ d, ...x })).slice(-5);
  const big = v.find(x => x.k > 4000); if (big) return { why: 'many', n: r0(big.k) };
  for (let i = 1; i < v.length; i++) if (v[i].k > 0 && v[i].k === v[i - 1].k) return { why: 'stuck', n: r0(v[i].k) };
  const zeroEve = v.filter(x => x.k === 0 && new Date(x.t).getHours() >= 17);
  if (zeroEve.length >= 2) return { why: 'zero', n: 0 };
  return null;
}

/* ================= Accessibility =================
   Screen readers read a name for every button and field. Icon-only buttons and fields whose label is a
   separate line get one automatically, also in windows added later. Elements acting as buttons work with Enter/Space. */
const A11Y_SYM = { '‹': N('Back'), '←': N('Back'), '›': N('Next'), '→': N('Next'), '＋': N('Add'), '+': N('Add'), '−': N('Remove'), '✕': N('Close'), '×': N('Close'), '✓': N('Done'), '↻': N('Refresh'), '✨': 'AI', '⌄': N('More') };
function a11yFix(root) {
  if (!root || !root.querySelectorAll) return;
  for (const b of root.querySelectorAll('button:not([aria-label]), [role=button]:not([aria-label])')) {
    const t = (b.innerText || '').trim();
    if (/[\p{L}\p{N}]{2,}/u.test(t.replace(/[\u{1F000}-\u{1FFFF}]/gu, ''))) continue;   // has real words: fine
    const k = Object.keys(A11Y_SYM).find(x => t.includes(x)) ;
    if (k) b.setAttribute('aria-label', T(A11Y_SYM[k]));
  }
  for (const f of root.querySelectorAll('input:not([type=hidden]):not([aria-label]), select:not([aria-label]), textarea:not([aria-label])')) {
    if (f.closest('label') || (f.id && root.querySelector(`label[for="${CSS.escape(f.id)}"]`)) || f.placeholder) continue;
    let el = f, name = '';
    for (let i = 0; i < 4 && el && !name; i++) {   // the nearest text label before the field
      let prev = el.previousElementSibling;
      while (prev && !name) { const tx = (prev.innerText || '').trim(); if (tx && tx.length < 60) name = tx; prev = prev.previousElementSibling; }
      el = el.parentElement;
    }
    if (name) f.setAttribute('aria-label', name.replace(/\s+/g, ' '));
  }
}
new MutationObserver(list => { for (const m of list) for (const n of m.addedNodes) if (n.nodeType === 1) a11yFix(n.parentElement || n); }).observe(document.body, { childList: true, subtree: true });
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); }
});

    tip.querySelector('.ttip-x').textContent = T(s.text);
    tip.querySelector('.ttip-back').style.visibility = i ? '' : 'hidden';

}

    const r = await askAI([{ text: 'Read the barcode number (EAN-13, EAN-8 or UPC-A) in this photo. Use the digits printed under the bars, or read the bars. Return ONLY JSON {"code": "digits only, or empty if you cannot read it"}' }, { image: dataUrl.split(',')[1] }]);

  const train = { '0': 0, '1-2': 150, '0-2': 0, '3-5': 350, '6+': 600 }[p.workouts] || 0, burned = dayBurned(d);
