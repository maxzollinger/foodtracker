<style>
:root{
  color-scheme:light;
  --bg:#f7f7f9;--card:#fff;--text:#111113;--muted:#8e8e93;--line:#ececf0;--track:#efeff3;
  --ink:#111113;--on-ink:#fff;--chip:#f2f2f5;
  --protein:#e3605b;--carbs:#ef9f45;--fat:#4b8cf5;--flame:#ff9500;--good:#34c759;--bad:#ff3b30;--water:#3aa0ff;
  --shadow:0 2px 14px rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#2c2c2e;--track:#2c2c2e;
  --ink:#f5f5f7;--on-ink:#000;--chip:#2c2c2e;--shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#2c2c2e;--track:#2c2c2e;
    --ink:#f5f5f7;--on-ink:#000;--chip:#2c2c2e;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Backgrounds (Settings → Appearance → Background): a soft colour gradient behind the app, like Revolut.
   Cards turn slightly see-through so the colour shows; sheets and pop-ups stay solid. */
:root[data-bg="midnight"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#e8eafc 45%,#d9dcff 100%);--bg:#eceefb}
:root[data-theme="dark"][data-bg="midnight"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#020208 0%,#0d0e30 45%,#24288a 100%);--bg:#050613}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="midnight"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#020208 0%,#0d0e30 45%,#24288a 100%);--bg:#050613}}
:root[data-bg="violet"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#eee9fc 45%,#e4dbff 100%);--bg:#f0edfb}
:root[data-theme="dark"][data-bg="violet"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#030208 0%,#140c2f 45%,#3a2386 100%);--bg:#080513}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="violet"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#030208 0%,#140c2f 45%,#3a2386 100%);--bg:#080513}}
:root[data-bg="plum"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#f3e8f8 45%,#efdaf7 100%);--bg:#f4edf8}
:root[data-theme="dark"][data-bg="plum"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#040106 0%,#1a0825 45%,#4a1869 100%);--bg:#0a030f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="plum"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#040106 0%,#1a0825 45%,#4a1869 100%);--bg:#0a030f}}
:root[data-bg="ocean"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#e6eefc 45%,#d5e4ff 100%);--bg:#ebf0fb}
:root[data-theme="dark"][data-bg="ocean"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#010307 0%,#040f2a 45%,#0c2c78 100%);--bg:#020611}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="ocean"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#010307 0%,#040f2a 45%,#0c2c78 100%);--bg:#020611}}
:root[data-bg="forest"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#e5f2ea 45%,#d3eedb 100%);--bg:#eaf4ee}
:root[data-theme="dark"][data-bg="forest"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#010402 0%,#041a0d 45%,#0c4a26 100%);--bg:#020a05}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="forest"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#010402 0%,#041a0d 45%,#0c4a26 100%);--bg:#020a05}}
:root[data-bg="emerald"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#e3f3ee 45%,#cfefe3 100%);--bg:#e9f4f1}
:root[data-theme="dark"][data-bg="emerald"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#000503 0%,#021c14 45%,#05503a 100%);--bg:#010b08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="emerald"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#000503 0%,#021c14 45%,#05503a 100%);--bg:#010b08}}
:root[data-bg="slate"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#e7eff0 45%,#d7e7e7 100%);--bg:#ecf1f3}
:root[data-theme="dark"][data-bg="slate"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#010303 0%,#071314 45%,#14373a 100%);--bg:#030808}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="slate"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#010303 0%,#071314 45%,#14373a 100%);--bg:#030808}}
:root[data-bg="berry"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#f7e6ee 45%,#f7d5e3 100%);--bg:#f7ebf1}
:root[data-theme="dark"][data-bg="berry"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#050103 0%,#1e0610 45%,#55102f 100%);--bg:#0c0207}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="berry"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#050103 0%,#1e0610 45%,#55102f 100%);--bg:#0c0207}}
:root[data-bg="copper"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#f5ebe6 45%,#f3dfd4 100%);--bg:#f6efec}
:root[data-theme="dark"][data-bg="copper"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#050202 0%,#1d0e09 45%,#53291b 100%);--bg:#0c0604}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="copper"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#050202 0%,#1d0e09 45%,#53291b 100%);--bg:#0c0604}}
:root[data-bg="amber"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#f6eede 45%,#f6e6c4 100%);--bg:#f7f1e6}
:root[data-theme="dark"][data-bg="amber"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#050301 0%,#1e1404 45%,#57380a 100%);--bg:#0c0801}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="amber"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#050301 0%,#1e1404 45%,#57380a 100%);--bg:#0c0801}}
:root[data-bg="graphite"]{--bgimg:linear-gradient(180deg,#f7f7f9 0%,#ededf0 45%,#e3e3e8 100%);--bg:#f0f0f3}
:root[data-theme="dark"][data-bg="graphite"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#030303 0%,#0f0f12 45%,#2c2c33 100%);--bg:#060607}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg="graphite"]{--bgimg:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.6),transparent 75%),linear-gradient(180deg,#030303 0%,#0f0f12 45%,#2c2c33 100%);--bg:#060607}}
:root[data-bg]{--card:rgba(255,255,255,.74);--chip:rgba(0,0,0,.045);--line:rgba(0,0,0,.07);--track:rgba(0,0,0,.07);--solid:#fff}
:root[data-theme="dark"][data-bg]{--card:rgba(255,255,255,.075);--chip:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--solid:#1c1c1e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg]{--card:rgba(255,255,255,.075);--chip:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--track:rgba(255,255,255,.12);--solid:#1c1c1e}}
html[data-bg]{background:var(--bgimg) var(--bg)}
:root[data-bg] body{background:transparent}
:root[data-bg] #chatScreen{background:transparent}
:root[data-bg] .chatbar,:root[data-bg] .dfoot{background:transparent}
:root[data-bg] .sheet,:root[data-bg] .sheethead,:root[data-bg] .celcard,:root[data-bg] .ttip,:root[data-bg] .pmenu{background:var(--solid)}
:root[data-bg] .seg button.on{background:var(--solid)}
.bgrow{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:10px 12px 10px 10px;border-radius:16px;background:var(--chip);text-align:left}
.bgthumb{width:34px;height:44px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.bggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.bgtile{aspect-ratio:3/4;border-radius:18px;position:relative;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);transition:transform .15s}
.bgtile:active{transform:scale(.96)}
.bgtile.on{box-shadow:0 0 0 3px var(--solid,var(--card)),0 0 0 5.5px var(--text)}
.bgtile span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;font-weight:700;color:var(--tc)}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
body{transition:background .25s;overflow:hidden;height:100%}
html{height:100%;overflow:hidden}
#scroller{position:fixed;left:0;right:0;top:0;bottom:var(--tabh,82px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#scroller #view{padding-bottom:36px}
/* Soft fade at the bottom edge so the page blends into the tab bar instead of stopping at a hard line */
#scroller,.msgscroll{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.tabbar{border-top-color:transparent}
body.chatting #scroller{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);width:100%;padding:14px 16px;border-radius:14px;
  border:0;background:var(--chip);outline:none}
textarea{resize:none;min-height:96px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:22px 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:var(--on-ink);
  border-radius:999px;padding:17px;font-weight:600;font-size:17px}
.btn:disabled{opacity:.3}
.btn.outline{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{width:auto;padding:10px 18px;font-size:15px}
.chipbtn{background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}

/* Rings */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}

/* Header + week */
.top{padding:calc(8px + env(safe-area-inset-top)) 0 4px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand img{width:30px;height:30px;border-radius:8px}
.brand,.chipbtn{white-space:nowrap}
.streak{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;box-shadow:var(--shadow)}
.themebtn{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:17px}
.week{display:flex;align-items:center;margin:12px -6px 14px}
.week .nav{width:22px;color:var(--muted);font-size:20px}
.days{flex:1;display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 5px;border-radius:16px;min-width:42px}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.future{opacity:.35;pointer-events:none}
.day .dl{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  border:2px dashed var(--line)}
.day .dn.logged{border:2px solid var(--text)}
.day .dn.over{border:2px solid var(--bad)}

/* Home cards */
.calcard{display:flex;justify-content:space-between;align-items:center;padding:24px 22px}
.bignum{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.bignum small{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.mcard{background:var(--card);border-radius:20px;padding:16px 12px 14px;box-shadow:var(--shadow);text-align:left}
.mcard .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.mcard .v small{font-size:13px;color:var(--muted);font-weight:600}
.mcard .l{font-size:12.5px;color:var(--muted);margin:2px 0 12px;font-weight:500}
.mcard .ring{margin:0 auto}
.burncard{display:flex;align-items:center;gap:14px;margin-top:4px;flex-wrap:wrap}
.burncard .note{flex-basis:100%;margin-top:-4px}
.hcard .spread{flex-wrap:wrap;row-gap:4px}
.hcard .spread>span:first-child{white-space:nowrap}
.burncard .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.planchip{display:flex;width:100%;align-items:center;flex-wrap:wrap;gap:4px 8px;max-width:100%;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:8px 14px;font-size:14px;margin:0 0 12px;text-align:left}
.planchip>*{white-space:nowrap}
.frow{margin-top:12px}
.frow .spread{font-size:14px}
.opt.cmp{padding:14px 16px;font-size:16px;margin-bottom:8px}
.hcard{padding:13px 16px}
.hcard .hscale{height:7px;border-radius:4px;background:linear-gradient(90deg,#ff5a4f 0%,#f5b83d 45%,#34c759 75%,#1fa64a 100%);position:relative;margin:11px 0 5px}
.hcard .hscale b{position:absolute;top:-5px;width:17px;height:17px;border-radius:50%;background:var(--card);border:3px solid var(--text);transform:translateX(-50%);transition:left .6s ease}

/* Entries */
.entry{display:flex;gap:12px;background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:92px;height:92px;border-radius:14px;flex:none;background:var(--chip);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.einfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-right:4px}
.ename{font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.einfo>.spread{align-items:flex-start}
.etime{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 8px;border-radius:999px;flex:none}
.ecal{font-weight:700;font-size:15px}
.emac{display:flex;gap:12px;font-size:13px;color:var(--muted);font-weight:500}
.skel{height:10px;border-radius:6px;background:var(--chip);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.empty{text-align:center;padding:30px 20px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.empty b{display:block;font-size:17px;margin-bottom:6px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:8px 18px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-width:0}

.fab{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);margin:-26px 0 0 18px;flex:none}

/* Smooth page switches: the new page fades and glides in; tab icons react to taps */
.tab{transition:color .25s ease}
.tab svg{transition:transform .18s ease}
.tab:active svg{transform:scale(.86)}
.fab{animation:fabIn .3s cubic-bezier(.2,1.4,.4,1)}
.fab:active{transform:scale(.92)}
@keyframes fabIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#view.pagein{animation:pageIn .5s cubic-bezier(.22,.75,.25,1)}
#chatScreen.pagein{animation:pageFade .45s ease}
#chatScreen.pagein #msgScroll{animation:pageIn .5s cubic-bezier(.22,.75,.25,1)}

@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@keyframes pageOut{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){#view.pagein,#chatScreen.pagein,#chatScreen.pagein #msgScroll,#view.pageout,#chatScreen.pageout,.fab{animation:none}}

/* Sheets & pages */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}

  padding:8px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}

.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.bkcode{margin:14px 0;padding:14px 10px;border-radius:14px;background:var(--chip);font:800 20px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-align:center;user-select:all;-webkit-user-select:all}
.barlive{margin-top:14px;border-radius:18px;overflow:hidden;background:#000;min-height:140px;position:relative}
.barlive video{width:100%;aspect-ratio:4/3;display:block;object-fit:cover}
.barframe{position:absolute;left:10%;right:10%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.92);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}

/* Progress */
.pills{display:flex;gap:6px;background:var(--chip);border-radius:999px;padding:4px}

.msg li{margin:3px 0}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}

@keyframes blink{50%{opacity:0}}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:pulse 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.chatbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:19;background:color-mix(in srgb,var(--bg) 92%,transparent);

.chatbar .in{position:relative}

.chatbar.hasText .composer .mic{display:none}

.pmenu{position:absolute;left:0;bottom:62px;z-index:3;width:min(300px,82vw);padding:8px 6px;border-radius:24px;background:var(--card);
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);

.chatbar.recording .recbar{display:flex}

.wave i.dot{height:4px;opacity:.5}
.downbtn{position:absolute;left:50%;top:-58px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:20px;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.downbtn.show{opacity:1;transform:none;pointer-events:auto}
.filetag{font-size:13px;font-weight:600;margin-bottom:4px}

.plusbtn{width:50px;height:50px;border-radius:16px;flex:none;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center}

  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100% - 32px);text-align:center}

<!-- Launch animation: food flies into the ring, the ring fills like a calorie ring, the dot pops, the name appears -->
<div id="splash" aria-hidden="true">
  <style>
    #splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;
      background:radial-gradient(120% 75% at 50% 42%,#221c16 0%,#0b0b0d 62%);transition:opacity 0.675s ease}
    #splash.out{opacity:0;pointer-events:none}
    #splash .sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform 0.675s ease}
    #splash.out .sp-stage{transform:scale(1.06)}
    #splash .sp-stage{backface-visibility:hidden;-webkit-backface-visibility:hidden}
    #splash .sp-logo{position:relative;width:124px;height:124px;overflow:visible}
    #splash .sp-glow{position:absolute;left:50%;top:62px;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,149,0,.20) 0%,rgba(255,149,0,.08) 35%,rgba(255,149,0,0) 68%);opacity:0;animation:spGlow 1.2s ease .3s forwards}
    @keyframes spGlow{to{opacity:1}}
    #splash .sp-sq{transform-origin:60px 60px;animation:spSq 0.9s cubic-bezier(.2,1.5,.4,1) both}
    #splash .sp-ring{stroke-dasharray:83.33 100;stroke-dashoffset:83.33;animation:spRing 1.575s cubic-bezier(.65,0,.25,1) 0.375s forwards}
    #splash .sp-dot{transform-origin:76.8px 30.9px;transform:scale(0);animation:spDot 0.75s cubic-bezier(.2,1.7,.4,1) 1.875s forwards}
    #splash .sp-pulse{fill:none;stroke:#ff9500;stroke-width:2.5;opacity:0;transform-origin:76.8px 30.9px;animation:spPulse 1.275s ease-out 1.95s}
    #splash .sp-food{position:absolute;left:50%;top:62px;width:36px;height:36px;margin:-18px 0 0 -18px;font-size:30px;line-height:36px;text-align:center;
      opacity:0;animation:spFly 1.125s cubic-bezier(.55,0,.8,.2) var(--d) both}
    #splash .sp-spark{position:absolute;left:calc(50% + 17px);top:30px;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#ffb340;
      opacity:0;animation:spSpark 0.975s cubic-bezier(.2,.8,.3,1) 1.98s}
    #splash .sp-title{margin-top:28px;display:flex;font:800 38px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;letter-spacing:-.035em;color:#fff}
    #splash .sp-title span{display:inline-block;opacity:0;transform:translateY(20px) scale(.9);animation:spUp 0.825s cubic-bezier(.2,1.3,.4,1) calc(2.1s + var(--i) * 0.068s) forwards}
    #splash .sp-title .o{color:#ff9f1c}
    #splash .sp-line{height:3px;width:0;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,#ff8a00,#ffcc66);animation:spLine 0.825s cubic-bezier(.6,0,.2,1) 2.925s forwards}
    @keyframes spSq{from{transform:scale(.15) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes spRing{to{stroke-dashoffset:0}}
    @keyframes spDot{0%{transform:scale(0)}55%{transform:scale(1.6)}100%{transform:scale(1)}}
    @keyframes spPulse{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(3.4)}}
    @keyframes spFly{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.15) rotate(var(--r))}18%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(.12) rotate(0deg)}}
    @keyframes spSpark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
    @keyframes spUp{to{opacity:1;transform:none}}
    @keyframes spLine{to{width:72px}}
    @media (prefers-reduced-motion:reduce){#splash *{animation-duration:0.015s!important;animation-delay:0s!important}}
  </style>
  <div class="sp-stage">
    <span class="sp-food" style="--x:-150px;--y:-190px;--r:-40deg;--d:0.15s">🥑</span>
    <span class="sp-food" style="--x:160px;--y:-170px;--r:35deg;--d:0.33s">🍗</span>
    <span class="sp-food" style="--x:-185px;--y:20px;--r:-25deg;--d:0.51s">🍎</span>
    <span class="sp-food" style="--x:185px;--y:40px;--r:30deg;--d:0.66s">🥦</span>
    <span class="sp-food" style="--x:-110px;--y:200px;--r:-35deg;--d:0.81s">🍳</span>
    <span class="sp-food" style="--x:120px;--y:210px;--r:45deg;--d:0.945s">🍌</span>
    <span class="sp-food" style="--x:0px;--y:-240px;--r:20deg;--d:1.08s">🍣</span>
    <div class="sp-glow"></div>
    <svg class="sp-logo" viewBox="0 0 120 120">
      <rect class="sp-sq" width="120" height="120" rx="28" fill="#141416" stroke="rgba(255,255,255,.08)"/>
      <circle class="sp-ring" cx="60" cy="60" r="33.6" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" pathLength="100" transform="rotate(-60 60 60)"/>
      <circle class="sp-pulse" cx="76.8" cy="30.9" r="9"/>
      <circle class="sp-dot" cx="76.8" cy="30.9" r="9" fill="#ff9500"/>
    </svg>
    <span class="sp-spark" style="--x:46px;--y:-30px"></span><span class="sp-spark" style="--x:52px;--y:10px"></span>
    <span class="sp-spark" style="--x:18px;--y:-52px"></span><span class="sp-spark" style="--x:-14px;--y:-48px"></span>
    <span class="sp-spark" style="--x:36px;--y:38px"></span><span class="sp-spark" style="--x:58px;--y:-12px"></span>
    <div class="sp-title"><span style="--i:0">F</span><span style="--i:1">o</span><span style="--i:2">o</span><span style="--i:3">d</span><span style="--i:4">&nbsp;</span><span class="o" style="--i:5">T</span><span class="o" style="--i:6">r</span><span class="o" style="--i:7">a</span><span class="o" style="--i:8">c</span><span class="o" style="--i:9">k</span><span class="o" style="--i:10">e</span><span class="o" style="--i:11">r</span></div>
    <div class="sp-line"></div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('splash'), quick = matchMedia('(prefers-reduced-motion: reduce)').matches;
      function done() { if (!s || s.classList.contains('out')) return; s.classList.add('out'); setTimeout(function () { s.remove(); }, 700); }
      setTimeout(done, quick ? 350 : 4200);
      s.addEventListener('click', done);   // tap to skip
    })();
  </script>
</div>

  const goalK = t.kcal;
  const today = iso(), st = streak();
  // Week strip (Mon–Sun)
  const dow = (new Date().getDay() + 6) % 7, mon = addDays(today, -dow + weekOff * 7);
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const week = days.map(d => {
    const dtot = dayTotals(d), cls = dtot.count ? (dtot.kcal > dayGoals(d).kcal * 1.1 ? 'over' : 'logged') : '';
    return `<button class="day ${d === sel ? 'sel' : ''} ${d > today ? 'future' : ''}" data-d="${d}">
      <span class="dl">${dt(d).toLocaleDateString(LOC, { weekday: 'short' }).replace('.', '').slice(0, 3)}</span><span class="dn ${cls}">${dt(d).getDate()}</span></button>`;
  }).join('');
  const left = goalK - tot.kcal;
  const calBig = calMode === 'left'
    ? `<div class="bignum">${Math.abs(r0(left))}</div><div class="muted" style="margin-top:6px;font-weight:500">${left < 0 ? T('Calories over') : T('Calories left')}</div>`
    : `<div class="bignum">${r0(tot.kcal)}<small> /${goalK}</small></div><div class="muted" style="margin-top:6px;font-weight:500">${T('Calories eaten')}</div>`;
  const macros = MAC.map(m => {
    const v = tot[m.k], g = t[m.k], l = g - v;
    const top = calMode === 'left' ? `${Math.abs(r0(l))}g` : `${r0(v)}<small> /${g}g</small>`;
    const lab = T(calMode === 'left' ? (l < 0 ? m.over : m.left) : m.eaten);
    return `<button class="mcard" data-toggle><div class="v">${top}</div><div class="l">${lab}</div>${ring(62, 6, v / g, m.c, `<span style="font-size:20px">${m.ic}</span>`)}</button>`;
  }).join('');

  // Entries for selected day
  const entries = [
    ...pending.filter(p => p.date === sel).map(p => ({ kind: 'pending', time: p.time, p })),
    ...db.meals.filter(m => m.date === sel).map(m => ({ kind: 'meal', time: m.time, m }))
  // Calories burned always first, then photos still being analysed, then meals (newest first)
  ].sort((a, b) => { const rank = k => k === 'ex' ? 0 : k === 'pending' ? 1 : 2; return rank(a.kind) - rank(b.kind) || (b.time || '').localeCompare(a.time || ''); });

  let list = entries.map(en => {
    if (en.kind === 'pending') {
      const p = en.p;
      return `<div class="entry"><div class="thumb">${p.preview ? `<img src="${p.preview}" alt="">` : '💬'}
        ${p.status === 'analyzing' ? `<div class="ov" data-pct="${p.id}">${r0(p.pct)}%</div>` : p.status === 'waiting' ? '<div class="ov">⏳</div>' : ''}</div>
        <div class="einfo">${p.status === 'analyzing'
          ? `<div class="ename">${T('Analyzing food…')}</div><div class="skel" style="width:80%"></div><div class="skel" style="width:55%"></div><div class="small muted">${T("We'll notify you when done")}</div>`
          : p.status === 'waiting'
          ? `<div class="ename">${T('Waiting for internet')}</div><div class="small muted">${T('It will be analysed automatically as soon as you are online.')}</div>
             <div class="row"><button class="chipbtn" onclick="removePending('${p.id}')">${T('Remove')}</button></div>`
          : `<div class="ename" style="color:var(--bad)">${T("Couldn't analyze")}</div><div class="small muted">${esc(p.error)}</div>
             <div class="row"><button class="chipbtn" onclick="retryPending('${p.id}')">${T('Try again')}</button><button class="chipbtn" onclick="removePending('${p.id}')">${T('Remove')}</button></div>`}
        </div></div>`;
    }
    if (en.kind === 'ex') {
      const e = en.e;
      return `<button class="entry" onclick="openExercise('${e.id}')"><div class="thumb">🏋️</div><div class="einfo">
        <span class="ename">${esc(e.name)}</span>
        <div class="ecal">🔥 ${T('{n} calories burned', { n: r0(e.kcal) })}</div>${e.minutes ? `<div class="emac"><span>⏱ ${e.minutes} min</span></div>` : ''}</div></button>`;
    }
    const m = en.m, mt = mealTotals(m);
    return `<button class="entry" onclick="openMeal('${m.id}')"><div class="thumb">${m.photo ? `<img data-photo="${m.id}" alt="">` : (m.source === 'barcode' ? '🏷️' : '🍽️')}</div>
      <div class="einfo"><div class="spread"><span class="ename">${esc(m.name)}${(m.servings || 1) !== 1 ? `<span class="ptag">${fmtPortion(m.servings)}</span>` : ''}</span><span class="etime">${esc(m.time || '')}</span></div>
      <div class="ecal">🔥 ${T('{n} calories', { n: r0(mt.kcal) })}</div>
      <div class="emac"><span>🍗 ${r0(mt.protein)}g</span><span>🌾 ${r0(mt.carbs)}g</span><span>🥑 ${r0(mt.fat)}g</span>${mealHealth(m) ? `<span style="color:${healthColor(mealHealth(m))}">💚 ${mealHealth(m)}</span>` : ''}</div></div></button>`;
  }).join('');
  if (!entries.length) list = `<div class="empty"><b>${T("You haven't uploaded any food")}</b><span class="muted">${T('Start tracking your meals by taking a quick picture')}</span>
    <div style="margin-top:16px"><button class="btn sm" style="margin:0 auto" onclick="openAddMenu()">＋ ${T('Add food')}</button></div></div>`;

  $('#view').innerHTML = `
    <div class="top"><div class="brand"><img src="icon-180.png" alt="">Food Tracker</div>
      <div class="row" style="gap:8px"><button class="themebtn" id="themeBtn" aria-label="${T('Light / dark mode')}">${isDark() ? '☀️' : '🌙'}</button><div class="streak">🔥 ${st}</div></div></div>
    <div class="week"><button class="nav" id="wPrev">‹</button><div class="days">${week}</div><button class="nav" id="wNext" ${weekOff >= 0 ? 'style="visibility:hidden"' : ''}>›</button></div>
    ${planChip()}
    ${!hasAI() ? `<button class="card" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center" onclick="go('settings')"><span style="font-size:26px">✨</span><span class="grow"><b>${T('Turn on AI food scanning')}</b><br><span class="small muted">${T('Add your free Google AI key in Settings')}</span></span><span class="muted">›</span></button>` : ''}
    <button class="card calcard" data-toggle style="width:100%;text-align:left"><div>${calBig}</div>${ring(104, 9, tot.kcal / goalK, left < 0 ? 'var(--bad)' : 'var(--ink)', '<span style="font-size:28px">🔥</span>')}</button>
    <div class="macros">${macros}</div>
    ${focusCard(sel, t, tot)}
    ${healthCard(sel)}
    <div class="minirow">${waterCard(sel)}
      <div class="card mini burncard"><div class="spread"><div class="mini-ic">🏃</div><button class="mini-plus" id="burnAdd" aria-label="${T('Add')}">＋</button></div>
        <div><div class="mini-v">${burned}<small> kcal</small></div><div class="mini-l">${T('Calories burned')}</div></div></div></div>
    ${setupBanner()}${mealPlanCard()}
    <div class="h2">${sel === today ? T('Recently uploaded') : fmtDate(sel, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    ${list}`;
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { sel = b.dataset.d; renderHome(); });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { calMode = calMode === 'left' ? 'eaten' : 'left'; renderHome(); });
  $('#themeBtn').onclick = () => { setTheme(isDark() ? 'light' : 'dark'); renderHome(); };
  $('#burnAdd').onclick = e => { e.stopPropagation(); openBurnSheet(); };
  document.querySelector('.burncard').onclick = openBurnSheet;
  $('#mpCard').onclick = openMealPlan;
  bindWater();
  if ($('#planChip')) $('#planChip').onclick = openMainGoalSheet;
  $('#wPrev').onclick = () => { weekOff--; renderHome(); };
  $('#wNext').onclick = () => { if (weekOff < 0) { weekOff++; renderHome(); } };
  hydratePhotos($('#view'));
}

/* ================= Sheets ================= */
function sheet(html, mount) {
  closeSheet();
  const b = document.createElement('div');
  b.className = 'backdrop';
  b.innerHTML = `<div class="sheet"><div class="sheethead"><div class="grab"></div><button class="sheetx" aria-label="${T('Close')}">✕</button></div>${html}</div>`;
  b.onclick = e => { if (e.target === b) dismissSheet(); };
  document.body.appendChild(b);
  const sh = b.querySelector('.sheet');
  sh.querySelector('.sheetx').onclick = dismissSheet;
  // Swipe down to close: from the top bar, or anywhere while the sheet is scrolled to the top
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => {
    const onHead = e.target.closest('.sheethead');
    y0 = (onHead || sh.scrollTop <= 0) && !e.target.closest('input,textarea,select') ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && (sh.scrollTop <= 0 || e.target.closest('.sheethead'))) { e.preventDefault(); sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
    else if (dy < 0) y0 = null;
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 === null) return;
    y0 = null; sh.style.transition = 'transform .2s ease';
    if (dy > 90) dismissSheet(); else sh.style.transform = '';
  });
  if (mount) mount(sh);
}
function closeSheet() { document.querySelectorAll('.backdrop').forEach(x => x.remove()); }
// Closing by hand slides the sheet down first
function dismissSheet() {
  const b = $('.backdrop'), sh = b && b.querySelector('.sheet');
  if (!sh) return;
  sh.style.transition = 'transform .2s ease'; sh.style.transform = 'translateY(105%)'; b.style.transition = 'opacity .2s'; b.style.opacity = '0';
  setTimeout(() => b.remove(), 200);
}

function numberSheet(title, value, unit, cb, step = 1) {
  sheet(`<h3>${esc(title)}</h3><div class="row" style="margin:18px 0">
    <button class="onb-back" id="nMinus">−</button>
    <input id="nVal" inputmode="decimal" value="${value}" style="text-align:center;font-size:30px;font-weight:800">
    <button class="onb-back" id="nPlus">＋</button><span class="muted">${esc(unit)}</span></div>
    <button class="btn" id="nSave">${T('Save')}</button>`, s => {
    const inp = s.querySelector('#nVal');
    const bump = d => inp.value = r1(Math.max(0, num(inp.value) + d));
    s.querySelector('#nMinus').onclick = () => bump(-step);
    s.querySelector('#nPlus').onclick = () => bump(step);
    s.querySelector('#nSave').onclick = () => { closeSheet(); cb(num(inp.value)); };
  });
}

/* ================= AI analysis ================= */
// Food names come back in the app language
const foodPrompt = () => `You are an expert nutritionist powering a calorie tracking app.
Identify every food and drink in the meal. Estimate each portion in grams using visual cues (plate size, cutlery, hands, packaging). Include cooking oils, sauces and dressings.
Return ONLY JSON in this exact shape:
{"name": "short appetising meal name", "items": [{"name": "ingredient", "grams": 0, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0, "sugar": 0, "fiber": 0, "sodium": 0}], "health_score": 7, "notes": "short"}
Numbers are for the whole portion (not per 100 g); macros, sugar and fiber in grams, sodium in milligrams. health_score is an integer 1-10 (10 = very healthy: whole foods, high protein and fibre, low sugar). If there is no food, return "items": [] and explain in notes.
Write "name", every ingredient name and "notes" in ${langInfo().ai}.`;

/* --- AI engine ---
   Parts format: [{ text }, { image: base64jpeg }]. Tries every free Google model in turn (each has its
   own daily limit), skipping ones that are rate-limited, then Claude if a Claude key is set. */
const getClaudeKey = () => LS.get('ft_claude_key', '');
const hasAI = () => !!(geminiKey() || getClaudeKey());
let lastAI = '';
const GEMINI = [
  { id: 'gemini-3.5-flash-lite' },                                   // fastest, minimal thinking by default
  { id: 'gemini-3.1-flash-lite' },
  { id: 'gemini-3.6-flash', think: { thinkingLevel: 'minimal' } },
  { id: 'gemini-3.8-flash', think: { thinkingLevel: 'low' } },
  { id: 'gemini-flash-latest' },
  { id: 'gemini-2.5-flash-lite' },
  { id: 'gemini-2.5-flash', think: { thinkingBudget: 0 } }
];
const aiErr = (msg, fatal) => Object.assign(new Error(msg), { fatal });
function parseJSON(text) {
  const t = String(text || '').replace(/```(json)?/g, '').trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) try { return JSON.parse(t.slice(a, b + 1)); } catch {}
  throw aiErr(T('The AI gave an unreadable answer. Please try again.'));
}
function untilQuotaReset() { const d = new Date(); d.setUTCHours(8, 5, 0, 0); if (d <= new Date()) d.setUTCDate(d.getUTCDate() + 1); return d - new Date(); }
// Merge consecutive same-role messages so the conversation alternates user/assistant
function normMsgs(msgs) {
  const out = [];
  for (const m of msgs) { const prev = out.at(-1); if (prev && prev.role === m.role) prev.parts = prev.parts.concat(m.parts); else out.push({ role: m.role, parts: [...m.parts] }); }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}
async function askAI(parts, opt = {}) {
  const json = opt.json !== false;
  const msgs = normMsgs([...(opt.history || []), { role: 'user', parts }]);
  const g = geminiKey(), c = getClaudeKey();
  if (!g && !c) throw new Error('NOKEY');
  const prov = [];
  if (g) prov.push(() => geminiChain(g, msgs, opt.system, json, opt.onText, opt.timeout, opt.strong));
  if (c) prov.push(() => claudeCall(c, msgs, opt.system, json, opt.onText));
  if (LS.get('ft_ai_first', 'gemini') === 'claude') prov.reverse();
  let err;
  for (const run of prov) {
    try { const text = await run(); return json ? parseJSON(text) : text; }
    catch (e) { err = e; }
  }
  throw err;
}
const aiMsg = e => e.message === 'NOKEY' ? T('Add your free AI key in Settings first.') : e.message;
// Reads a server-sent-events stream and calls onEvent with each parsed JSON "data:" payload
async function readSSE(res, onEvent) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const data = buf.slice(0, i).split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n');
      buf = buf.slice(i + 2);
      if (data && data !== '[DONE]') { let ev; try { ev = JSON.parse(data); } catch { continue; } onEvent(ev); }
    }
  }
}
async function geminiOnce(key, model, msgs, system, json, onText, ms) {
  const def = GEMINI.find(m => m.id === model) || {};
  const noThink = JSON.parse(LS.get('ft_nothink', '[]'));
  const think = def.think && !noThink.includes(model) ? def.think : null;
  const body = {
    contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user',
      parts: m.parts.map(p => p.image ? { inlineData: { mimeType: 'image/jpeg', data: p.image } } : p.inline ? { inlineData: { mimeType: p.inline.mime, data: p.inline.data } } : { text: p.text }) })),
    generationConfig: { temperature: json ? 0.2 : 0.7, ...(json ? { responseMimeType: 'application/json' } : {}), ...(think ? { thinkingConfig: think } : {}) }
  };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 30000);
  let res;
  try {
    const viaServer = key === SHARED, method = onText ? 'streamGenerateContent' : 'generateContent';
    const url = viaServer ? `${SERVER_URL}/gemini/${encodeURIComponent(model)}:${method}`
      : `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:${method}${onText ? '?alt=sse' : ''}`;
    res = await fetch(url, { method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', ...(viaServer ? {} : { 'x-goog-api-key': key }) }, body: JSON.stringify(body) });
  } catch (e) { return { ok: false, status: e.name === 'AbortError' ? 504 : 0, msg: e.name === 'AbortError' ? 'took too long' : 'no connection' }; }
  finally { clearTimeout(timer); }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    const msg = (Array.isArray(data) ? data[0] : data)?.error?.message || 'HTTP ' + res.status;
    if (think && res.status === 400 && /think/i.test(msg)) { noThink.push(model); LS.set('ft_nothink', JSON.stringify(noThink)); return geminiOnce(key, model, msgs, system, json, onText, ms); }
    return { ok: false, status: res.status, msg };
  }
  if (onText) {
    let full = '', why = '';
    try {
      await readSSE(res, ev => {
        const c = ev.candidates?.[0];
        const piece = (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
        if (piece) { full += piece; onText(full); }
        if (c?.finishReason) why = c.finishReason;
      });
    } catch { if (!full) return { ok: false, status: 0, msg: 'connection lost' }; }
    return full ? { ok: true, text: full } : { ok: false, status: 500, msg: 'empty answer (' + (why || 'unknown') + ')' };
  }
  const data = await res.json().catch(() => ({}));
  const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  return text ? { ok: true, text } : { ok: false, status: 500, msg: 'empty answer (' + (data.candidates?.[0]?.finishReason || data.promptFeedback?.blockReason || 'unknown') + ')' };
}
// Counts this phone's AI use per day [requests, refused by Google, "busy" shown]. Finished days are sent
// along with the daily backup / hello (no extra saves), so the owner sees AI use in Settings → Users.
function aiCount(i) {
  let c = {}; try { c = JSON.parse(LS.get('ft_aic', '{}')) || {}; } catch {}
  const d = iso(); c[d] = c[d] || [0, 0, 0]; c[d][i]++;
  for (const k of Object.keys(c)) if (k < addDays(d, -8)) delete c[k];
  LS.set('ft_aic', JSON.stringify(c));
}
const aiReport = () => { try { const c = JSON.parse(LS.get('ft_aic', '{}')) || {}, d = iso(); return Object.fromEntries(Object.entries(c).filter(([k]) => k < d)); } catch { return {}; } };
function aiReported(rep) {
  let c = {}; try { c = JSON.parse(LS.get('ft_aic', '{}')) || {}; } catch {}
  for (const k of Object.keys(rep)) delete c[k];
  LS.set('ft_aic', JSON.stringify(c));
}
const devId = () => { let d = LS.get('ft_dev', ''); if (!/^[a-f0-9]{32}$/.test(d)) { d = hexOf(crypto.getRandomValues(new Uint8Array(16))); LS.set('ft_dev', d); } return d; };
async function geminiChain(key, msgs, system, json, onText, ms, strong) {
  const cool = JSON.parse(LS.get('ft_cool', '{}')), now = Date.now();
  let list = GEMINI.map(m => m.id);
  const custom = LS.get('ft_model', ''), last = LS.get('ft_lastModel', '');
  if (strong) {   // photos & files: the best readers first (newest full Flash), the light models only as a fallback
    const rank = x => /lite/.test(x) ? 9 : x === 'gemini-3.8-flash' ? 0 : x === 'gemini-3.6-flash' ? 1 : 2;
    list = [...list].sort((a, b) => rank(a) - rank(b));
  }
  if (!strong && last && list.includes(last)) list = [last, ...list.filter(x => x !== last)];
  if (custom) list = [custom, ...list.filter(x => x !== custom)];
  const ready = list.filter(m => !(cool[m] > now));
  let err = aiErr(getClaudeKey() || !isAdmin() ? T('All free Google AI models are busy right now. Try again in a minute.') : T('All free Google AI models are busy right now. Try again in a minute, or add a Claude key in Settings.'));
  let offline = 0;
  for (const model of (ready.length ? ready : list)) {
    const r = await geminiOnce(key, model, msgs, system, json, onText, ms);
    if (key === SHARED && r.status !== 0) { aiCount(0); if (r.status === 429) aiCount(1); }
    if (r.ok) { if (!strong) LS.set('ft_lastModel', model); lastAI = model; return r.text; }
    if (r.status === 0 && ++offline >= 2) throw aiErr(T('No connection to the AI. Check your internet.'));
    if (key !== SHARED && (/api[_ ]?key|API_KEY_INVALID|unauthenticated/i.test(r.msg) || r.status === 401)) throw aiErr(T('Your Google AI key was rejected. Check it in Settings.'), true);
    let wait = 0;
    if (r.status === 429) wait = /day|PerDay/i.test(r.msg) ? untilQuotaReset() : 60e3;
    else if (r.status === 404 || r.status === 403 || (r.status === 400 && /not (found|supported|available)|no longer|deprecat|access/i.test(r.msg))) wait = 7 * 864e5;
    else if (r.status >= 500) wait = 20e3;
    else err = aiErr('Google AI: ' + r.msg);
    if (wait) { cool[model] = Date.now() + wait; LS.set('ft_cool', JSON.stringify(cool)); }
  }
  if (key === SHARED) aiCount(2);
  throw err;

async function claudeCall(key, msgs, system, json, onText) {
  const model = LS.get('ft_claude_model', '') || 'claude-opus-5-5', isOpus = model === 'claude-opus-5-5';
  const jsonRule = 'Respond with only the JSON object, no other text.';
  const body = {
    model, max_tokens: 8000, output_config: { effort: 'low' },
    messages: msgs.map(m => ({ role: m.role, content: m.parts.map(p => p.image
      ? { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.image } }
      : p.inline ? (p.inline.mime === 'application/pdf' ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: p.inline.data } } : { type: 'text', text: '[attachment type not supported]' })
      : { type: 'text', text: p.text }) }))
  };
  if (system || json) body.system = [system, json ? jsonRule : ''].filter(Boolean).join('\n\n');
  if (isOpus) body.fallbacks = 'default';   // re-runs a declined request on Anthropic's recommended fallback model
  if (onText) body.stream = true;

    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', body: JSON.stringify(body), headers: {
      'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
      ...(isOpus ? { 'anthropic-beta': 'server-side-fallback-2026-07-01' } : {}) } });
  } catch { throw aiErr(T('No connection to Claude. Check your internet.')); }

    let full = '', stop = '', err = '';

      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { full += ev.delta.text; onText(full); }
      else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
      else if (ev.type === 'error') err = ev.error?.message || 'stream error';

    if (stop === 'refusal') throw aiErr(T('Claude declined this request.'));
    if (!full) throw aiErr(err ? 'Claude: ' + err : T('Claude gave an empty answer. Please try again.'));
    lastAI = 'Claude'; return full;
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || 'HTTP ' + res.status;
    if (res.status === 401 || res.status === 403) throw aiErr(T('Your Claude key was rejected. Check it in Settings.'));
    if (/credit balance/i.test(msg)) throw aiErr(T('Your Claude account has no credit left. Add credit at console.anthropic.com.'));
    if (res.status === 429 || res.status === 529) throw aiErr(T('Claude is busy right now. Try again in a moment.'));
    throw aiErr('Claude: ' + msg);
  }
  if (data.stop_reason === 'refusal') throw aiErr(T('Claude declined this request.'));
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if (!text) throw aiErr(T('Claude gave an empty answer. Please try again.'));
  lastAI = 'Claude'; return text;
}

function savePendingQ() {

    for (const p of pending.filter(x => x.status === 'waiting')) { await runAnalysis(p); if (p.status === 'waiting') break; }   // still offline: try later
  } finally { qBusy = false; }
}

async function runAnalysis(p) {

    const m = { id: p.id, date: p.date, time: p.time, name: res.name || items.map(i => i.name).join(', '), items, servings: 1,

/* ================= Account & automatic backup =================
   People sign up with their email and a password (the iPhone can save it in its Keychain, so there's
   nothing to remember). Once a day the app saves an encrypted copy of the data on the Food Tracker server.
   The key comes from the password and never leaves the phone, so nobody else (not even the app owner)
   can read it. Meal photos are saved too (see photoSync). Signing in on a new phone brings everything back.
   The email is only a name for the account: no emails are ever sent. */
const acct = () => { try { return JSON.parse(LS.get('ft_acct', 'null')); } catch { return null; } };
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
const hexOf = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0')).join('');
const bytesOf = hex => Uint8Array.from(hex.match(/../g).map(h => parseInt(h, 16)));
const normEmail = e => String(e || '').trim().toLowerCase();
// Password → login proof + encryption key (slow on purpose, so passwords can't be guessed quickly)
async function deriveAcct(email, password) {
  const e = normEmail(email), base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode('foodtracker:' + e), iterations: 210000 }, base, 512));
  return { email: e, id: await sha('ft-acct-id:' + e), auth: hexOf(bits.slice(0, 32)), key: hexOf(bits.slice(32)) };
}
const aesKey = hex => crypto.subtle.importKey('raw', bytesOf(hex), 'AES-GCM', false, ['encrypt', 'decrypt']);
const b64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function zipText(str) {
  if (!window.CompressionStream) return { z: false, bytes: new TextEncoder().encode(str) };
  return { z: true, bytes: new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()) };
}
async function unzipText(bytes, z) {
  if (!z) return new TextDecoder().decode(bytes);
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
const post = (path, body) => fetch(SERVER_URL + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function runBackup(manual, a = acct()) {
  if (!SERVER_URL || !a || !db.profile || !window.crypto || !crypto.subtle) return false;
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const payload = JSON.stringify({ v: 1, t: Date.now(), data: LS.get('ft_data', ''), chat: LS.get('ft_chat', ''), lang: LS.get('ft_lang', ''), theme: LS.get('ft_theme', ''), bg: LS.get('ft_bg', ''), push: LS.get('ft_push_prefs', '') });
    const zz = await zipText(payload);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(a.key), zz.bytes));
    const rep = OLD_HOME ? {} : aiReport();
    const r = await fetch(SERVER_URL + '/backup', { method: 'POST', headers: { 'Content-Type': 'text/plain', 'X-Id': a.id, 'X-Auth': a.auth, ...(OLD_HOME ? {} : { 'X-Dev': devId(), 'X-AI': JSON.stringify(rep) }) },
      body: (zz.z ? 'z' : 'p') + '.' + b64(iv) + '.' + b64(ct) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    LS.set('ft_bk_last', String(Date.now()));
    if (!OLD_HOME) { LS.set('ft_bk_o', '1'); LS.set('ft_bk_day', iso()); LS.set('ft_hello', iso()); aiReported(rep); }
    if (manual) toast('✓ ' + T('Backup saved'));
    if (tab === 'settings' && !$('.backdrop')) renderSettings();
    return true;
  } catch { if (manual) toast(T('Backup failed. Check your internet and try again.')); return false; }
}
let bkRunning = false;
async function autoBackup() {
  if (bkRunning || !acct() || (OLD_HOME ? Date.now() - +LS.get('ft_bk_last', 0) < 20 * 3600e3 : LS.get('ft_bk_day', '') === iso() && LS.get('ft_bk_o', ''))) return;
  bkRunning = true; await runBackup(false); bkRunning = false;
  photoSync(false);
}
// Reads the account's saved data. Errors: 'none' (no account with this email), 'wrong' (wrong password)
async function fetchAccountData(a) {
  const r = await post('/backup/restore', { id: a.id, auth: a.auth });
  if (r.status === 404) throw new Error('none');
  if (r.status === 403) throw new Error('wrong');
  if (r.status === 429) throw new Error('busy');
  if (!r.ok) throw new Error('net');
  const txt = await r.text(), box = txt.startsWith('{') ? JSON.parse(txt).data : txt;   // older backups were wrapped
  const [z, iv, ct] = box.split('.');
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, await aesKey(a.key), unb64(ct));
  return JSON.parse(await unzipText(new Uint8Array(plain), z === 'z'));
}
function applyAccountData(p) {
  if (p.data) LS.set('ft_data', p.data);
  if (p.chat) LS.set('ft_chat', p.chat);
  if (p.lang) LS.set('ft_lang', p.lang);

}

/* ================= Rewards: celebrations, badges, goal reached, maintenance =================
   Friendly motivation only: real progress is celebrated, nothing is ever taken away or used to
   make people feel guilty. */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = Math.min(2, devicePixelRatio || 1), W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr, x = c.getContext('2d');
  const cols = ['#ff9500', '#34c759', '#4b8cf5', '#e3605b', '#f5b83d', '#af52de'];
  const ps = [...Array(150)].map((_, i) => ({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.4, vx: (Math.random() - 0.5) * 20 * dpr,
    vy: (-Math.random() * 17 - 7) * dpr, s: (6 + Math.random() * 6) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] }));
  const t0 = performance.now();
  const step = now => {
    const el = now - t0; x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += 0.55 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - el / 2800); x.fillStyle = p.c;
      x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    }
    if (el < 2800) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}
// Small celebration in the middle of the screen (one after another if several happen at once)
const celQ = []; let celOn = false;
function celebrate(ic, title, text) { celQ.push([ic, title, text]); if (!celOn) nextCel(); }
function nextCel() {
  const it = celQ.shift(); if (!it) { celOn = false; return; }
  celOn = true;
  const [ic, title, text] = it, el = document.createElement('div'); el.className = 'celpop';
  el.innerHTML = `<div class="celcard"><div class="celic">${ic}</div><b>${title}</b>${text ? `<div class="small muted">${text}</div>` : ''}</div>`;
  document.body.appendChild(el); confetti(); if (navigator.vibrate) navigator.vibrate([20, 40, 20]);
  const close = () => { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => { el.remove(); nextCel(); }, 300); };
  el.onclick = close; setTimeout(close, 2800);
}

// Progress towards the weight goal (start = weight when the goal was set, or the first weigh-in)
// Trend weight, made for one weigh-in a week: a straight line through the weigh-ins of the last 6 weeks,
// read at the latest one. One heavy or light morning barely moves it, and unlike an average it doesn't lag
// behind real progress. With fewer than 3 weigh-ins it is simply the latest weight.
function trendWeight() {
  const ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
  if (!ws.length) return currentWeight();
  const last = ws.at(-1), rec = ws.filter(w => daysBetween(w.date, last.date) <= 42);
  if (rec.length < 3 || daysBetween(rec[0].date, last.date) < 10) return last.kg;
  const xs = rec.map(w => -daysBetween(w.date, last.date)), mx = xs.reduce((a, b) => a + b) / xs.length, my = rec.reduce((a, w) => a + w.kg, 0) / rec.length;
  const slope = xs.reduce((a, x, k) => a + (x - mx) * (rec[k].kg - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0);
  return Math.round((my - slope * mx) * 100) / 100;
}
// Progress towards the weight goal, based on the trend: how far along, kilos and weeks to go, and whether

  const days = Math.max(0, daysBetween(startDate, iso())), shouldBe = Math.min(total, (p.pace || 0) * days / 7), diff = done - shouldBe;
  const since = ws.filter(w => w.date > startDate).length;   // weekly weigh-ins since the start
  const status = days < 14 || since < 2 ? 'new' : diff > 0.4 ? 'ahead' : diff < -0.6 ? 'behind' : 'on';
  return { start, cur, tgt, kgDone: r1(Math.max(0, done)), pct: total ? clamp(done / total * 100, 0, 100) : 100, reached: up ? cur >= tgt : cur <= tgt,
    toGo: r1(toGo), weeks, status, shouldBe: r1(up ? start + shouldBe : start - shouldBe), days };
}
const goalStatusText = st => ({ new: '🌱 ' + T('Just started'), on: '✓ ' + T('On track'), ahead: '🚀 ' + T('Ahead of plan'), behind: '⏳ ' + T('A bit behind') })[st];

function applyAutoBurn(date, kcal, src, info) {

  kcal = r0(Math.max(0, Math.min(6000, num(kcal))));

let linkBusy = false;
async function linkSync(force) {

  linkBusy = true; L.tried = Date.now();

  let changed = false;
  try {
    if (L.p === 'apple') {
      const r = await post('/health/pull', { code: healthCode() });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const got = await r.json(), list = Array.isArray(got) ? got : Object.entries(got).map(([d, k]) => ({ d, k, t: 0 })), best = {};
      for (const x of list) { const d = x.d || iso(new Date(x.t)); if (!best[d] || x.t >= best[d].t) best[d] = x; }
      for (const [d, x] of Object.entries(best)) changed = applyAutoBurn(d, x.k, 'apple') || changed;
      if (list.length) { L.ok = Date.now(); L.last = Math.max(...list.map(x => x.t || 0)); L.err = ''; }
    } else {
      const refresh = async () => {
        if (!L.refresh) throw new Error('reconnect');
        const r = await post(`/link/${L.p}/refresh`, { refresh: L.refresh });
        if (!r.ok) throw new Error(r.status === 401 ? 'reconnect' : 'HTTP ' + r.status);
        const t = await r.json(); L.access = t.access; if (t.refresh) L.refresh = t.refresh; L.exp = t.exp;
        LS.set('ft_link', JSON.stringify(L));   // the old key stops working, so save the new one right away
      };
      if (L.exp && Date.now() > L.exp) await refresh();
      const ask = () => post(`/link/${L.p}/data`, { access: L.access, from: addDays(iso(), -1), to: iso() });
      let r = await ask();
      if (r.status === 401) { await refresh(); r = await ask(); }
      if (r.status === 401) throw new Error('reconnect');
      if (!r.ok) throw new Error('HTTP ' + r.status);

function openTour(onDone) {
  closeSheet(); $('#tourLayer')?.remove(); $('#tour')?.remove();
  const layer = document.createElement('div'); layer.id = 'tourLayer';
  layer.innerHTML = `<div class="tspot"></div><div class="ttip">
      <div class="spread"><span class="ttip-n small muted"></span><button class="ttip-skip">${T('Skip')}</button></div>
      <div class="ttip-body"><b class="ttip-t"></b><p class="ttip-x"></p></div>
      <div class="row" style="gap:10px"><button class="btn outline sm grow ttip-back">${T('Back')}</button><button class="btn sm grow ttip-next"></button></div></div>`;
  document.body.appendChild(layer);
  const spot = layer.querySelector('.tspot'), tip = layer.querySelector('.ttip'), body = layer.querySelector('.ttip-body'), wait = ms => new Promise(r => setTimeout(r, ms));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  tip.style.opacity = '0';   // shown once it knows where to go
  let i = 0, dir = 1, target = null, busy = false, tipGoal = null, alive = true;
  // Where things are now (cur) and where they're going; one animation loop moves both smoothly every frame
  let cur = null, tipTop = null, last = performance.now();
  const rectOf = el => {
    const r = el.getBoundingClientRect(), pad = 6, cs = getComputedStyle(el), rad = cs.borderRadius.includes('%') ? 999 : parseFloat(cs.borderRadius) || 12;
    const x0 = Math.max(6, r.left - pad), x1 = Math.min(innerWidth - 6, r.right + pad);
    return { x: x0, y: r.top - pad, w: x1 - x0, h: r.height + pad * 2, r: Math.min(rad + pad, 40) };
  };
  const centre = () => ({ x: innerWidth / 2, y: innerHeight / 2, w: 0, h: 0, r: 24 });
  // Where the bubble ends up: under the part if it fits, otherwise above it (worked out from where the part
  // will be once the page has finished scrolling, so the bubble goes straight to its place)
  const placeTip = final => {
    const th = tip.offsetHeight, vh = innerHeight;
    if (!final) return (vh - th) / 2;
    const below = final.y + final.h + 14, above = final.y - 14 - th;
    return below + th < vh - 12 ? below : above > 12 ? above : Math.max(12, vh - th - 24);
  };
  function frame(now) {
    if (!alive) return;
    const dt = Math.min(64, now - last); last = now;
    const goal = target && target.isConnected ? rectOf(target) : centre();
    const k = still ? 1 : 1 - Math.pow(0.82, dt / 16.7);   // eases out, the same at any frame rate
    if (!cur) cur = { ...goal };
    for (const key of ['x', 'y', 'w', 'h', 'r']) cur[key] += (goal[key] - cur[key]) * k;
    spot.style.cssText = `transform:translate3d(${cur.x}px,${cur.y}px,0);width:${cur.w}px;height:${cur.h}px;border-radius:${cur.r}px`;
    if (tipGoal !== null) { tipTop = tipTop === null ? tipGoal : tipTop + (tipGoal - tipTop) * k; tip.style.transform = `translate3d(0,${tipTop}px,0)`; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const finish = () => {
    LS.set('ft_tour', '1'); window.removeEventListener('resize', onResize); layer.classList.add('out');
    setTimeout(() => { alive = false; layer.remove(); if (tab !== 'home') go('home'); if (onDone) onDone(); }, 300);
  };
  async function show(n) {
    if (n < 0 || busy) return;
    if (n >= TOUR_STEPS.length) return finish();
    busy = true; i = n;
    const s = TOUR_STEPS[i], t0 = performance.now();
    body.classList.add('swap');   // the old text fades out while things move
    if (s.tab !== tab) { switchTab(s.tab); await wait(260); }   // the light stays on the tab button and then glides to the new page
    const el = s.sel ? document.querySelector(s.sel) : null;
    if (s.sel && (!el || !el.offsetParent && el.id !== 'fab')) { busy = false; return show(i + dir); }   // not on this phone (e.g. no account option)
    target = el;
    // Scroll the part to the middle; the light follows it while the page moves
    let final = el ? rectOf(el) : null;
    const sc = el && !el.closest('.tabbar') && el.closest('#scroller');
    if (sc) {
      const sr = sc.getBoundingClientRect(), r = el.getBoundingClientRect();
      const want = Math.max(0, Math.min(sc.scrollHeight - sc.clientHeight, sc.scrollTop + r.top - sr.top - (sr.height - r.height) / 2));
      final.y -= want - sc.scrollTop;
      sc.scrollTo({ top: want, behavior: still ? 'auto' : 'smooth' });
    }
    await wait(Math.max(0, 150 - (performance.now() - t0)));
    tip.querySelector('.ttip-n').textContent = `${i + 1} / ${TOUR_STEPS.length}`;
    tip.querySelector('.ttip-t').textContent = T(s.title);
    tip.querySelector('.ttip-x').textContent = T(s.text);
    tip.querySelector('.ttip-back').style.visibility = i ? '' : 'hidden';
    tip.querySelector('.ttip-next').textContent = i === TOUR_STEPS.length - 1 ? T("Let's go") : T('Next');
    tipGoal = placeTip(final);
    tip.style.opacity = '';
    body.classList.remove('swap');
    busy = false;
  }
  const onResize = () => { if (target) tipGoal = placeTip(rectOf(target)); else tipGoal = placeTip(null); };
  layer.querySelector('.ttip-next').onclick = () => { dir = 1; show(i + 1); };
  layer.querySelector('.ttip-back').onclick = () => { dir = -1; show(i - 1); };
  layer.querySelector('.ttip-skip').onclick = finish;
  window.addEventListener('resize', onResize);
  if (tab !== 'home') go('home');
  show(0);
}

/* ================= Live barcode scanning =================
   Uses the phone's own barcode reader where there is one, otherwise ZXing (a fast reader, loaded once).
   The camera stays ready for 2 minutes after the scanner closes, so scanning again doesn't ask again. */
let bdPromise = null;
function getDetector() {
  return bdPromise || (bdPromise = (async () => {
    const formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
    if ('BarcodeDetector' in window) {
      try { if ((await BarcodeDetector.getSupportedFormats()).includes('ean_13')) return new BarcodeDetector({ formats }); } catch {}
    }
    const m = await import('https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/es/ponyfill.js');
    return new m.BarcodeDetector({ formats });
  })().catch(e => { bdPromise = null; throw e; }));
}
let camStream = null, camOffT = null, scanLoop = null;
async function getCamera() {
  clearTimeout(camOffT);
  if (camStream && camStream.getVideoTracks().some(t => t.readyState === 'live')) return camStream;
  camStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  return camStream;
}
function cameraOff() { clearTimeout(camOffT); if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; }
function stopBarScan() { clearTimeout(scanLoop); scanLoop = null; clearTimeout(camOffT); camOffT = setTimeout(cameraOff, 120000); }
async function startBarScan() {
  if (!$('#bLive')) return;
  try {
    const [det, stream] = await Promise.all([getDetector(), getCamera()]);
    const box = $('#bLive'); if (!box) return stopBarScan();
    box.innerHTML = '<video playsinline muted autoplay></video><div class="barframe"></div>';
    const v = box.querySelector('video'); v.srcObject = stream;
    try { await v.play(); } catch {}
    let busy = false;
    const tick = async () => {
      if (!$('#bLive') || !v.isConnected) return stopBarScan();
      if (!busy && v.readyState >= 2) {
        busy = true;
        try {
          const found = await det.detect(v), code = found && found[0] ? String(found[0].rawValue).replace(/\D/g, '') : '';
          if (code.length >= 6) {
            stopBarScan(); if (navigator.vibrate) navigator.vibrate(40);
            if ($('#bCode')) $('#bCode').value = code;
            await lookupBarcode(code);
            setTimeout(() => { if ($('#bLive') && !scanLoop) startBarScan(); }, 2500);   // not found: keep scanning
            return;
          }
        } catch {}
        busy = false;
      }
      scanLoop = setTimeout(tick, 120);
    };
    scanLoop = setTimeout(tick, 50);
  } catch {
    stopBarScan();
    const b = $('#bLive');
    if (b) b.innerHTML = `<div class="small" style="padding:26px 14px;text-align:center;color:#bbb">${T('Camera not available. Take a photo of the barcode or type the number.')}</div>`;
  }
}

const waterLog = () => (db.water = db.water || {});
/* Personal water goal: about 33 ml per kg of body weight, plus extra for regular training, for goals that
   need more water (high protein, keto, building muscle) and for the exercise logged that day.
   Rounded to 250 ml. People can still set their own amount. */
function waterAuto(d = sel) {
  const p = db.profile; if (!p) return { total: 2500, parts: [] };
  const w = currentWeight(), parts = [[T('Body weight {w} kg', { w }), Math.round(w * 33)]];
  // Training: the usual weekly allowance, or, on days with logged exercise, that exercise instead
  // (not both, so the same training isn't counted twice). About 0.6 ml per burned kcal, at most +1 L.
  const train = { '0-2': 0, '3-5': 350, '6+': 600 }[p.workouts] || 0, burned = dayBurned(d);
  // Whole-day numbers: only activity beyond a normal day counts as extra; workouts count fully
  const ex = Math.min(1000, Math.round(burnWholeDay() ? Math.max(0, burned - includedExercise()) * 0.8 : burned * 0.6));
  if (ex > train) parts.push([burnWholeDay() ? T('Extra activity that day ({n} kcal burned)', { n: r0(burned) }) : T('Exercise that day ({n} kcal)', { n: r0(burned) }), ex]);
  else if (train) parts.push([T('Training {n}× a week', { n: p.workouts }), train]);
  const pl = planOf(p);
  if (['protein', 'keto', 'bulk', 'lean', 'dirty', 'recomp'].includes(pl.id) || p.goal === 'lean') parts.push([T('Your goal: {g}', { g: T(pl.name) }), 250]);
  return { total: clamp(Math.round(parts.reduce((a, x) => a + x[1], 0) / 250) * 250, 1500, 5000), parts };
}
const waterGoal = (d = sel) => db.settings.waterGoal || waterAuto(d).total;
const waterOn = d => num(waterLog()[d]);
const fmtL = ml => isOz() ? numU(ml / ML_OZ, 0) + ' fl oz' : (ml >= 1000 ? (Math.round(ml / 10) / 100).toLocaleString(LOC) + ' L' : ml + ' ml');

  save(); if (tab === 'home') renderHome();
}

/* ================= Weekly check-in from the coach (Sundays) =================
   On Sunday (from 9:00), or the next time the app is opened in the two days after, the coach writes a
   short summary of the week with the real numbers and one tip. It appears in the coach chat. */
let checkinBusy = false;
async function weeklyCheckin() {
  if (checkinBusy || !db.profile || !hasAI()) return;
  const today = iso(), sun = addDays(today, -dt(today).getDay());
  if (LS.get('ft_checkin', '') === sun || daysBetween(sun, today) > 2 || (today === sun && new Date().getHours() < 9)) return;
  const days = [...Array(7)].map((_, i) => addDays(sun, i - 6)), logged = days.filter(d => dayTotals(d).count);
  if (logged.length < 2) return LS.set('ft_checkin', sun);   // too little to say anything useful
  checkinBusy = true; LS.set('ft_checkin', sun);
  const avg = f => r0(logged.reduce((a, d) => a + f(d), 0) / logged.length);
  const wAt = d => { const w = db.weights.filter(x => x.date <= d).sort((a, b) => a.date.localeCompare(b.date)).at(-1); return w ? w.kg : null; };
  const w1 = wAt(sun), w0 = wAt(addDays(sun, -7));
  const wd = days.filter(d => waterOn(d));
  const stats = `Week ${days[0]} to ${sun}. Food logged on ${logged.length} of 7 days.
Averages on logged days: ${avg(d => dayTotals(d).kcal)} kcal (goal ${avg(d => dayGoals(d).kcal)}), protein ${avg(d => dayTotals(d).protein)} g (goal ${avg(d => dayGoals(d).protein)}), carbs ${avg(d => dayTotals(d).carbs)} g, fat ${avg(d => dayTotals(d).fat)} g.
Days within ±10% of the calorie goal: ${logged.filter(d => Math.abs(dayTotals(d).kcal - dayGoals(d).kcal) <= dayGoals(d).kcal * 0.1).length}. Days that hit the protein goal: ${logged.filter(d => dayTotals(d).protein >= dayGoals(d).protein * 0.95).length}.
Health score of the week: ${healthAvg(db.meals.filter(m => days.includes(m.date))) ?? 'n/a'}/10. Calories burned (logged, ${burnWholeDay() ? 'whole-day active calories' : 'workouts only'}): ${days.reduce((a, d) => a + dayBurned(d), 0)} kcal in total.
Weight: ${w1 == null ? 'no weigh-ins' : w0 == null || w0 === w1 ? `${w1} kg` : `${w0} → ${w1} kg (${w1 - w0 > 0 ? '+' : ''}${r1(w1 - w0)} kg this week)`}.
Water: ${wd.length ? `${avg(d => waterOn(d))} ml on average on ${wd.length} days (goal ${waterGoal()} ml)` : 'not tracked'}.
Best day: ${(() => { const sc = d => Math.min(1, dayTotals(d).protein / Math.max(1, dayGoals(d).protein)) - Math.abs(dayTotals(d).kcal - dayGoals(d).kcal) / Math.max(1, dayGoals(d).kcal); const b = [...logged].sort((x, y) => sc(y) - sc(x))[0]; return `${dt(b).toLocaleDateString('en-GB', { weekday: 'long' })} (${r0(dayTotals(b).kcal)} kcal, ${r0(dayTotals(b).protein)} g protein)`; })()}.`;
  const prompt = `${stats}

Write my WEEKLY CHECK-IN for this week. First line: a short title starting with "📊". Then 3 to 5 short bullet points with the real numbers (one of them celebrates my best day): calories and protein vs my goals, consistency, weight trend compared with my goal, and anything that stands out. End with ONE concrete tip for next week, starting with "**Tip:**". Short, honest, warm and motivating. No memory tags.`;
  try {
    const text = await askAI([{ text: prompt }], { json: false, system: coachSystem() });
    chat.push({ role: 'assistant', text: stripTags(text), t: Date.now(), checkin: true }); saveChat(); syncDone();
    if (tab === 'chat') renderChat(true);
    else inPop('📊', T('Your weekly check-in is here'), T('Your coach looked at your week and has one tip for the next.'), () => go('chat'));
  } catch { LS.set('ft_checkin', ''); }
  checkinBusy = false;
}
