/* ================= Weekly check-in from the coach (Sundays, or the day chosen in Settings → Notifications) =================
   On Sunday (from 9:00), or the next time the app is opened in the two days after, the coach writes a
   short summary of the week with the real numbers and one tip. It appears in the coach chat. */
let checkinBusy = false;
async function weeklyCheckin() {
  if (checkinBusy || !db.profile || !hasAI()) return;
  const today = iso(), sun = addDays(today, -((dt(today).getDay() - (pushPrefs().cd ?? 0) + 7) % 7));   // the last check-in day (Sunday unless changed)
  if (LS.get('ft_checkin', '') === sun || daysBetween(sun, today) > 2 || (today === sun && new Date().getHours() < 9)) return;
  const days = [...Array(7)].map((_, i) => addDays(sun, i - 6)), logged = days.filter(d => dayTotals(d).count);
  if (logged.length < 2) return LS.set('ft_checkin', sun);   // too little to say anything useful
  checkinBusy = true; LS.set('ft_checkin', sun);
  const avg = f => r0(logged.reduce((a, d) => a + f(d), 0) / logged.length);
  const wAt = d => { const w = db.weights.filter(x => x.date <= d).sort((a, b) => a.date.localeCompare(b.date)).at(-1); return w ? w.kg : null; };
  const w1 = wAt(sun), w0 = wAt(addDays(sun, -7));
  const wd = days.filter(d => waterOn(d));
  const stats = `Week ${days[0]} to ${sun}. Food logged on ${logged.length} of 7 days.
Averages on logged days: ${avg(d => dayTotals(d).kcal)} kcal (goal ${avg(d => dayGoals(d).kcal)}), protein ${avg(d => dayTotals(d).protein)} g (goal ${avg(d => dayGoals(d).protein)}), carbs ${avg(d => dayTotals(d).carbs)} g, fat ${avg(d => dayTotals(d).fat)} g.
Days within ±10% of the calorie goal: ${logged.filter(d => Math.abs(dayTotals(d).kcal - dayGoals(d).kcal) <= dayGoals(d).kcal * 0.1).length}. Days that hit the protein goal: ${logged.filter(d => dayTotals(d).protein >= dayGoals(d).protein * 0.95).length}.
Health score of the week: ${healthAvg(db.meals.filter(m => days.includes(m.date))) ?? 'n/a'}/10. Calories burned (logged, ${burnWholeDay() ? 'whole-day active calories' : 'workouts only'}): ${days.reduce((a, d) => a + dayBurned(d), 0)} kcal in total.
Weight: ${w1 == null ? 'no weigh-ins' : w0 == null || w0 === w1 ? `${w1} kg` : `${w0} → ${w1} kg (${w1 - w0 > 0 ? '+' : ''}${r1(w1 - w0)} kg this week)`}.
${db.habit ? `Habit "${habitName(db.habit)}": kept on ${days.filter(d => habitDay(db.habit, d) === true).length}, slipped on ${days.filter(d => habitDay(db.habit, d) === false).length} days this week.\n` : ''}Water: ${wd.length ? `${avg(d => waterOn(d))} ml on average on ${wd.length} days (goal ${waterGoal()} ml)` : 'not tracked'}.
Best day: ${(() => { const sc = d => Math.min(1, dayTotals(d).protein / Math.max(1, dayGoals(d).protein)) - Math.abs(dayTotals(d).kcal - dayGoals(d).kcal) / Math.max(1, dayGoals(d).kcal); const b = [...logged].sort((x, y) => sc(y) - sc(x))[0]; return `${dt(b).toLocaleDateString('en-GB', { weekday: 'long' })} (${r0(dayTotals(b).kcal)} kcal, ${r0(dayTotals(b).protein)} g protein)`; })()}.`;
  const prompt = `${stats}

Write my WEEKLY CHECK-IN for this week. First line: a short title starting with "📊". Then 3 to 5 short bullet points with the real numbers (one of them celebrates my best day): calories and protein vs my goals, consistency, weight trend compared with my goal, and anything that stands out. End with ONE concrete tip for next week, starting with "**Tip:**". Short, honest, warm and motivating. No memory tags.`;
  try {
    const text = await askAI([{ text: prompt }], { json: false, system: coachSystem() });
    chat.push({ role: 'assistant', text: stripTags(text), t: Date.now(), checkin: true }); saveChat(); syncDone();
    if (tab === 'chat') renderChat(true);
    else inPop('📊', T('Your weekly check-in is here'), T('Your coach looked at your week and has one tip for the next.'), () => go('chat'));
  } catch { LS.set('ft_checkin', ''); }
  checkinBusy = false;
}

/* ================= Weekly meal plan & grocery list =================
   The AI plans 7 days of meals that fit the user's goal, daily targets, preferences and what the coach
   remembers, plus one merged shopping list for the week. A plan week runs Saturday → Friday: every
   Saturday morning a new plan is made by itself (unless the user chose to keep their plan). Old plans are
   kept for a few weeks so the next plan doesn't repeat them. The coach sees the current plan too. */
let mpMigrated = false;
function mealPlans() {
  const ps = (db.mealPlans = db.mealPlans || {});
  if (!mpMigrated) {   // plans from the first version were filed under Mondays: move them to their Saturday
    mpMigrated = true;
    for (const k of Object.keys(ps)) {
      if (!ps[k].start) ps[k].start = k;
      if (dt(k).getDay() !== 6) { const nk = satOnOrBefore(k); if (!ps[nk]) ps[nk] = ps[k]; delete ps[k]; }
    }
  }
  return ps;
}
const mealPrefs = () => (db.mealPrefs = db.mealPrefs || { set: false, diet: 'all', avoid: '', likes: '', cook: 'normal', budget: 'normal', meals: '3+1', people: 1 });
const satOnOrBefore = s => addDays(s, -((dt(s).getDay() + 1) % 7));
const planKey = () => satOnOrBefore(iso(new Date(Date.now() - 6 * 3600e3)));   // the new week starts Saturday 06:00
const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const autoPlan = () => mealPrefs().auto !== false;
function curPlan() {
  const ps = mealPlans(), k = planKey();
  if (ps[k]) return ps[k];
  if (!autoPlan()) { const last = Object.keys(ps).filter(x => x <= k).sort().pop(); return last ? ps[last] : undefined; }
}
// The 7 days shown right now (a kept plan simply repeats every week)
const cycleStart = plan => { const d = daysBetween(plan.start, iso()); return d > 0 ? addDays(plan.start, Math.floor(d / 7) * 7) : plan.start; };
const todayIdx = plan => daysBetween(cycleStart(plan), iso());
const engDay = (start, i) => dt(addDays(start, i)).toLocaleDateString('en-GB', { weekday: 'long' });
const weekLabel = ws => `${fmtDate(ws)} – ${fmtDate(addDays(ws, 6))}`;
const MP_DIET = [['all', N('I eat everything')], ['vegetarian', N('Vegetarian')], ['vegan', N('Vegan')], ['pescatarian', N('Pescatarian (fish, no meat)')], ['nopork', N('No pork')], ['halal', N('Halal')]];
const MP_COOK = [['quick', N('Quick (under 20 min)')], ['normal', N('Normal')], ['prep', N('Meal prep (cook 2–3× a week)')]];
const MP_BUDGET = [['low', N('Low budget')], ['normal', N('Normal')], ['high', N('No limit')]];
const MP_MEALS = [['2', N('2 meals')], ['3', N('3 meals')], ['3+1', N('3 meals + 1 snack')], ['3+2', N('3 meals + 2 snacks')]];
let mpBusy = null, mpTab = 'list', mpTried = 0;   // mpBusy: null, 'all' (whole plan) or 'day-meal' (one swap)

function prefsText(pr) {
  const lab = (list, v) => (list.find(x => x[0] === v) || list[0])[1];
  return `diet: ${lab(MP_DIET, pr.diet)}; allergies / does not eat: ${pr.avoid || 'nothing special'}; loves: ${pr.likes || 'no special wishes'}; cooking time: ${lab(MP_COOK, pr.cook)}; budget: ${lab(MP_BUDGET, pr.budget)}; meals per day: ${lab(MP_MEALS, pr.meals)}; cooking for ${pr.people} person(s)`;
}
function planGoalText() {
  const p = db.profile, t = targets(), ft = fastType(p);
  let s = `Daily targets per person: ${t.kcal} kcal, ${t.protein} g protein, ${t.carbs} g carbs, ${t.fat} g fat. Goals: ${goalsText(p)}. ${planCoach(p)}`;
  if (ft === 'if') { const f = fastState(p); s += ` Eating window ${f.startStr}-${f.endStr}: every meal must fit inside it.`; }
  if (ft === '52' || ft === 'adf') { const days = [...Array(7)].map((_, i) => addDays(iso(), i)).filter(d => isFastDay(p, d)).map(d => dt(d).toLocaleDateString('en', { weekday: 'long' }));
    s += ` Fast days (${days.join(', ')}): only about ${FAST_KCAL(p)} kcal per person, e.g. a protein-rich soup with vegetables; normal meals on the other days.`; }
  return s;
}
function planBrief(plan, withList) {
  let s = plan.days.map((d, i) => `${engDay(plan.start, i)}: ${d.meals.map(m => `${m.type} "${m.name}" (${m.kcal} kcal, ${m.protein} g P)`).join('; ')}`).join('\n');
  if (withList) s += '\nGrocery list: ' + plan.groceries.map(g => `${g.cat}: ${g.items.map(i => `${i.name} ${i.qty}`).join(', ')}`).join(' | ');
  return s;
}
const cleanMeal = m => ({ type: String(m.type || ''), name: String(m.name || ''), desc: String(m.desc || ''), min: r0(num(m.min)), g: r0(num(m.g)),
  kcal: r0(num(m.kcal)), protein: r0(num(m.protein)), carbs: r0(num(m.carbs)), fat: r0(num(m.fat)),
  ...(m.sugar != null ? { sugar: r1(num(m.sugar)) } : {}), ...(m.fiber != null ? { fiber: r1(num(m.fiber)) } : {}), ...(m.sodium != null ? { sodium: r0(num(m.sodium)) } : {}) });
const cleanGroceries = gs => gs.map(g => ({ cat: String(g.cat || ''), items: (g.items || []).filter(i => i && i.name)
  .map(i => ({ name: String(i.name), qty: String(i.qty || ''), have: false })) })).filter(g => g.items.length);
function trimPlans() { const ks = Object.keys(mealPlans()).sort(); ks.slice(0, Math.max(0, ks.length - 8)).forEach(k => delete db.mealPlans[k]); }

async function generatePlan(change, background) {
  if (mpBusy) return;
  if (!hasAI()) return background ? null : toast(T('Add your free AI key in Settings first.'));
  const ws = planKey(), pr = mealPrefs(), old = curPlan();
  const recent = Object.keys(mealPlans()).filter(k => k < ws).sort().slice(-2).flatMap(k => mealPlans()[k].days.flatMap(d => d.meals.map(m => m.name)));
  mpBusy = 'all'; mpTried = Date.now(); renderMealPlan(); if (tab === 'home' && !$('#mplan')) renderHome();
  const prompt = `Create a weekly meal plan and ONE grocery list for the whole week (${engDay(ws, 0)} to ${engDay(ws, 6)}, starting ${ws}).

THE USER
${planGoalText()}
Preferences: ${prefsText(pr)}
${memList().length ? 'What their nutrition coach knows about them: ' + memList().map(m => m.text).join('; ') : ''}

RULES
- 7 days, in order from ${engDay(ws, 0)}. Every day has exactly the meals from "meals per day" (snacks use type "Snack"). Each day adds up to the daily kcal target (within ±5%) and reaches the protein target.
- Tasty, varied, realistic home cooking with ingredients that are easy to find in a normal supermarket in the user's country (app locale ${LOC}). Different main dishes on different days; leftovers may be planned on purpose to save time.
- Follow the diet, allergies and dislikes strictly. Match the cooking time and budget.
- Reuse ingredients across the week so little is wasted.
${recent.length ? `- Do NOT repeat these meals from the previous weeks: ${[...new Set(recent)].slice(0, 40).join(', ')}.` : ''}
${change && old ? `- The user wants to CHANGE the current plan: "${change}". Keep what doesn't need to change.\nCurrent plan:\n${planBrief(old)}` : change ? `- Extra wish from the user: "${change}".` : ''}
- The grocery list covers ALL meals for ${pr.people} person(s) for the whole week, merged (each ingredient once with the total amount, metric units or pieces), grouped into supermarket sections in a sensible shopping order. Leave out water; basic spices and oil go once into a pantry section.
- "prep": 3 to 6 short, practical meal-prep tips for exactly this plan (what to cook ahead, on which day, how to store it).
- Write all names, descriptions, section names and tips in ${langInfo().ai}. Nutrition numbers are per person, per serving (sugar and fiber in grams, sodium in milligrams).${isLb() ? ' Grocery quantities in US units (lb, oz, fl oz, pieces).' : ''}

Return JSON only:
{"days":[{"meals":[{"type":"Breakfast","name":"","desc":"one short sentence: main ingredients and how it is made","min":15,"g":350,"kcal":0,"protein":0,"carbs":0,"fat":0,"sugar":0,"fiber":0,"sodium":0}]}],"groceries":[{"cat":"","items":[{"name":"","qty":""}]}],"prep":[""]}`;
  try {
    const r = await askAI([{ text: prompt }], { timeout: 120000 });
    if (!r || !Array.isArray(r.days) || r.days.length < 7 || !Array.isArray(r.groceries)) throw new Error(T('The AI answer was incomplete. Please try again.'));
    mealPlans()[ws] = { created: Date.now(), start: ws, days: r.days.slice(0, 7).map(d => ({ meals: (d.meals || []).map(cleanMeal) })),
      groceries: cleanGroceries(r.groceries), prep: (r.prep || []).map(String).filter(Boolean).slice(0, 8) };
    trimPlans(); save(); mpTab = 'list'; LS.set('ft_mp_week', ws);
    if (background) planPopup(true); else toast('✓ ' + T('Your meal plan is ready'));
  } catch (e) { if (!background) toast(aiMsg(e)); }
  mpBusy = null; renderMealPlan(); if (tab === 'home') renderHome();
}

async function swapMeal(di, mi) {
  const plan = curPlan();
  if (!plan || mpBusy) return;
  if (!hasAI()) return toast(T('Add your free AI key in Settings first.'));
  const m = plan.days[di].meals[mi];
  mpBusy = di + '-' + mi; renderMealPlan();
  const prompt = `The user's weekly meal plan and grocery list:
${planBrief(plan, true)}

THE USER
${planGoalText()}
Preferences: ${prefsText(mealPrefs())}

Replace ONLY this meal: ${engDay(plan.start, di)}, ${m.type} "${m.name}" (${m.kcal} kcal, ${m.protein} g protein). Give a different, tasty meal of the same type with about the same calories and protein that is not already in the plan. Then return the complete updated grocery list (remove what is no longer needed, add what the new meal needs, keep the same sections). Write in ${langInfo().ai}.
Return JSON only: {"meal":{"type":"","name":"","desc":"","min":15,"g":350,"kcal":0,"protein":0,"carbs":0,"fat":0,"sugar":0,"fiber":0,"sodium":0},"groceries":[{"cat":"","items":[{"name":"","qty":""}]}]}`;
  try {
    const r = await askAI([{ text: prompt }], { timeout: 90000 });
    if (!r || !r.meal || !r.meal.name) throw new Error(T('The AI answer was incomplete. Please try again.'));
    plan.days[di].meals[mi] = cleanMeal(r.meal);
    if (Array.isArray(r.groceries) && r.groceries.length) {
      const had = new Set(plan.groceries.flatMap(g => g.items.filter(i => i.have).map(i => i.name.toLowerCase())));
      plan.groceries = cleanGroceries(r.groceries);
      plan.groceries.forEach(g => g.items.forEach(i => { if (had.has(i.name.toLowerCase())) i.have = true; }));
    }
    save(); toast('✓ ' + T('Meal swapped'));
  } catch (e) { toast(aiMsg(e)); }
  mpBusy = null; renderMealPlan(); if (tab === 'home') renderHome();
}

// "I ate this": logs a planned meal in one tap (on its planned day, or today if that day is still ahead)
function logPlanMeal(di, mi) {
  const plan = curPlan(); if (!plan) return;
  const m = plan.days[di].meals[mi], day = addDays(cycleStart(plan), di), date = day > iso() ? iso() : day;
  if (m.ate === day && !confirm(T('Already logged. Log it again?'))) return;
  db.meals.push({ id: uid(), date, time: nowTime(), name: m.name, servings: 1, health: null, source: 'plan', photo: false,
    items: [{ name: m.name, grams: m.g || 0, kcal: m.kcal, protein: m.protein, carbs: m.carbs, fat: m.fat, sugar: m.sugar ?? null, fiber: m.fiber ?? null, sodium: m.sodium ?? null }] });
  m.ate = day; save(); toast(T('✓ {name} logged', { name: m.name })); renderMealPlan();
}

    }).join('') + (plan.prep.length ? `<div class="card"><b>🥡 ${T('Meal prep tips')}</b><ul class="mp-tips">${plan.prep.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : '');

// Saves the grocery list + meal plan as one image (iPhone: "Save Image" → Photos, or "Save to Files")
async function exportPlan() {
  const plan = curPlan(); if (!plan) return;
  const ws = cycleStart(plan), W = 1080, P = 72, c = document.createElement('canvas'), x = c.getContext('2d');
  const font = (s, w) => `${w} ${s}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
  const layout = draw => {
    let y = P;
    const text = (t, size, w, color, gap = 1.4) => {
      t = unitText(String(t)); x.font = font(size, w);
      const max = W - P * 2, lines = []; let line = '';
      for (const wd of String(t).split(' ')) { const tl = line ? line + ' ' + wd : wd; if (line && x.measureText(tl).width > max) { lines.push(line); line = wd; } else line = tl; }
      lines.push(line);
      for (const l of lines) { y += size * gap; if (draw) { x.fillStyle = color; x.fillText(l, P, y); } }
    };
    text(T('Grocery list'), 62, 800, '#111', 1.2);
    text(`${weekLabel(ws)} · Food Tracker`, 30, 500, '#8a8a8e');
    for (const g of plan.groceries) {
      y += 30; text(g.cat, 36, 700, '#f08000');
      for (const it of g.items) text(`${it.have ? '☑' : '☐'}  ${it.name}${it.qty ? ' — ' + it.qty : ''}`, 32, 400, it.have ? '#b0b0b4' : '#222', 1.5);
    }
    y += 56; text(T('Meal plan'), 52, 800, '#111', 1.2);
    plan.days.forEach((d, i) => {
      y += 26; text(fmtDate(addDays(ws, i), { weekday: 'long', day: 'numeric', month: 'short' }), 34, 700, '#f08000');
      for (const m of d.meals) text(`${m.type}: ${m.name} · ${m.kcal} kcal, ${m.protein} g P`, 29, 400, '#222', 1.5);
    });
    if (plan.prep.length) { y += 44; text(T('Meal prep tips'), 40, 800, '#111', 1.2); for (const t of plan.prep) text('• ' + t, 29, 400, '#222', 1.5); }
    return Math.ceil(y + P);
  };
  c.width = W; c.height = 10; const H = layout(false);
  c.width = W; c.height = H; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); layout(true);
  // Made without waiting, so the iPhone still allows the share menu for this tap
  const bin = atob(c.toDataURL('image/png').split(',')[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const file = new File([bytes], `grocery-list-${ws}.png`, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

// Saturday morning: a new plan by itself (or, for a kept plan, a fresh grocery list), with a small pop-up
function checkPlanWeek() {
  if (!db.profile || !mealPrefs().set || !Object.keys(mealPlans()).length || mpBusy) return;
  const k = planKey(), seen = LS.get('ft_mp_week', '');
  if (seen === k) return;
  if (!seen) return LS.set('ft_mp_week', k);
  if (autoPlan()) {
    if (mealPlans()[k]) return LS.set('ft_mp_week', k);
    if (hasAI() && Date.now() - mpTried > 10 * 60e3) generatePlan(null, true);
  } else {
    const plan = curPlan();
    if (plan) { plan.groceries.forEach(g => g.items.forEach(i => i.have = false)); save(); }

async function fillExtras(id) {

${list}

    if (!d || !d.text) throw new Error(T('The AI gave an unreadable answer. Please try again.'));

async function sendChat(text) {
  if (chatBusy) return;
  if (!hasAI()) { toast(T('Add your free AI key in Settings first.')); return; }
  const att = chatAtt; chatAtt = [];
  const pics = att.filter(x => x.kind === 'image'), docs = att.filter(x => x.kind === 'file');
  const q = text || (docs.length ? (docs.length > 1 || pics.length ? T('What do you think about these files?') : T('What do you think about this file?'))
    : pics.length > 1 ? T('What do you think about these photos?') : T('What do you think about this food?'));
  // The most recent photos/files stay with the conversation, so follow-up questions ("what should I order?") still see them
  let kept = null; try { kept = await idb.get('chatatt'); } catch {}
  const recent = chat.filter(m => !m.err).slice(-30), keptIdx = kept ? recent.findIndex(m => m.t === kept.t) : -1;
  const history = recent.map((m, i) => {
    const n = m.imgs ? m.imgs.length : m.img ? 1 : 0, fs = m.files || (m.file ? [m.file] : []);
    const textPart = { text: m.text + (n ? `\n[${n} photo(s) attached]` : '') + (fs.length ? `\n[file(s) attached: ${fs.join(', ')}]` : '') + (m.role === 'user' && m.t ? `\n[sent earlier: ${new Date(m.t).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}; this is NOT the current time]` : '') };
    return { role: m.role, parts: i === keptIdx && i >= recent.length - 12 ? [...kept.parts, textPart] : [textPart] };
  });
  const usesKept = keptIdx >= 0 && keptIdx >= recent.length - 12;
  const sentAt = Date.now();
  chat.push({ role: 'user', text: q, imgs: pics.length ? pics.map(x => x.thumb) : null, files: docs.length ? docs.map(x => x.name) : null, t: sentAt });
  saveChat(); chatBusy = true; renderChat(true);

  /* Calm typing: the stream fills `target` as fast as the AI sends it; the bubble shows it word by
     word at a steady reading pace (a bit quicker when a lot is waiting, so long answers don't drag). */
  let target = '', shown = 0, done = false;
  const near = chatNear;
  const nextWordEnd = (s, from) => { const m = /\S+\s*/y; m.lastIndex = from; return m.exec(s) ? m.lastIndex : s.length; };
  const typer = setInterval(() => {
    const live = $('#live'), clean = stripTags(target);
    if (!live || shown >= clean.length) return;
    const backlog = clean.slice(shown).split(/\s+/).length;
    const n = done ? Math.max(3, Math.ceil(backlog / 20)) : backlog > 120 ? 6 : backlog > 50 ? 4 : 2;
    for (let i = 0; i < n; i++) shown = nextWordEnd(clean, shown);
    const stick = near();
    live.innerHTML = md(tidyPartial(clean.slice(0, shown))).replace(/(<\/(p|li)>(<\/[uo]l>)?)$/, '<span class="caret"></span>$1');
    if (stick) chatToBottom();
  }, 45);

  let entry;
  try {
    const attach = att.map(x => x.kind === 'image' ? { image: x.full } : x.text != null ? { text: `Attached file "${x.name}":\n${x.text}` } : { inline: { mime: x.mime, data: x.data } });
    if (att.length) {
      attach.push({ text: `[The user attached ${pics.length ? pics.length + ' photo(s)' : ''}${pics.length && docs.length ? ' and ' : ''}${docs.length ? docs.length + ' file(s)' : ''} above, in order${pics.length > 1 ? ' (e.g. several pages of one menu: look at ALL of them together)' : ''}. Read them carefully and answer from what is actually in them.]` });
      idb.set('chatatt', { t: sentAt, parts: attach }).catch(() => {});   // for follow-up questions
    }
    const parts = [...attach, { text: `${liveNumbers()}\n\n${q}` }];
    const answer = await askAI(parts, { json: false, system: coachSystem(), history, strong: att.length > 0 || usesKept, timeout: att.length || usesKept ? 90000 : undefined, onText: t => { target = t; } });
    target = answer; done = true;
    const mem = applyMemoryTags(answer);
    entry = { role: 'assistant', text: stripTags(answer), mem: mem > 0, t: Date.now() };
  } catch (e) {
    entry = { role: 'assistant', err: true, text: aiMsg(e), t: Date.now() };
  }
  done = true;
  // Let the typing finish before swapping in the final message
  if (!entry.err) await new Promise(r => { const wait = () => (shown >= stripTags(target).length || tab !== 'chat' || !$('#live')) ? r() : setTimeout(wait, 40); wait(); });
  clearInterval(typer);
  chat.push(entry); chatBusy = false; saveChat();
  if (tab === 'chat') {
    const live = $('#live');
    if (live) { const stick = near(); live.outerHTML = chatBubble(entry); if (stick) chatToBottom(true); }
    else renderChat(true);
  }
}

/* ================= Reminders (push notifications) =================
   iPhone web apps can only get notifications that a server sends. A free GitHub Actions workflow
   (.github/workflows/reminders.yml) sends them on a schedule to this phone's push address. */
const VAPID_PUBLIC = 'BNwyCPM2UJcV1DRBWLwm8YLYND0WVMM_Tk2vgLuuoc4gLhM-v-uU37EdwkgiSoHSDe4YmZ-NxDzvzT7782XRjxM';
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64ToBytes(b) { const p = '='.repeat((4 - b.length % 4) % 4), raw = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
// The service worker shows the notifications in the app's language; it reads the texts from here.
// Minimal look: just the short message in bold; iPhone adds "from <app name>" below it by itself.
const reminderData = () => ({ burn: T('Calories burned today?'), weight: T('Weekly weigh-in'), checkin: T('Your weekly check-in is ready 📊'),
  fastOpen: T('Your eating window is open now ⏱️'), fastClose: T('Your eating window closes in 30 min ⏱️'), habit: habitReminderText() });
const reminderContent = (R, kind) => ({ title: R[kind], body: '' });
let remT;
function saveReminderTexts() {
  if (!('caches' in window)) return;
  clearTimeout(remT);
  remT = setTimeout(() => {
    try { caches.open('ft-meta').then(c => c.put('./reminder-texts', new Response(JSON.stringify(reminderData())))).catch(() => {}); } catch {}
  }, 400);
}
async function enableReminders() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast(T('Notifications are blocked. Allow them in iPhone Settings → FoodTracker → Notifications.'));
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    LS.set('ft_push', JSON.stringify(sub)); saveReminderTexts(); LS.del('ft_push_sent'); syncPush();
    toast(T('✓ Notifications allowed')); if (tab === 'settings') renderSettings();
  } catch (e) { toast(T('Could not turn on notifications.') + ' ' + (e.message || '')); }
}

// Sends this phone's notification address to the server (again whenever it changes)
async function syncPush() {
  try {
    if (!SERVER_URL || !pushSupported() || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    const js = JSON.stringify(sub); LS.set('ft_push', js);
    const pf = db.profile, fasting = pf && fastType(pf) === 'if' && pf.fast;
    const prefs = { ...pushPrefs(), tz: userTZ(), fo: fasting && pushPrefs().fo ? 1 : 0, fs: fasting ? pf.fast.start : '', fh: fasting ? pf.fast.h : 0 },
      sent = js + JSON.stringify(prefs);   // resend when the address, times or time zone change
    if (LS.get('ft_push_sent', '') === sent) return;
    const r = await fetch(SERVER_URL + '/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sub, prefs }) });
    if (r.ok) LS.set('ft_push_sent', sent);
  } catch {}
}
// Friendly question to turn on reminders: right after setup, then at most twice more, a few days apart
// Asks to turn on reminders (right after the tour, or now and then). "then" runs when the question is done.
function askReminders(force, then) {
  const next = () => { if (then) { const t = then; then = null; setTimeout(t, 500); } };
  if (!db.profile || !pushSupported() || (isIOS() && !isStandalone()) || Notification.permission !== 'default' || $('.backdrop') || $('#onb') || $('#tourLayer')) return next();
  const st = JSON.parse(LS.get('ft_push_ask', '{"n":0,"t":0}'));
  if (!force && (st.n >= 3 || Date.now() - st.t < 3 * 864e5)) return next();
  LS.set('ft_push_ask', JSON.stringify({ n: st.n + 1, t: Date.now() }));
  sheet(`<div style="text-align:center;padding:8px 4px 4px">
      <div class="askbell">🔔</div>
      <h3 style="margin:14px 0 6px">${T('Turn on reminders')}</h3>
      <p class="muted" style="margin:0 0 8px">${T('Short reminders to log your calories burned, for your weekly weigh-in and your weekly check-in.')}</p>
      <p class="small muted" style="margin:0 0 22px">${T('You can turn each one on or off and choose the times in Settings → Notifications.')}</p>
      <button class="btn" id="askYes">${T('Allow')}</button>
      <button class="btn outline" id="askNo" style="margin-top:10px">${T('Not now')}</button></div>`, sh => {
    sh.querySelector('#askYes').onclick = async () => { closeSheet(); await enableReminders(); next(); };
    sh.querySelector('#askNo').onclick = () => { dismissSheet(); setTimeout(next, 350); };
  });
}

/* ---------- Silent updates: when the app comes back to the screen, load a new version if there is one ---------- */
let updReady = false, updChecked = 0;
const safeToReload = () => !$('.backdrop') && !$('.page') && !document.body.classList.contains('typing') && !pending.length && !rec && !$('.msg .caret');
async function checkUpdate() {
  if (Date.now() - updChecked < 60e3 || !location.protocol.startsWith('http')) return;
  updChecked = Date.now();
  try {
    const t = await (await fetch('sw.js?u=' + Date.now(), { cache: 'no-store' })).text();
    const v = (t.match(/CACHE = '([^']+)'/) || [])[1];
    // Only one try per new version, so a half-finished upload can never cause repeated reloads
    if (v && v !== APP_VERSION && LS.get('ft_upd_tried', '') !== v) { LS.set('ft_upd_tried', v); updReady = true; navigator.serviceWorker?.getRegistration().then(r => r && r.update()).catch(() => {}); if (safeToReload()) location.reload(); }
  } catch {}
}
let lastTouch = Date.now();
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (!updReady) checkUpdate();
  else if (Date.now() - lastTouch > 45e3 && safeToReload()) kvWait().then(() => location.reload());   // nobody is using it right now
}, 5 * 60e3);
setInterval(() => { if (updReady && document.visibilityState === 'visible' && Date.now() - lastTouch > 45e3 && safeToReload()) kvWait().then(() => location.reload()); }, 20e3);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { checkUpdate(); setTimeout(processQueue, 1000); setTimeout(() => linkSync(false), 1200); if ($('#setupPg')) setTimeout(openSetupPage, 600); syncPush(); setTimeout(checkPlanWeek, 800); setTimeout(autoBackup, 3000); setTimeout(askAccount, 5000); setTimeout(emailNote, 6500); setTimeout(weeklyCheckin, 1500); setTimeout(syncDone, 2500); }
  else { if (!rec) micOff(); cameraOff(); if (updReady) kvWait().then(() => location.reload()); }   // in the background: nobody sees the reload
});

/* ---------- Loading: when something takes longer than a moment, the app logo turns big in the middle of the screen ----------
   Only shown after about half a second, so quick actions never flicker. */
let busyN = 0, busyT = null;
const LOGO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="6.9" stroke-width="2.3" pathLength="100" stroke-dasharray="83.33 100" transform="rotate(-60 12 12)"/><circle cx="15.5" cy="5.95" r="1.95" fill="#ff9500" stroke="none"/></svg>';
function busyStart(text = '') {
  if (busyN++ > 0) return;
  clearTimeout(busyT);
  busyT = setTimeout(() => {
    if ($('#busy')) return;
    const el = document.createElement('div'); el.id = 'busy'; el.setAttribute('role', 'status');
    el.innerHTML = `<div class="busy-logo">${LOGO_SVG}</div>${text ? `<p>${esc(text)}</p>` : ''}`;
    document.body.appendChild(el);
  }, 450);
}
function busyEnd() {
  if (busyN === 0 || --busyN > 0) return;
  clearTimeout(busyT);
  const el = $('#busy'); if (el) { el.classList.add('out'); setTimeout(() => el.remove(), 260); }
}

/* ---------- Pull to refresh: pull the page down at the top and everything updates (tracker calories, new version, etc.) ---------- */
let ptrBusy = false;
async function pullRefresh() {
  updChecked = 0;
  await Promise.allSettled([linkSync(true), checkUpdate(), processQueue(), syncDone(), syncPush()]);
  setTimeout(checkPlanWeek, 300); setTimeout(checkRewards, 600);
  if (!$('.page') && !$('.backdrop')) render();
  if ($('#usBody')) await loadUsers();
}
(() => {
  const sc = $('#scroller'), view = $('#view'), ind = document.createElement('div');
  ind.id = 'ptr';
  ind.innerHTML = '<span class="ptr-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><g class="ptr-logo"><circle class="ptr-arc" cx="12" cy="12" r="6.9" stroke-width="2.3" pathLength="100" transform="rotate(-60 12 12)"/><circle class="ptr-dot" cx="15.5" cy="5.95" r="1.95" fill="#ff9500" stroke="none"/></g><path class="ptr-ok" d="M7.5 12.4l3 3 6-6.4" stroke-width="2.2" stroke-linejoin="round" pathLength="100"/></svg></span>';   // the app logo: a ring with an orange dot
  document.body.appendChild(ind);
  const logo = ind.querySelector('.ptr-logo'), arc = ind.querySelector('.ptr-arc'), dot = ind.querySelector('.ptr-dot');
  const GO = 64, HOLD = 44;
  const rubber = x => (1 - 1 / (x * 0.55 / 320 + 1)) * 320;   // like iOS: light at first, heavier the further you pull
  const ease = 'cubic-bezier(.22,1,.36,1)';
  const anim = (t) => { view.style.transition = `transform ${t}`; ind.style.transition = `transform ${t},opacity .3s ease`; };
  const place = (d, opacity, scale) => {
    view.style.transform = d ? `translate3d(0,${d}px,0)` : '';
    ind.style.transform = `translate3d(0,${Math.min(d, GO) * 0.5 - 30}px,0)`;
    ind.style.opacity = opacity;
  };
  let y0 = null, x0 = 0, raw = 0, pulling = false, raf = 0, armed = false;
  const paint = () => {
    raf = 0;
    const d = rubber(raw), p = Math.min(1, d / GO);
    place(d, p, 1);
    arc.style.strokeDashoffset = 83.33 * (1 - p);           // the logo's ring draws itself while pulling, then its dot pops in
    dot.style.opacity = p >= 1 ? 1 : 0; dot.style.transform = `scale(${p >= 1 ? 1 : 0})`;
    logo.style.transform = `rotate(${p * 180 - 180}deg)`;
    const r = d >= GO; if (r !== armed) { armed = r; ind.classList.toggle('ready', r); }
  };
  sc.addEventListener('touchstart', e => {
    if (ptrBusy || sc.scrollTop > 0 || e.touches.length > 1 || $('.backdrop') || $('#tourLayer')) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; raw = 0; pulling = false;
  }, { passive: true });
  sc.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const d = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (!pulling) {
      if (d > 6 && d > dx * 1.2 && sc.scrollTop <= 0) { pulling = true; y0 += 6; view.classList.remove('pagein'); view.style.transition = ind.style.transition = 'none'; view.style.willChange = 'transform'; }
      else { if (d < 0 || dx > 12) y0 = null; return; }
    }
    e.preventDefault();
    raw = Math.max(0, e.touches[0].clientY - y0);
    if (!raf) raf = requestAnimationFrame(paint);   // one update per screen frame
  }, { passive: false });
  const back = () => {
    anim(`.5s ${ease}`); place(0, 0, 1);
    setTimeout(() => { if (!pulling) { view.style.transition = view.style.willChange = ''; ind.classList.remove('ready', 'turning', 'done'); armed = false; } }, 560);
  };
  const end = async () => {
    if (y0 === null) return; y0 = null;
    if (!pulling) return; pulling = false;
    cancelAnimationFrame(raf); raf = 0;
    if (!armed) return back();
    ptrBusy = true;
    anim(`.45s ${ease}`); place(HOLD, 1, 1);               // settles softly into place and starts spinning
    logo.style.transform = ''; arc.style.strokeDashoffset = 0; dot.style.opacity = 1; dot.style.transform = ''; ind.classList.add('turning');   // the whole logo turns (not 'spin': that is the button spinner style)
    const t0 = Date.now();
    try { await pullRefresh(); } catch {}
    await new Promise(r => setTimeout(r, Math.max(0, 700 - (Date.now() - t0))));   // long enough to see that it happened
    ind.classList.remove('turning'); ind.classList.add('done');   // a green check mark draws itself
    await new Promise(r => setTimeout(r, 550));
    back(); setTimeout(() => { ptrBusy = false; }, 560);
  };
  sc.addEventListener('touchend', end); sc.addEventListener('touchcancel', end);
})();
