/* --- Voice input: record, show a live sound wave, then turn it into text with Gemini --- */
let rec = null;
async function startVoice() {
  if (rec) return;
  if (!getKey()) return toast(T('Voice input needs your free Google AI key (Settings).'));
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast(T('Voice input is not supported on this device.'));
  closeChatMenu();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return toast(T('Microphone access was blocked. Allow it in iPhone Settings → FoodTracker.')); }
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume?.();
  const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
  const mr = new MediaRecorder(stream), chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.start(250);
  const levels = Array(34).fill(0), buf = new Uint8Array(an.fftSize), wave = $('#cWave');
  const timer = setInterval(() => {
    an.getByteTimeDomainData(buf);
    let sum = 0; for (const v of buf) { const x = (v - 128) / 128; sum += x * x; }
    levels.push(Math.min(1, Math.sqrt(sum / buf.length) * 5)); levels.shift();
    wave.innerHTML = levels.map(l => l > 0.06 ? `<i style="height:${Math.round(6 + l * 22)}px"></i>` : '<i class="dot"></i>').join('');
  }, 70);
  rec = { stream, ac, mr, chunks, timer, auto: setTimeout(() => finishVoice(true), 120000) };
  $('.chatbar').classList.add('recording');
}
async function finishVoice(keep) {
  if (!rec) return;
  const r = rec; rec = null;
  clearInterval(r.timer); clearTimeout(r.auto);
  const stopped = new Promise(res => { r.mr.onstop = res; });
  try { r.mr.stop(); } catch {}
  await Promise.race([stopped, new Promise(res => setTimeout(res, 1500))]);
  r.stream.getTracks().forEach(t => t.stop()); r.ac.close?.().catch(() => {});
  const bar = $('.chatbar');
  if (!keep || !bar) { bar?.classList.remove('recording'); return; }
  $('#cWave').innerHTML = `<span class="small muted"><span class="spin"></span> ${T('Transcribing…')}</span>`;
  try {
    const wav = await toWav16k(new Blob(r.chunks, { type: r.mr.mimeType || 'audio/mp4' }));
    const prompt = 'Transcribe this voice message word for word, in the language that is spoken. Return only the transcript text, nothing else.';
    const text = (await geminiChain(getKey(), [{ role: 'user', parts: [{ text: prompt }, { inline: { mime: 'audio/wav', data: wav } }] }], '', false, null)).trim().replace(/^["“]|["”]$/g, '');
    if (!text) throw new Error(T('Could not understand the recording. Please try again.'));
    bar.classList.remove('recording');   // show the text box again before sizing it
    const ta = $('#cIn'); ta.value = (ta.value.trim() ? ta.value.trim() + ' ' : '') + text; ta.oninput();
  } catch (e) { toast(e.message || T('Could not understand the recording. Please try again.')); }
  bar.classList.remove('recording');
}
// Any recording (iPhone records AAC) → 16 kHz mono WAV, which every AI model accepts
async function toWav16k(blob) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await new Promise((res, rej) => { blob.arrayBuffer().then(b => { const p = ac.decodeAudioData(b, res, rej); if (p && p.then) p.then(res, rej); }, rej); });
  ac.close?.().catch(() => {});
  const rate = 16000, off = new OfflineAudioContext(1, Math.max(1, Math.ceil(audio.duration * rate)), rate);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + pcm.length * 2)), str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); str(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); str(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  const bytes = new Uint8Array(dv.buffer); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function sendChat(text) {
  if (chatBusy) return;
  if (!hasAI()) { toast(T('Add your free AI key in Settings first.')); return; }
  const img = chatImg, isFile = img && img.kind === 'file'; chatImg = null;
  const q = text || (isFile ? T('What do you think about this file?') : T('What do you think about this food?'));
  const history = chat.filter(m => !m.err).slice(-30).map(m => ({ role: m.role, parts: [{ text: m.text + (m.img ? '\n[photo attached]' : m.file ? `\n[file attached: ${m.file}]` : '') }] }));
  chat.push({ role: 'user', text: q, img: img && !isFile ? img.thumb : null, file: isFile ? img.name : null, t: Date.now() });
  saveChat(); chatBusy = true; renderChat(true);

  /* Calm typing: the stream fills `target` as fast as the AI sends it; the bubble shows it word by
     word at a steady reading pace (a bit quicker when a lot is waiting, so long answers don't drag). */
  let target = '', shown = 0, done = false;
  const near = chatNear;
  const nextWordEnd = (s, from) => { const m = /\S+\s*/y; m.lastIndex = from; return m.exec(s) ? m.lastIndex : s.length; };
  const typer = setInterval(() => {
    const live = $('#live'), clean = stripTags(target);
    if (!live || shown >= clean.length) return;
    const backlog = clean.slice(shown).split(/\s+/).length;
    for (let i = 0, n = backlog > 120 ? 3 : backlog > 50 ? 2 : 1; i < n; i++) shown = nextWordEnd(clean, shown);
    const stick = near();
    live.innerHTML = md(tidyPartial(clean.slice(0, shown))).replace(/(<\/(p|li)>(<\/[uo]l>)?)$/, '<span class="caret"></span>$1');
    if (stick) chatToBottom();
  }, 55);

  let entry;
  try {
    const attach = !img ? [] : !isFile ? [{ image: img.full }] : img.text != null ? [{ text: `Attached file "${img.name}":\n${img.text}` }] : [{ inline: { mime: img.mime, data: img.data } }];
    const parts = [...attach, { text: `${liveNumbers()}\n\n${q}` }];
    const answer = await askAI(parts, { json: false, system: coachSystem(), history, onText: t => { target = t; } });
    target = answer;
    const mem = applyMemoryTags(answer);
    entry = { role: 'assistant', text: stripTags(answer), mem: mem > 0, t: Date.now() };
  } catch (e) {
    entry = { role: 'assistant', err: true, text: aiMsg(e), t: Date.now() };
  }
  done = true;
  // Let the typing finish before swapping in the final message
  if (!entry.err) await new Promise(r => { const wait = () => (shown >= stripTags(target).length || tab !== 'chat' || !$('#live')) ? r() : setTimeout(wait, 40); wait(); });
  clearInterval(typer);
  chat.push(entry); chatBusy = false; saveChat();
  if (tab === 'chat') {
    const live = $('#live');
    if (live) { const stick = near(); live.outerHTML = chatBubble(entry); if (stick) chatToBottom(true); }
    else renderChat(true);
  }
}

   iPhone web apps can only get notifications that a server sends. A free GitHub Actions workflow
   (.github/workflows/reminders.yml) sends them on a schedule to this phone's push address. */
const VAPID_PUBLIC = 'BNwyCPM2UJcV1DRBWLwm8YLYND0WVMM_Tk2vgLuuoc4gLhM-v-uU37EdwkgiSoHSDe4YmZ-NxDzvzT7782XRjxM';

// Minimal look: just the short message in bold; iPhone adds "from <app name>" below it by itself.
const reminderData = () => ({ burn: T('Calories burned today?'), weight: T('Weekly weigh-in') });
const reminderContent = (R, kind) => ({ title: R[kind], body: '' });
let remT;
function saveReminderTexts() {
  if (!('caches' in window)) return;

    try { caches.open('ft-meta').then(c => c.put('./reminder-texts', new Response(JSON.stringify(reminderData())))).catch(() => {}); } catch {}

async function enableReminders() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast(T('Notifications are blocked. Allow them in iPhone Settings → FoodTracker → Notifications.'));
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    LS.set('ft_push', JSON.stringify(sub)); saveReminderTexts();
    toast(T('✓ Notifications allowed')); renderSettings();

// Shared preview under the goal / personal-details forms: what the daily goals will become
function goalPreview(el, p, w, custom) {
  const t = calcTargets(p, w);
  let when = '';
  if (needsTarget(p) && Math.abs(p.targetWeight - w) >= 0.1 && (p.goal === 'lose') === (p.targetWeight < w)) {
    const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(p.targetWeight - w) / p.pace * 7));
    when = '<br>' + T('Goal weight around <b>{d}</b>', { d: fmtLong(d) });
  }
  el.innerHTML = T('New daily goals: <b>{k} kcal</b> · {p} g protein · {c} g carbs · {f} g fat', { k: t.kcal, p: t.protein, c: t.carbs, f: t.fat }) + when +
    (custom ? `<br><span class="muted">${T('Your custom macro numbers will be replaced by these.')}</span>` : '');
}
const fastPicker = f => `<div class="row"><div class="grow"><label class="lbl">${T('Fasting rhythm')}</label><select id="fH">${FASTS.map(([h, l]) => `<option value="${h}" ${h === f.h ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  <div class="grow"><label class="lbl">${T('Eating window starts')}</label><select id="fS">${[...Array(13)].map((_, i) => { const t = String(i + 6).padStart(2, '0') + ':00'; return `<option ${t === f.start ? 'selected' : ''}>${t}</option>`; }).join('')}</select></div></div>`;
function bindFast(root, f, cb) {
  root.querySelector('#fH').onchange = e => { f.h = +e.target.value; cb(); };
  root.querySelector('#fS').onchange = e => { f.start = e.target.value; cb(); };

// Settings → Your goal: pick one of the 10 goals; the whole app follows. Past days are not changed.
function openMainGoalSheet() {
  if (!db.profile) return startOnboarding();
  const w = currentWeight(), d = clone(db.profile), custom = Object.keys(db.overrides).length > 0;
  d.fast = d.fast || { h: 16, start: '12:00' }; d.carbs = d.carbs || 'keto';
  sheet(`<h3>🎯 ${T('Your goal')}</h3><p class="muted" style="margin-top:4px">${T('Everything in the app adapts to it. Your past days stay as they are.')}</p><div id="gBody"></div>`, s => {
    const fill = () => {
      const pl = planOf(d), [mn, , mx] = paceRange(d), paces = [];
      for (let v = mn; v <= mx + 1e-9; v += 0.05) paces.push(Math.round(v * 100) / 100);
      if (!paces.includes(d.pace)) paces.push(d.pace), paces.sort((a, b) => a - b);
      s.querySelector('#gBody').innerHTML = `
        <div style="margin-top:12px">${PLANS.map(x => `<button class="opt cmp ${x.id === d.plan ? 'on' : ''}" data-plan="${x.id}">${x.ic} ${T(x.name)}<small>${T(x.sub)}</small></button>`).join('')}</div>
        ${pl.dir === null ? `<label class="lbl">${T('And your weight?')}</label><div class="seg">${DIRS.map(([v, l]) => `<button data-dir="${v}" class="${d.goal === v ? 'on' : ''}">${T(l)}</button>`).join('')}</div>` : ''}
        ${pl.id === 'keto' ? `<label class="lbl">${T('How strict?')}</label><div class="seg">${[['keto', N('Keto (max 30 g carbs)')], ['lowcarb', N('Low carb (max 100 g carbs)')]].map(([v, l]) => `<button data-carb="${v}" class="${d.carbs === v ? 'on' : ''}">${T(l)}</button>`).join('')}</div>` : ''}
        ${pl.id === 'if' ? fastPicker(d.fast) : ''}
        ${needsTarget(d) ? `<div class="row"><div class="grow"><label class="lbl">${T('Goal weight (kg)')}</label><input id="gT" inputmode="decimal" value="${d.targetWeight}"></div>
          <div class="grow"><label class="lbl">${T('Speed (kg / week)')}</label><select id="gP">${paces.map(v => `<option value="${v}" ${v === d.pace ? 'selected' : ''}>${v} kg</option>`).join('')}</select></div></div>` : ''}
        <div class="tip" id="gPrev"></div>
        <button class="btn" id="gGo" style="margin-top:16px">${T('Save & update goals')}</button>`;
      const box = s.querySelector('#gBody'), preview = () => goalPreview(box.querySelector('#gPrev'), d, w, custom);
      box.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => { applyPlan(d, b.dataset.plan, w); fill(); });
      box.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => { d.goal = b.dataset.dir; d.pace = paceRange(d)[1]; fixTarget(d, w); fill(); });
      box.querySelectorAll('[data-carb]').forEach(b => b.onclick = () => { d.carbs = b.dataset.carb; fill(); });
      if (box.querySelector('#fH')) bindFast(box, d.fast, preview);
      if (box.querySelector('#gT')) box.querySelector('#gT').oninput = e => { d.targetWeight = r1(num(e.target.value)); preview(); };
      if (box.querySelector('#gP')) box.querySelector('#gP').onchange = e => { d.pace = +e.target.value; preview(); };
      box.querySelector('#gGo').onclick = () => {
        if (needsTarget(d)) {
          if (d.goal === 'lose' && !(d.targetWeight < w)) return toast(T('Your goal weight must be below your current {w} kg', { w }));
          if (isGain(d.goal) && !(d.targetWeight > w)) return toast(T('Your goal weight must be above your current {w} kg', { w }));
        } else d.targetWeight = w;
        db.profile = d; db.overrides = {};
        save(); closeSheet();
        const t = targets(); toast(T('✓ Updated: {k} kcal · {p} g protein', { k: t.kcal, p: t.protein }));
        render();
      };
      preview();
    };
    fill();
  });
}

/* ================= Onboarding ================= */
let ob = null;
const OB = ['intro', 'gender', 'workouts', 'body', 'birth', 'goal', 'dir', 'carbs', 'fasting', 'target', 'speed', 'ai', 'ready'];
function startOnboarding() {
  const base = db.profile ? clone(db.profile) : {};
  ob = { step: 0, p: Object.assign({ sex: '', workouts: '', height: 175, weight: 75, birth: '', plan: '', goal: '', targetWeight: null, pace: 0.5,
    carbs: 'keto', fast: { h: 16, start: '12:00' } }, base) };
  if (db.profile) ob.p.weight = currentWeight();
  closeSheet(); renderOb();
}
// Steps that don't apply to the chosen goal are skipped
function obSkip(i) {
  const s = OB[i], p = ob.p;
  if (s === 'dir') return planOf(p).dir !== null;
  if (s === 'carbs') return p.plan !== 'keto';
  if (s === 'fasting') return p.plan !== 'if';
  if (s === 'target' || s === 'speed') return p.goal === 'maintain';
  return false;
}
function obMove(d) { let i = ob.step + d; while (i > 0 && i < OB.length - 1 && obSkip(i)) i += d; ob.step = clamp(i, 0, OB.length - 1); renderOb(); }
// Goal-specific tips on the "plan is ready" screen
function planTips(p) {
  const t = [], id = planOf(p).id;
  t.push('📷 ' + T('Snap every meal, even snacks'));
  if (id === 'keto') t.push('🥑 ' + T('Keep carbs under {n} g a day', { n: p.carbs === 'lowcarb' ? 100 : 30 }));
  if (id === 'if') { const f = fastState(p); t.push('⏱️ ' + T('Eat only between {a} and {b}', { a: f.startStr, b: f.endStr })); }
  if (id === 'healthy') t.push('🥗 ' + T('Aim for 30 g fiber a day and less sugar and salt'));
  t.push('🍗 ' + T('Hit your protein goal every day'));
  if (['lean', 'bulk', 'dirty', 'recomp'].includes(id) || p.goal === 'lean') t.push('🏋️ ' + T('Train with weights 3–5× a week and get stronger over time'));
  if (id === 'recomp') t.push('🔄 ' + T('Your weight may stay similar while your body changes'));
  t.push('⚖️ ' + T('Weigh yourself in the morning a few times a week'));
  return t;
}
function renderOb() {
  let pg = $('#onb');
  if (!pg) { pg = document.createElement('div'); pg.id = 'onb'; pg.className = 'page'; pg.style.zIndex = 45; document.body.appendChild(pg); }
  const p = ob.p, s = OB[ob.step];
  const opts = (field, list) => list.map(([v, l, sub]) => `<button class="opt ${p[field] === v ? 'on' : ''}" data-set="${field}" data-v="${v}">${l}${sub ? `<small>${sub}</small>` : ''}</button>`).join('');
  const kgOpts = (v, from, to) => { let o = ''; for (let k = from; k <= to; k += 0.5) o += `<option value="${k}" ${Math.abs(k - v) < 0.01 ? 'selected' : ''}>${k} kg</option>`; return o; };
  const calib = T('This will be used to calibrate your custom plan.');
  let title = '', sub = '', body = '', ok = true, cta = T('Continue');
  if (s === 'intro') {
    pg.innerHTML = `<div class="onb" style="justify-content:center;text-align:center">
      <div class="spread">${db.profile ? `<button class="chipbtn" id="obCancel">✕ ${T('Close')}</button>` : '<span></span>'}<button class="chipbtn" id="obLang">🌐 ${langInfo().f} ${langInfo().n}</button></div>
      <div class="onb-body" style="display:flex;flex-direction:column;justify-content:center;align-items:center">
        <img src="icon-512.png" alt="" style="width:110px;height:110px;border-radius:28px;box-shadow:var(--shadow)">
        <h1 style="margin-top:30px">${T('Calorie tracking<br>made easy')}</h1>
        <p class="muted" style="max-width:300px">${T('Just snap a photo of your meal and let AI do the rest.')}</p></div>
      <button class="btn" id="obNext">${T('Get started')}</button></div>`;
    pg.querySelector('#obNext').onclick = () => obMove(1);
    pg.querySelector('#obLang').onclick = () => openLangSheet(renderOb);
    // Redoing the setup from Settings can be cancelled; nothing is changed until the last step
    if (pg.querySelector('#obCancel')) pg.querySelector('#obCancel').onclick = () => { ob = null; $('#onb')?.remove(); render(); };
    return;
  }
  if (s === 'gender') { title = T('Choose your gender'); sub = calib; body = opts('sex', [['m', T('Male')], ['f', T('Female')], ['o', T('Other')]]); ok = !!p.sex; }
  if (s === 'workouts') { title = T('How many workouts do you do per week?'); sub = calib;
    body = opts('workouts', [['0-2', '0–2', T('Workouts now and then')], ['3-5', '3–5', T('A few workouts per week')], ['6+', '6+', T('Dedicated athlete')]]); ok = !!p.workouts; }
  if (s === 'body') { title = T('Height & weight'); sub = calib;
    let h = ''; for (let c = 120; c <= 230; c++) h += `<option value="${c}" ${c === r0(p.height) ? 'selected' : ''}>${c} cm</option>`;
    body = `<div class="row"><div class="grow"><label class="lbl">${T('Height')}</label><select id="obH">${h}</select></div><div class="grow"><label class="lbl">${T('Weight')}</label><select id="obW">${kgOpts(Math.round(p.weight * 2) / 2, 35, 250)}</select></div></div>`; }
  if (s === 'birth') { title = T('When were you born?'); sub = calib;
    body = `<input type="date" id="obB" value="${p.birth}" max="${addDays(iso(), -365 * 12)}" min="1920-01-01" style="font-size:20px;text-align:center;padding:18px">`; ok = !!p.birth; }
  if (s === 'goal') { title = T('What is your main goal?'); sub = T('Everything in the app adapts to it. You can change it any time in Settings.');
    body = PLANS.map(x => `<button class="opt cmp ${p.plan === x.id ? 'on' : ''}" data-plan="${x.id}">${x.ic} ${T(x.name)}<small>${T(x.sub)}</small></button>`).join(''); ok = !!p.plan; }
  if (s === 'dir') { title = T('What about your weight?'); sub = T('{goal} works with any weight goal.', { goal: T(planOf(p).name) });
    body = opts('goal', [['lose', T('Lose weight')], ['maintain', T('Keep my weight')], ['lean', T('Gain weight'), T('Slowly, mostly muscle')]]); ok = ['lose', 'maintain', 'lean'].includes(p.goal); }
  if (s === 'carbs') { title = T('How strict do you want to be?');
    body = opts('carbs', [['keto', T('Keto'), T('Max 30 g carbs a day')], ['lowcarb', T('Low carb'), T('Max 100 g carbs a day')]]); }
  if (s === 'fasting') { const f = fastState(p); title = T('Choose your fasting rhythm'); sub = T('You only eat inside your eating window.');
    body = fastPicker(p.fast) + `<div class="tip">${T('Eating window: {a} – {b}', { a: f.startStr, b: f.endStr })}</div>`; }
  if (s === 'target') {
    fixTarget(p, p.weight);
    title = T('What is your desired weight?');
    const diff = r1(p.targetWeight - p.weight);
    ok = p.goal === 'lose' ? diff < 0 : diff > 0;
    body = `<div style="text-align:center"><div class="muted" style="font-weight:600">${planOf(p).ic} ${T(planOf(p).name)}</div>
      <div class="speedv">${p.targetWeight} kg</div><div class="small ${ok ? 'muted' : ''}" style="${ok ? '' : 'color:var(--bad)'}">${ok ? T('{d} kg from now', { d: (diff > 0 ? '+' : '') + diff }) : (p.goal === 'lose' ? T('Must be below your current {w} kg', { w: p.weight }) : T('Must be above your current {w} kg', { w: p.weight }))}</div></div>
      <select id="obT" style="margin-top:22px">${kgOpts(p.targetWeight, 35, 250)}</select>`;
  }
  if (s === 'speed') {
    title = T('How fast do you want to reach your goal?');
    const [mn, df, mx] = paceRange(p);
    if (!(p.pace >= mn && p.pace <= mx)) p.pace = df;
    body = `<div style="text-align:center"><div class="muted" style="font-weight:600">${p.goal === 'lose' ? T('Loss speed per week') : T('Gain speed per week')}</div><div class="speedv" id="obSv">${p.pace} kg</div></div>
      <div class="animals"><span>🦥</span><span>🐇</span><span>🐆</span></div>
      <input type="range" id="obS" min="${mn}" max="${mx}" step="0.05" value="${p.pace}"><div class="spread small muted"><span>${mn} kg</span><span>${df} kg</span><span>${mx} kg</span></div>
      <div class="tip" id="obTip"></div>`;
  }
  if (s === 'ai') {
    title = T('Turn on AI food scanning'); sub = T('Free with a Google account. It takes 1 minute.');
    body = `<div class="tip" style="margin-top:0">${T('1. Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener"><b>aistudio.google.com/apikey</b></a><br>2. Sign in with Google and tap <b>Create API key</b><br>3. Copy it and paste it here')}</div>
      <input id="obK" type="password" autocomplete="off" placeholder="${T('Paste your key (AIza…)')}" value="${esc(getKey())}" style="margin-top:16px">
      <p class="small muted">${T('The key stays only on this phone. You can also add it later in Settings.')}</p>`;
    cta = getKey() ? T('Continue') : T('Save & continue');
  }
  if (s === 'ready') {
    const t = calcTargets(p, p.weight);
    let reach = '';
    if (needsTarget(p)) { const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(p.targetWeight - p.weight) / p.pace * 7));
      reach = `<div class="tip" style="text-align:center;margin:0 0 18px">${p.goal === 'lose' ? T('You should lose:') : T('You should gain:')}<br><b style="font-size:18px">${T('{n} kg by {d}', { n: r1(Math.abs(p.targetWeight - p.weight)), d: fmtLong(d) })}</b></div>`; }
    title = T('Congratulations, your custom plan is ready!');
    sub = `${planOf(p).ic} ${T(planOf(p).name)}`;
    body = `${reach}<b>${T('Daily recommendation')}</b><p class="small muted" style="margin:2px 0 12px">${T('You can edit this any time in Settings.')}</p>
      <div class="plan4">${[['🔥', T('Calories'), t.kcal, '', 'var(--ink)'], ['🌾', T('Carbs'), t.carbs, 'g', 'var(--carbs)'], ['🍗', T('Protein'), t.protein, 'g', 'var(--protein)'], ['🥑', T('Fats'), t.fat, 'g', 'var(--fat)']]
        .map(([ic, l, v, u, c]) => `<div class="card"><span class="small" style="font-weight:600">${ic} ${l}</span>${ring(80, 7, 0.75, c, `<b style="font-size:17px">${v}${u}</b>`)}</div>`).join('')}</div>
      <div class="tip"><b>${T('How to reach your goals')}</b><br>${planTips(p).join('<br>')}</div>`;
    cta = T("Let's get started!");
  }
  const pct = ob.step / (OB.length - 1) * 100;
  pg.innerHTML = `<div class="onb"><div class="onb-top"><button class="onb-back" id="obBack">←</button><div class="prog"><i style="width:${pct}%"></i></div></div>
    <h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : '<div style="height:20px"></div>'}
    <div class="onb-body">${body}</div>
    <button class="btn" id="obNext" ${ok ? '' : 'disabled'} style="margin-top:20px">${cta}</button></div>`;
  pg.scrollTo(0, 0);
  pg.querySelector('#obBack').onclick = () => obMove(-1);
  pg.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => { applyPlan(p, b.dataset.plan, p.weight); renderOb(); });
  pg.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { p[b.dataset.set] = b.dataset.v; if (b.dataset.set === 'goal') { p.pace = paceRange(p)[1]; fixTarget(p, p.weight); } renderOb(); });
  if (pg.querySelector('#fH')) bindFast(pg, p.fast, renderOb);
  const bind = (id, fn) => { const el = pg.querySelector(id); if (el) el.onchange = el.oninput = () => fn(el); };
  bind('#obH', el => p.height = +el.value);
  bind('#obW', el => p.weight = +el.value);
  bind('#obB', el => { p.birth = el.value; pg.querySelector('#obNext').disabled = !p.birth; });
  bind('#obT', el => { p.targetWeight = +el.value; renderOb(); });
  const tip = () => {
    const t = pg.querySelector('#obTip'); if (!t) return;
    t.innerHTML = p.goal === 'lean'
      ? (p.pace <= 0.15 ? '🐢 ' + T('Very slow. Almost no fat gain, but muscle also comes slowly.') : p.pace <= 0.35 ? '✅ ' + T('<b>Recommended.</b> Mostly muscle, very little fat.') : '⚡ ' + T('Upper limit. A bit more fat will come along with the muscle.'))
      : p.plan === 'dirty' ? '🍔 ' + T('Dirty bulk: you gain fast, but a good part of it will be fat.')
      : p.pace <= 0.3 ? '🐢 ' + T('Slow and steady. Very easy to keep up.') : p.pace <= 0.8 ? '✅ ' + T('<b>Recommended.</b> The best balance of speed and comfort.') : '⚡ ' + T('Fast. You may feel very tired. Make sure to eat enough protein.');
  };
  bind('#obS', el => { p.pace = +el.value; pg.querySelector('#obSv').textContent = p.pace + ' kg'; tip(); });
  tip();
  pg.querySelector('#obNext').onclick = () => {
    if (s === 'ai') { const k = pg.querySelector('#obK').value.trim(); if (k) LS.set('ft_key', k); }
    if (s === 'ready') return finishOnboarding();
    obMove(1);
  };
}
function finishOnboarding() {
  const p = ob.p;
  if (p.goal === 'maintain') p.targetWeight = p.weight;
  p.pace = num(p.pace) || 0.5; p.height = num(p.height); p.weight = num(p.weight);
  db.profile = p; db.overrides = {};
  if (!db.weights.length || currentWeight() !== p.weight) { db.weights = db.weights.filter(w => w.date !== iso()); db.weights.push({ date: iso(), kg: p.weight }); }
  LS.set('ft_lang', LANG);
  save(); ob = null; $('#onb')?.remove(); go('home'); toast('🎉 ' + T('Your plan is ready'));
}

/* ================= Utils ================= */
// The page area ends exactly where the tab bar starts (so the scroll line never runs behind it)
function measureTabbar() { const t = $('.tabbar'); if (t && t.offsetHeight) document.documentElement.style.setProperty('--tabh', t.offsetHeight + 'px'); }
window.addEventListener('resize', measureTabbar);
// The iPhone shows its photo/file menu next to the (invisible) file input, so move the input
// to where the menu should appear before opening it
function openPicker(sel, anchor) {
  const input = $(sel);
  if (anchor) { const r = anchor.getBoundingClientRect(); input.style.left = Math.max(0, r.left + 16) + 'px'; input.style.top = Math.max(0, r.top) + 'px'; }
  input.click();
}
function scaleImage(src, max) {
  return new Promise((res, rej) => {
    const img = new Image(), isFile = src instanceof Blob, url = isFile ? URL.createObjectURL(src) : src;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      if (isFile) URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { if (isFile) URL.revokeObjectURL(url); rej(new Error(T('Could not open this image.'))); };
    img.src = url;
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s);
  });
}

/* ================= Start ================= */
applyTheme();
i18nStatic();
measureTabbar();
if (db.profile) save();   // keep any migration changes
go('home');
if (!db.profile) startOnboarding();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => handleOpen(e.data && e.data.open));
}
saveReminderTexts();
setInterval(() => { const c = $('#fastCard'); if (c && tab === 'home') c.outerHTML = fastingHTML(); }, 30000);
const openParam = new URLSearchParams(location.search).get('open');
if (openParam) { history.replaceState(null, '', location.pathname); handleOpen(openParam); }
</script>
</body>
