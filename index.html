<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FoodTracker</title>
<meta name="theme-color" content="#f7f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FoodTracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f7f7f9;--card:#fff;--text:#111113;--muted:#8e8e93;--line:#ececf0;--track:#efeff3;
  --ink:#111113;--on-ink:#fff;--chip:#f2f2f5;
  --protein:#e3605b;--carbs:#ef9f45;--fat:#4b8cf5;--flame:#ff9500;--good:#34c759;--bad:#ff3b30;
  --shadow:0 2px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#2c2c2e;--track:#2c2c2e;
    --ink:#f5f5f7;--on-ink:#000;--chip:#2c2c2e;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);width:100%;padding:14px 16px;border-radius:14px;
  border:0;background:var(--chip);outline:none}
textarea{resize:none;min-height:96px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:22px 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:var(--on-ink);
  border-radius:999px;padding:17px;font-weight:600;font-size:17px}
.btn:disabled{opacity:.3}
.btn.outline{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{width:auto;padding:10px 18px;font-size:15px}
.chipbtn{background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}

/* Rings */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}

/* Header + week */
.top{padding:calc(8px + env(safe-area-inset-top)) 0 4px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand img{width:30px;height:30px;border-radius:8px}
.streak{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;box-shadow:var(--shadow)}
.week{display:flex;align-items:center;margin:12px -6px 14px}
.week .nav{width:22px;color:var(--muted);font-size:20px}
.days{flex:1;display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 5px;border-radius:16px;min-width:42px}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.future{opacity:.35;pointer-events:none}
.day .dl{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  border:2px dashed var(--line)}
.day .dn.logged{border:2px solid var(--text)}
.day .dn.over{border:2px solid var(--bad)}

/* Home cards */
.calcard{display:flex;justify-content:space-between;align-items:center;padding:24px 22px}
.bignum{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.bignum small{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.mcard{background:var(--card);border-radius:20px;padding:16px 12px 14px;box-shadow:var(--shadow);text-align:left}
.mcard .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.mcard .v small{font-size:13px;color:var(--muted);font-weight:600}
.mcard .l{font-size:12.5px;color:var(--muted);margin:2px 0 12px;font-weight:500}
.mcard .ring{margin:0 auto}
.burned{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}

/* Entries */
.entry{display:flex;gap:12px;background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:92px;height:92px;border-radius:14px;flex:none;background:var(--chip);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.einfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-right:4px}
.ename{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etime{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 8px;border-radius:999px;flex:none}
.ecal{font-weight:700;font-size:15px}
.emac{display:flex;gap:12px;font-size:13px;color:var(--muted);font-weight:500}
.skel{height:10px;border-radius:6px;background:var(--chip);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.empty{text-align:center;padding:30px 20px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.empty b{display:block;font-size:17px;margin-bottom:6px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:8px 18px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--text)}
.fab{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);margin:-26px 0 0 18px;flex:none}
.fab svg{width:28px;height:28px}

/* Sheets & pages */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.addtile{background:var(--chip);border-radius:20px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.addtile span{font-size:30px}

/* Detail */
.hero{height:330px;background:var(--chip);position:relative;display:flex;align-items:center;justify-content:center;font-size:90px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero.short{height:calc(130px + env(safe-area-inset-top))}
.herobar{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px;display:flex;justify-content:space-between}
.circ{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dbody{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-30px;position:relative;padding:22px 18px calc(110px + env(safe-area-inset-bottom))}
.tinput{font-size:24px;font-weight:800;letter-spacing:-.02em;background:none;padding:4px 0;border-radius:0}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;font-size:20px;font-weight:600}
.stepper b{min-width:28px;text-align:center}
.bigcal{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left}
.bigcal .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px}
.dmac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dm{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left}
.dm .t{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;gap:4px;align-items:center}
.dm b{font-size:19px;display:block;margin-top:4px}
.hbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:10px}
.hbar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.ing{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.ing-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;width:100%;text-align:left}
.ing-edit{padding:0 16px 16px}
.ing-edit .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ing-edit .g4 input{padding:11px 4px;text-align:center}
.ing-edit .g4 .lbl{text-align:center;margin:8px 0 4px;font-size:11px}
.dfoot{position:fixed;left:0;right:0;bottom:0;z-index:31;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.dfoot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}

/* Onboarding */
.onb{display:flex;flex-direction:column;min-height:100%;padding:calc(10px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.onb-top{display:flex;align-items:center;gap:14px;height:44px}
.onb-back{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:18px;flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.onb h1{font-size:31px;line-height:1.12;letter-spacing:-.03em;margin:26px 0 8px}
.onb .sub{color:var(--muted);margin:0 0 28px}
.onb-body{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--chip);border-radius:18px;padding:19px 20px;font-weight:600;font-size:17px;margin-bottom:12px;transition:.15s}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.opt.on{background:var(--ink);color:var(--on-ink)}
.opt.on small{color:inherit;opacity:.7}
.speedv{text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em;margin:10px 0}
.animals{display:flex;justify-content:space-between;font-size:30px;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:16px 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--ink);margin-top:-11px;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tip{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:14px;margin-top:16px}
.plan4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan4 .card{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px}

/* Progress */
.pills{display:flex;gap:6px;background:var(--chip);border-radius:999px;padding:4px}
.pills button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.pills button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.two .card{margin:0}
.wdots{display:flex;justify-content:space-between;margin-top:12px}
.wdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.wdots i{width:14px;height:14px;border-radius:50%;background:var(--track)}
.wdots i.on{background:var(--flame)}
.bmi-bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#5aa9f2 0%,#5aa9f2 14%,#34c759 14%,#34c759 40%,#f5b83d 40%,#f5b83d 60%,#ff5a4f 60%);position:relative;margin:18px 0 10px}
.bmi-bar b{position:absolute;top:-6px;width:4px;height:22px;border-radius:2px;background:var(--text);transform:translateX(-50%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.nbars{display:flex;align-items:flex-end;gap:10px;height:150px;position:relative;margin-top:14px}
.nbars .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.nbars .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;background:var(--track);min-height:4px}
.nbars .col span{font-size:11px;color:var(--muted);font-weight:600}
.nbars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.chart{width:100%;height:auto;display:block}

/* Settings */
.list{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;text-align:left;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{font-size:20px;width:26px;text-align:center}
.li .chev{color:var(--muted)}
.switch{width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--good)}
.switch.on::after{left:22px}
.stats3{display:flex;justify-content:space-around;text-align:center}
.stats3 b{display:block;font-size:20px}

/* Chat */
body.chatting{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.chatting .fab{display:none}
.msgs{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.msg{max-width:86%;padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.45;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.err{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
.msg img{display:block;max-width:180px;border-radius:12px;margin-bottom:6px}
.msg ul,.msg ol{margin:4px 0;padding-left:20px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:pulse 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.chatbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:19;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 14px}
.chatbar .in{max-width:560px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:500}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:24px;padding:5px;box-shadow:inset 0 0 0 1.5px var(--line)}
.composer textarea{min-height:0;height:40px;max-height:120px;overflow-y:hidden;background:none;padding:10px 6px;border-radius:0}
.composer .cbtn{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
.composer .send{background:var(--ink);color:var(--on-ink)}
.attach{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.attach img{width:44px;height:44px;border-radius:10px;object-fit:cover}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--ink);color:var(--on-ink);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hiddenfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="wrap" id="view"></div>

<nav class="tabbar"><div class="in">
  <button class="tab on" data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.8 11h2.7v9h5v-6h3v6h5v-9h2.7z"/></svg>Home</button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Progress</button>
  <button class="tab" data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.6" stroke-linecap="round"/></svg>Coach</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  <button class="fab" id="fab" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div></nav>

<input type="file" accept="image/*" capture="environment" id="fileCam" class="hiddenfile">
<input type="file" accept="image/*" id="fileLib" class="hiddenfile">
<input type="file" accept="image/*" capture="environment" id="fileBar" class="hiddenfile">
<input type="file" accept="application/json,.json" id="fileImport" class="hiddenfile">
<input type="file" accept="image/*" id="fileChat" class="hiddenfile">
<div id="qr-hidden" style="display:none"></div>
<div id="toast"></div>

<script>
/* ================= Storage ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const EMPTY = () => ({ profile: null, overrides: {}, meals: [], weights: [], exercises: [], settings: { addBurned: false } });
let db;
try { db = JSON.parse(LS.get('ft_data', '{}')) || {}; } catch { db = {}; }
db = migrate(Object.assign(EMPTY(), db));
function migrate(d) {
  d.settings = Object.assign({ addBurned: false }, d.settings);
  d.exercises = d.exercises || [];
  d.meals.forEach(m => { if (!m.servings) m.servings = 1; });
  const p = d.profile;
  if (p && !p.birth) {
    p.birth = `${new Date().getFullYear() - (p.age || 30)}-06-15`;
    p.workouts = p.activity >= 1.7 ? '6+' : p.activity >= 1.5 ? '3-5' : '0-2';
  }
  return d;
}
function save() { if (!LS.set('ft_data', JSON.stringify(db))) toast('Could not save – storage full?'); }
const getKey = () => LS.get('ft_key', '');
const getModel = () => LS.get('ft_model', '') || 'gemini-2.5-flash';

// Food photos live in IndexedDB (more space than localStorage)
const idb = (() => {
  let conn;
  const open = () => conn || (conn = new Promise((res, rej) => {
    const r = indexedDB.open('foodtracker', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('photos', mode), req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => run('readonly', s => s.get(k)).catch(() => null),
    set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => {}),
    del: k => run('readwrite', s => s.delete(k)).catch(() => {}),
    clear: () => run('readwrite', s => s.clear()).catch(() => {})
  };
})();
const photoCache = {};
async function hydratePhotos(root = document) {
  for (const img of root.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo;
    if (!(id in photoCache)) photoCache[id] = await idb.get(id);
    if (photoCache[id]) img.src = photoCache[id];
    else img.replaceWith(Object.assign(document.createElement('span'), { textContent: '🍽️' }));
  }
}

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const LOC = 'en-GB';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(n), r1 = n => Math.round(n * 10) / 10;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const dt = s => new Date(s + 'T12:00');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowTime = () => new Date().toTimeString().slice(0, 5);
const fmtDate = (s, o = { day: 'numeric', month: 'short' }) => dt(s).toLocaleDateString(LOC, o);
const clone = o => JSON.parse(JSON.stringify(o));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

function ring(size, stroke, pct, color, inner = '') {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - clamp(pct || 0, 0, 1))}"/></svg><div class="ring-in">${inner}</div></div>`;
}
const MAC = [
  { k: 'protein', label: 'Protein', ic: '🍗', c: 'var(--protein)' },
  { k: 'carbs', label: 'Carbs', ic: '🌾', c: 'var(--carbs)' },
  { k: 'fat', label: 'Fats', ic: '🥑', c: 'var(--fat)' }
];

/* ================= Calculations ================= */
const ACT = { '0-2': 1.375, '3-5': 1.55, '6+': 1.725 };
function age(p) { const b = new Date(p.birth), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a || 30; }
function currentWeight() {
  if (db.weights.length) return [...db.weights].sort((a, b) => a.date.localeCompare(b.date)).at(-1).kg;
  return db.profile ? db.profile.weight : 0;
}
function calcTargets(p, w) {
  const bmr = 10 * w + 6.25 * p.height - 5 * age(p) + (p.sex === 'm' ? 5 : p.sex === 'f' ? -161 : -78);
  const tdee = bmr * (ACT[p.workouts] || 1.375);
  let kcal = tdee;
  if (p.goal === 'lose') kcal -= p.pace * 7700 / 7;
  if (p.goal === 'gain') kcal += p.pace * 7700 / 7;
  kcal = Math.max(kcal, p.sex === 'm' ? 1500 : 1200);
  const protein = w * (p.goal === 'lose' ? 2.0 : p.goal === 'gain' ? 1.8 : 1.6);
  const fat = kcal * 0.27 / 9;
  const carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  return { kcal: r0(kcal), protein: r0(protein), carbs: r0(carbs), fat: r0(fat), tdee: r0(tdee) };
}
function targets() {
  if (!db.profile) return { kcal: 2000, protein: 150, carbs: 200, fat: 60, auto: {} };
  const t = calcTargets(db.profile, currentWeight());
  t.auto = { ...t };
  for (const k of ['kcal', 'protein', 'carbs', 'fat']) if (num(db.overrides[k]) > 0) t[k] = r0(num(db.overrides[k]));
  return t;
}
function mealTotals(m) {
  const s = m.servings || 1, t = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  for (const it of m.items) for (const k in t) t[k] += num(it[k]) * s;
  return t;
}
function dayTotals(date) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0, count: 0 };
  for (const m of db.meals) if (m.date === date) { t.count++; const mt = mealTotals(m); for (const k in mt) t[k] += mt[k]; }
  return t;
}
const dayBurned = date => db.exercises.filter(e => e.date === date).reduce((a, e) => a + num(e.kcal), 0);
function streak() {
  const has = new Set(db.meals.map(m => m.date));
  let d = iso(), n = 0;
  if (!has.has(d)) d = addDays(d, -1);
  while (has.has(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ================= Navigation ================= */
let tab = 'home', sel = iso(), weekOff = 0, calMode = 'left', pending = [];
let progRange = 90, nutWeek = 0;
function go(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.body.classList.toggle('chatting', t === 'chat');
  $('.chatbar')?.remove();
  window.scrollTo(0, 0);
  render();
}
function render() { ({ home: renderHome, progress: renderProgress, chat: renderChat, settings: renderSettings })[tab](); }
document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#fab').onclick = openAddMenu;

/* ================= Home ================= */
function renderHome() {
  const t = targets(), tot = dayTotals(sel), burned = dayBurned(sel);
  const goalK = t.kcal + (db.settings.addBurned ? burned : 0);
  const today = iso(), st = streak();
  // Week strip (Mon–Sun)
  const dow = (new Date().getDay() + 6) % 7, mon = addDays(today, -dow + weekOff * 7);
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const week = days.map(d => {
    const dtot = dayTotals(d), cls = dtot.count ? (dtot.kcal > t.kcal * 1.1 ? 'over' : 'logged') : '';
    return `<button class="day ${d === sel ? 'sel' : ''} ${d > today ? 'future' : ''}" data-d="${d}">
      <span class="dl">${dt(d).toLocaleDateString(LOC, { weekday: 'short' }).slice(0, 3)}</span><span class="dn ${cls}">${dt(d).getDate()}</span></button>`;
  }).join('');
  const left = goalK - tot.kcal;
  const calBig = calMode === 'left'
    ? `<div class="bignum">${Math.abs(r0(left))}</div><div class="muted" style="margin-top:6px;font-weight:500">Calories ${left < 0 ? 'over' : 'left'}</div>`
    : `<div class="bignum">${r0(tot.kcal)}<small> /${goalK}</small></div><div class="muted" style="margin-top:6px;font-weight:500">Calories eaten</div>`;
  const macros = MAC.map(m => {
    const v = tot[m.k], g = t[m.k], l = g - v;
    const top = calMode === 'left' ? `${Math.abs(r0(l))}g` : `${r0(v)}<small> /${g}g</small>`;
    const lab = calMode === 'left' ? `${m.label} ${l < 0 ? 'over' : 'left'}` : `${m.label} eaten`;
    return `<button class="mcard" data-toggle><div class="v">${top}</div><div class="l">${lab}</div>${ring(62, 6, v / g, m.c, `<span style="font-size:20px">${m.ic}</span>`)}</button>`;
  }).join('');

  // Entries for selected day
  const entries = [
    ...pending.filter(p => p.date === sel).map(p => ({ kind: 'pending', time: p.time, p })),
    ...db.meals.filter(m => m.date === sel).map(m => ({ kind: 'meal', time: m.time, m })),
    ...db.exercises.filter(e => e.date === sel).map(e => ({ kind: 'ex', time: e.time, e }))
  ].sort((a, b) => (b.kind === 'pending') - (a.kind === 'pending') || (b.time || '').localeCompare(a.time || ''));

  let list = entries.map(en => {
    if (en.kind === 'pending') {
      const p = en.p;
      return `<div class="entry"><div class="thumb">${p.preview ? `<img src="${p.preview}" alt="">` : '💬'}
        ${p.status === 'analyzing' ? `<div class="ov" data-pct="${p.id}">${r0(p.pct)}%</div>` : ''}</div>
        <div class="einfo">${p.status === 'analyzing'
          ? `<div class="ename">Analyzing food…</div><div class="skel" style="width:80%"></div><div class="skel" style="width:55%"></div><div class="small muted">We'll notify you when done</div>`
          : `<div class="ename" style="color:var(--bad)">Couldn't analyze</div><div class="small muted">${esc(p.error)}</div>
             <div class="row"><button class="chipbtn" onclick="retryPending('${p.id}')">Try again</button><button class="chipbtn" onclick="removePending('${p.id}')">Remove</button></div>`}
        </div></div>`;
    }
    if (en.kind === 'ex') {
      const e = en.e;
      return `<button class="entry" onclick="openExercise('${e.id}')"><div class="thumb">🏋️</div><div class="einfo">
        <div class="spread"><span class="ename">${esc(e.name)}</span><span class="etime">${esc(e.time || '')}</span></div>
        <div class="ecal">🔥 ${r0(e.kcal)} calories burned</div>${e.minutes ? `<div class="emac"><span>⏱ ${e.minutes} min</span></div>` : ''}</div></button>`;
    }
    const m = en.m, mt = mealTotals(m);
    return `<button class="entry" onclick="openMeal('${m.id}')"><div class="thumb">${m.photo ? `<img data-photo="${m.id}" alt="">` : (m.source === 'barcode' ? '🏷️' : '🍽️')}</div>
      <div class="einfo"><div class="spread"><span class="ename">${esc(m.name)}</span><span class="etime">${esc(m.time || '')}</span></div>
      <div class="ecal">🔥 ${r0(mt.kcal)} calories</div>
      <div class="emac"><span>🍗 ${r0(mt.protein)}g</span><span>🌾 ${r0(mt.carbs)}g</span><span>🥑 ${r0(mt.fat)}g</span></div></div></button>`;
  }).join('');
  if (!entries.length) list = `<div class="empty"><b>You haven't uploaded any food</b><span class="muted">Start tracking ${sel === today ? "today's" : 'this day\'s'} meals by taking a quick picture</span>
    <div style="margin-top:16px"><button class="btn sm" style="margin:0 auto" onclick="openAddMenu()">＋ Add food</button></div></div>`;

  $('#view').innerHTML = `
    <div class="top"><div class="brand"><img src="icon-180.png" alt="">FoodTracker</div><div class="streak">🔥 ${st}</div></div>
    <div class="week"><button class="nav" id="wPrev">‹</button><div class="days">${week}</div><button class="nav" id="wNext" ${weekOff >= 0 ? 'style="visibility:hidden"' : ''}>›</button></div>
    ${!hasAI() ? `<button class="card" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center" onclick="go('settings')"><span style="font-size:26px">✨</span><span class="grow"><b>Turn on AI food scanning</b><br><span class="small muted">Add your free Google AI key in Settings</span></span><span class="muted">›</span></button>` : ''}
    <button class="card calcard" data-toggle style="width:100%;text-align:left"><div>${calBig}</div>${ring(104, 9, tot.kcal / goalK, left < 0 ? 'var(--bad)' : 'var(--ink)', '<span style="font-size:28px">🔥</span>')}</button>
    <div class="macros">${macros}</div>
    ${burned ? `<div class="burned">🏋️ ${r0(burned)} kcal burned${db.settings.addBurned ? ' · added to your goal' : ''}</div>` : ''}
    <div class="h2">${sel === today ? 'Recently uploaded' : fmtDate(sel, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    ${list}`;
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { sel = b.dataset.d; renderHome(); });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { calMode = calMode === 'left' ? 'eaten' : 'left'; renderHome(); });
  $('#wPrev').onclick = () => { weekOff--; renderHome(); };
  $('#wNext').onclick = () => { if (weekOff < 0) { weekOff++; renderHome(); } };
  hydratePhotos($('#view'));
}

/* ================= Sheets ================= */
function sheet(html, mount) {
  closeSheet();
  const b = document.createElement('div');
  b.className = 'backdrop';
  b.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  b.onclick = e => { if (e.target === b) closeSheet(); };
  document.body.appendChild(b);
  if (mount) mount(b.querySelector('.sheet'));
}
function closeSheet() { document.querySelectorAll('.backdrop').forEach(x => x.remove()); }

function openAddMenu() {
  sheet(`<h3>Add</h3><div class="addgrid">
    <button class="addtile" id="aScan"><span>📷</span>Scan food</button>
    <button class="addtile" id="aBar"><span>🏷️</span>Barcode</button>
    <button class="addtile" id="aLib"><span>🖼️</span>Upload photo</button>

    s.querySelector('#aText').onclick = openDescribeSheet;

    s.querySelector('#aMan').onclick = () => {
      closeSheet();
      openNewMeal({ id: uid(), date: sel, time: nowTime(), name: '', items: [{ name: '', grams: 100, kcal: 0, protein: 0, carbs: 0, fat: 0 }], servings: 1, health: null, source: 'manual', photo: false }, 0);
    };
  });
}

function numberSheet(title, value, unit, cb, step = 1) {
  sheet(`<h3>${esc(title)}</h3><div class="row" style="margin:18px 0">
    <button class="onb-back" id="nMinus">−</button>
    <input id="nVal" inputmode="decimal" value="${value}" style="text-align:center;font-size:30px;font-weight:800">
    <button class="onb-back" id="nPlus">＋</button><span class="muted">${esc(unit)}</span></div>
    <button class="btn" id="nSave">Save</button>`, s => {
    const inp = s.querySelector('#nVal');
    const bump = d => inp.value = r1(Math.max(0, num(inp.value) + d));
    s.querySelector('#nMinus').onclick = () => bump(-step);
    s.querySelector('#nPlus').onclick = () => bump(step);
    s.querySelector('#nSave').onclick = () => { closeSheet(); cb(num(inp.value)); };
    inp.focus(); inp.select();
  });
}

/* ================= AI analysis ================= */
const FOOD_PROMPT = `You are an expert nutritionist powering a calorie tracking app.
Identify every food and drink in the meal. Estimate each portion in grams using visual cues (plate size, cutlery, hands, packaging). Include cooking oils, sauces and dressings.
Return ONLY JSON in this exact shape:
{"name": "short appetising meal name", "items": [{"name": "ingredient", "grams": 0, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}], "health_score": 7, "notes": "short"}
Numbers are for the whole portion (not per 100 g); macros in grams. health_score is an integer 1-10 (10 = very healthy: whole foods, high protein and fibre, low sugar). If there is no food, return "items": [] and explain in notes.`;

/* --- AI engine ---
   Parts format: [{ text }, { image: base64jpeg }]. Tries every free Google model in turn (each has its
   own daily limit), skipping ones that are rate-limited, then Claude if a Claude key is set. */
const getClaudeKey = () => LS.get('ft_claude_key', '');
const hasAI = () => !!(getKey() || getClaudeKey());
let lastAI = '';
const GEMINI = [
  { id: 'gemini-3.5-flash-lite' },                                   // fastest, minimal thinking by default
  { id: 'gemini-3.1-flash-lite' },
  { id: 'gemini-3.6-flash', think: { thinkingLevel: 'minimal' } },
  { id: 'gemini-3.8-flash', think: { thinkingLevel: 'low' } },
  { id: 'gemini-flash-latest' },
  { id: 'gemini-2.5-flash-lite' },
  { id: 'gemini-2.5-flash', think: { thinkingBudget: 0 } }
];
const aiErr = (msg, fatal) => Object.assign(new Error(msg), { fatal });
function parseJSON(text) {
  const t = String(text || '').replace(/```(json)?/g, '').trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) try { return JSON.parse(t.slice(a, b + 1)); } catch {}
  throw aiErr('The AI gave an unreadable answer. Please try again.');
}
function untilQuotaReset() { const d = new Date(); d.setUTCHours(8, 5, 0, 0); if (d <= new Date()) d.setUTCDate(d.getUTCDate() + 1); return d - new Date(); }
// Merge consecutive same-role messages so the conversation alternates user/assistant
function normMsgs(msgs) {
  const out = [];
  for (const m of msgs) { const prev = out.at(-1); if (prev && prev.role === m.role) prev.parts = prev.parts.concat(m.parts); else out.push({ role: m.role, parts: [...m.parts] }); }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}
async function askAI(parts, opt = {}) {
  const json = opt.json !== false;
  const msgs = normMsgs([...(opt.history || []), { role: 'user', parts }]);
  const g = getKey(), c = getClaudeKey();
  if (!g && !c) throw new Error('NOKEY');
  const prov = [];
  if (g) prov.push(() => geminiChain(g, msgs, opt.system, json));
  if (c) prov.push(() => claudeCall(c, msgs, opt.system, json));
  if (LS.get('ft_ai_first', 'gemini') === 'claude') prov.reverse();
  let err;
  for (const run of prov) {
    try { const text = await run(); return json ? parseJSON(text) : text; }
    catch (e) { err = e; }
  }
  throw err;
}
async function geminiOnce(key, model, msgs, system, json) {
  const def = GEMINI.find(m => m.id === model) || {};
  const noThink = JSON.parse(LS.get('ft_nothink', '[]'));
  const think = def.think && !noThink.includes(model) ? def.think : null;
  const body = {
    contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user',
      parts: m.parts.map(p => p.image ? { inlineData: { mimeType: 'image/jpeg', data: p.image } } : { text: p.text }) })),
    generationConfig: { temperature: json ? 0.2 : 0.7, ...(json ? { responseMimeType: 'application/json' } : {}), ...(think ? { thinkingConfig: think } : {}) }
  };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body) });
  } catch (e) { return { ok: false, status: e.name === 'AbortError' ? 504 : 0, msg: e.name === 'AbortError' ? 'took too long' : 'no connection' }; }
  finally { clearTimeout(timer); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || 'HTTP ' + res.status;
    if (think && res.status === 400 && /think/i.test(msg)) { noThink.push(model); LS.set('ft_nothink', JSON.stringify(noThink)); return geminiOnce(key, model, msgs, system, json); }
    return { ok: false, status: res.status, msg };
  }
  const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  return text ? { ok: true, text } : { ok: false, status: 500, msg: 'empty answer (' + (data.candidates?.[0]?.finishReason || data.promptFeedback?.blockReason || 'unknown') + ')' };
}
async function geminiChain(key, msgs, system, json) {
  const cool = JSON.parse(LS.get('ft_cool', '{}')), now = Date.now();
  let list = GEMINI.map(m => m.id);
  const custom = LS.get('ft_model', ''), last = LS.get('ft_lastModel', '');
  if (last && list.includes(last)) list = [last, ...list.filter(x => x !== last)];
  if (custom) list = [custom, ...list.filter(x => x !== custom)];
  const ready = list.filter(m => !(cool[m] > now));
  let err = aiErr('All free Google AI models are busy right now. Try again in a minute' + (getClaudeKey() ? '.' : ', or add a Claude key in Settings.'));
  let offline = 0;
  for (const model of (ready.length ? ready : list)) {
    const r = await geminiOnce(key, model, msgs, system, json);
    if (r.ok) { LS.set('ft_lastModel', model); lastAI = model; return r.text; }
    if (r.status === 0 && ++offline >= 2) throw aiErr('No connection to the AI. Check your internet.');
    if (/api[_ ]?key|API_KEY_INVALID|unauthenticated/i.test(r.msg) || r.status === 401) throw aiErr('Your Google AI key was rejected. Check it in Settings.', true);
    let wait = 0;
    if (r.status === 429) wait = /day|PerDay/i.test(r.msg) ? untilQuotaReset() : 60e3;
    else if (r.status === 404 || r.status === 403 || (r.status === 400 && /not (found|supported|available)|no longer|deprecat|access/i.test(r.msg))) wait = 7 * 864e5;
    else if (r.status >= 500) wait = 20e3;
    else err = aiErr('Google AI error: ' + r.msg);
    if (wait) { cool[model] = Date.now() + wait; LS.set('ft_cool', JSON.stringify(cool)); }
  }
  throw err;
}
async function claudeCall(key, msgs, system, json) {
  const model = LS.get('ft_claude_model', '') || 'claude-opus-5-5', isOpus = model === 'claude-opus-5-5';
  const jsonRule = 'Respond with only the JSON object, no other text.';
  const body = {
    model, max_tokens: 8000, output_config: { effort: 'low' },
    messages: msgs.map(m => ({ role: m.role, content: m.parts.map(p => p.image
      ? { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.image } } : { type: 'text', text: p.text }) }))
  };
  if (system || json) body.system = [system, json ? jsonRule : ''].filter(Boolean).join('\n\n');
  if (isOpus) body.fallbacks = 'default';   // re-runs a declined request on Anthropic's recommended fallback model
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', body: JSON.stringify(body), headers: {
      'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
      ...(isOpus ? { 'anthropic-beta': 'server-side-fallback-2026-07-01' } : {}) } });
  } catch { throw aiErr('No connection to Claude. Check your internet.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || 'HTTP ' + res.status;
    if (res.status === 401 || res.status === 403) throw aiErr('Your Claude key was rejected. Check it in Settings.');
    if (/credit balance/i.test(msg)) throw aiErr('Your Claude account has no credit left. Add credit at console.anthropic.com.');
    if (res.status === 429 || res.status === 529) throw aiErr('Claude is busy right now. Try again in a moment.');
    throw aiErr('Claude error: ' + msg);
  }
  if (data.stop_reason === 'refusal') throw aiErr('Claude declined this request.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if (!text) throw aiErr('Claude gave an empty answer. Please try again.');
  lastAI = 'Claude'; return text;
}
const normItems = items => (items || []).map(it => ({
  name: String(it.name || 'Food'), grams: r0(num(it.grams)), kcal: r0(num(it.kcal)),
  protein: r1(num(it.protein)), carbs: r1(num(it.carbs)), fat: r1(num(it.fat))
}));
const healthOf = v => { const n = r0(num(v)); return n >= 1 && n <= 10 ? n : null; };

function addPending(preview, parts) {
  const p = { id: uid(), date: sel, time: nowTime(), preview, parts, pct: 2, status: 'analyzing' };
  pending.unshift(p);
  if (tab !== 'home') go('home'); else renderHome();
  runAnalysis(p);
}
async function runAnalysis(p) {
  p.status = 'analyzing'; p.pct = 2;
  clearInterval(p.timer);
  p.timer = setInterval(() => {
    p.pct += (95 - p.pct) * 0.045;
    const el = document.querySelector(`[data-pct="${p.id}"]`); if (el) el.textContent = r0(p.pct) + '%';
  }, 200);
  if (tab === 'home') renderHome();
  try {
    const res = await askAI(p.parts);
    const items = normItems(res.items);
    if (!items.length) throw new Error(res.notes || 'No food recognised. Try a clearer photo.');
    const m = { id: p.id, date: p.date, time: p.time, name: res.name || items.map(i => i.name).join(', '), items, servings: 1,
      health: healthOf(res.health_score), source: p.preview ? 'photo' : 'text', photo: !!p.preview };
    if (p.preview) { await idb.set(m.id, p.preview); photoCache[m.id] = p.preview; }
    db.meals.push(m); save();
    clearInterval(p.timer); pending = pending.filter(x => x !== p);
    toast('✓ ' + m.name + ' logged');
  } catch (e) {
    clearInterval(p.timer); p.status = 'error';
    p.error = e.message === 'NOKEY' ? 'Add your free AI key in Settings first.' : e.message;
  }
  if (tab === 'home') renderHome();
}
function retryPending(id) { const p = pending.find(x => x.id === id); if (p) runAnalysis(p); }
function removePending(id) { pending = pending.filter(x => x.id !== id); renderHome(); }

const bMsg = (t, err) => { const el = $('#bMsg'); if (el) { el.innerHTML = t; el.style.color = err ? 'var(--bad)' : ''; } };
$('#fileBar').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  bMsg('<span class="spin"></span> Reading barcode…');
  try {
    await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    const sc = new Html5Qrcode('qr-hidden');
    let code; try { code = await sc.scanFile(f, false); } finally { try { sc.clear(); } catch {} }
    code = String(code).replace(/\D/g, '');
    if ($('#bCode')) $('#bCode').value = code;
    lookupBarcode(code);
  } catch { bMsg("Couldn't read the barcode. Try closer and sharper, or type the number.", true); }
};
async function lookupBarcode(code) {
  bMsg('<span class="spin"></span> Looking up product…');
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity,nutriscore_grade`);
    const d = await r.json();
    if (d.status !== 1 || !d.product) return bMsg(`Product ${esc(code)} not found. Try a photo instead.`, true);
    const p = d.product, n = p.nutriments || {};
    const kcal100 = num(n['energy-kcal_100g']) || num(n['energy_100g']) / 4.184;
    const g = num(p.serving_quantity) || 100, f = g / 100;
    const brand = p.brands ? p.brands.split(',')[0].trim() : '';
    const name = (p.product_name || 'Product ' + code) + (brand && !(p.product_name || '').toLowerCase().includes(brand.toLowerCase()) ? ' – ' + brand : '');
    const ns = { a: 9, b: 7, c: 5, d: 3, e: 2 }[p.nutriscore_grade] || null;
    closeSheet();
    openNewMeal({ id: uid(), date: sel, time: nowTime(), name, servings: 1, health: ns, source: 'barcode', photo: false,
      items: [{ name, grams: r0(g), kcal: r0(kcal100 * f), protein: r1(num(n.proteins_100g) * f), carbs: r1(num(n.carbohydrates_100g) * f), fat: r1(num(n.fat_100g) * f) }] });
  } catch { bMsg('No internet connection?', true); }
}

let det = null;
function setBase(it) { it.base = { grams: num(it.grams), kcal: num(it.kcal), protein: num(it.protein), carbs: num(it.carbs), fat: num(it.fat) }; return it; }
function openMeal(id) { const m = db.meals.find(x => x.id === id); if (m) { det = { m: clone(m), isNew: false, open: -1 }; det.m.items.forEach(setBase); renderDetail(); } }
function openNewMeal(m, openIdx = -1) { det = { m, isNew: true, open: openIdx }; m.items.forEach(setBase); renderDetail(); }
function renderDetail() {
  const m = det.m;
  let pg = $('#detail');
  if (!pg) { pg = document.createElement('div'); pg.id = 'detail'; pg.className = 'page'; document.body.appendChild(pg); document.body.style.overflow = 'hidden'; }

    <div class="hero ${m.photo ? '' : 'short'}">${m.photo ? `<img data-photo="${m.id}" alt="">` : ''}
      <div class="herobar"><button class="circ" id="dBack">‹</button>${det.isNew ? '' : '<button class="circ" id="dDel">🗑</button>'}</div></div>
    <div class="dbody">
      <div class="spread"><span class="etime">${esc(fmtDate(m.date, { weekday: 'short', day: 'numeric', month: 'short' }))} · ${esc(m.time || '')}</span></div>
      <div class="spread" style="margin:8px 0 14px"><input class="tinput grow" id="dName" value="${esc(m.name)}" placeholder="Meal name">
        <div class="stepper"><button id="sMinus">−</button><b id="sVal">${m.servings}</b><button id="sPlus">+</button></div></div>

  pg.querySelector('#sMinus').onclick = () => stepS(-0.5);
  pg.querySelector('#sPlus').onclick = () => stepS(0.5);
  pg.querySelector('#iAdd').onclick = () => { m.items.push(setBase({ name: '', grams: 100, kcal: 0, protein: 0, carbs: 0, fat: 0 })); det.open = m.items.length - 1; renderIngredients(); renderDetTotals(); };
  pg.querySelector('#dFix').onclick = openFixSheet;
  pg.querySelector('#dDone').onclick = () => closeDetail(true);
  hydratePhotos(pg);
}
function renderDetTotals() {
  const m = det.m, t = mealTotals(m);
  $('#dTot').innerHTML = `
    <button class="card bigcal" data-edit="kcal"><div class="ic">🔥</div><div><div class="small muted">Calories</div><div style="font-size:30px;font-weight:800;letter-spacing:-.03em">${r0(t.kcal)}</div></div></button>
    <div class="dmac">${MAC.map(x => `<button class="dm" data-edit="${x.k}"><div class="t">${x.ic} ${x.label}</div><b>${r0(t[x.k])}g</b></button>`).join('')}</div>
    ${m.health ? `<div class="card" style="margin-top:14px"><div class="spread"><span style="font-weight:600">💚 Health score</span><b>${m.health}/10</b></div>
      <div class="hbar"><i style="width:${m.health * 10}%;background:${m.health >= 7 ? 'var(--good)' : m.health >= 4 ? 'var(--carbs)' : 'var(--bad)'}"></i></div></div>` : ''}`;
  $('#dTot').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const f = b.dataset.edit, label = f === 'kcal' ? 'Calories' : MAC.find(x => x.k === f).label + ' (g)';
    numberSheet(label, r0(mealTotals(det.m)[f]), f === 'kcal' ? 'kcal' : 'g', v => setTotal(f, v), f === 'kcal' ? 10 : 1);
  });
}
function setTotal(f, v) {
  const m = det.m, cur = mealTotals(m)[f];
  if (!m.items.length) m.items.push({ name: m.name || 'Food', grams: 100, kcal: 0, protein: 0, carbs: 0, fat: 0 });
  if (cur > 0) { const k = v / cur; m.items.forEach(it => it[f] = f === 'kcal' ? r0(it[f] * k) : r1(it[f] * k)); }
  else m.items[0][f] = f === 'kcal' ? r0(v / m.servings) : r1(v / m.servings);
  m.items.forEach(setBase); renderDetTotals(); renderIngredients();
}
function renderIngredients() {
  const box = $('#dIng'), m = det.m;
  box.innerHTML = m.items.map((it, i) => `<div class="ing" data-i="${i}">
    <button class="ing-head"><span><b data-h="name">${esc(it.name || 'New ingredient')}</b><br><span class="small muted" data-h="grams">${it.grams} g</span></span>
      <span style="font-weight:600"><span data-h="kcal">${r0(it.kcal)}</span> cal <span class="muted">${det.open === i ? '⌃' : '›'}</span></span></button>
    ${det.open === i ? `<div class="ing-edit">
      <div class="row"><input data-f="name" value="${esc(it.name)}" placeholder="Ingredient" class="grow"><input data-f="grams" inputmode="decimal" value="${it.grams}" style="width:90px;text-align:right"><span class="muted">g</span></div>
      <div class="g4">${['kcal', 'protein', 'carbs', 'fat'].map(f => `<div><label class="lbl">${f === 'kcal' ? 'Calories' : f === 'fat' ? 'Fats' : f[0].toUpperCase() + f.slice(1)}</label><input data-f="${f}" inputmode="decimal" value="${it[f]}"></div>`).join('')}</div>
      <button class="chipbtn" data-rm style="margin-top:12px;color:var(--bad)">Remove ingredient</button></div>` : ''}</div>`).join('')
    || '<p class="muted">No ingredients yet.</p>';
  box.querySelectorAll('.ing-head').forEach(h => h.onclick = () => { const i = +h.parentNode.dataset.i; det.open = det.open === i ? -1 : i; renderIngredients(); });
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { m.items.splice(+b.closest('.ing').dataset.i, 1); det.open = -1; renderIngredients(); renderDetTotals(); });
  box.querySelectorAll('[data-f]').forEach(inp => inp.oninput = e => {
    const card = e.target.closest('.ing'), it = m.items[+card.dataset.i], f = e.target.dataset.f;
    if (f === 'name') { it.name = e.target.value; card.querySelector('[data-h=name]').textContent = it.name || 'New ingredient'; return; }
    it[f] = num(e.target.value);
    if (f === 'grams' && it.base.grams > 0) {
      const k = it.grams / it.base.grams;   // scale nutrition with portion size
      for (const x of ['kcal', 'protein', 'carbs', 'fat']) { it[x] = x === 'kcal' ? r0(it.base[x] * k) : r1(it.base[x] * k); card.querySelector(`[data-f="${x}"]`).value = it[x]; }
    } else setBase(it);
    card.querySelector('[data-h=grams]').textContent = it.grams + ' g';
    card.querySelector('[data-h=kcal]').textContent = r0(it.kcal);
    renderDetTotals();
  });
}
function openFixSheet() {
  sheet(`<h3>Fix results</h3><p class="muted" style="margin-top:4px">Tell the AI what's wrong and it will recalculate.</p>
    <textarea id="fTxt" placeholder="e.g. It was brown rice, about 200 g. The chicken was fried in oil."></textarea>
    <button class="btn" id="fGo" style="margin-top:14px">Update</button>`, s => {
    s.querySelector('#fTxt').focus();
    s.querySelector('#fGo').onclick = async () => {
      const t = s.querySelector('#fTxt').value.trim(); if (!t) return;
      const b = s.querySelector('#fGo'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Updating…';
      try {
        const m = det.m, cur = { name: m.name, items: m.items.map(({ base, ...x }) => x), health_score: m.health };
        const parts = [{ text: FOOD_PROMPT + `\nCurrent analysis (for ${m.servings} serving): ${JSON.stringify(cur)}\nThe user corrects it: "${t}"\nApply the correction and return the complete corrected JSON.` }];
        if (m.photo) { const ph = photoCache[m.id] || await idb.get(m.id); if (ph) parts.push({ image: ph.split(',')[1] }); }
        const r = await askAI(parts), items = normItems(r.items);
        if (!items.length) throw new Error(r.notes || 'The AI could not update this meal.');
        m.items = items.map(setBase); m.name = r.name || m.name; m.health = healthOf(r.health_score) || m.health;
        closeSheet(); renderDetail(); toast('✓ Updated');
      } catch (e) { b.disabled = false; b.textContent = 'Update'; toast(e.message === 'NOKEY' ? 'Add your AI key in Settings' : e.message); }
    };
  });
}
function closeDetail(commit) {
  if (commit) {
    const m = det.m;
    m.items = m.items.filter(it => it.name.trim() || num(it.kcal) > 0).map(({ base, ...it }) => ({ ...it, name: it.name.trim() || 'Food' }));
    if (!m.items.length) { if (det.isNew) return toast('Add at least one ingredient'); }
    if (!m.name.trim()) m.name = m.items.map(i => i.name).join(', ') || 'Meal';
    const i = db.meals.findIndex(x => x.id === m.id);
    if (i >= 0) db.meals[i] = m; else db.meals.push(m);
    save(); if (det.isNew) toast('✓ ' + m.name + ' logged');
  }
  $('#detail')?.remove(); document.body.style.overflow = ''; det = null;
  if (tab === 'home') renderHome(); else go('home');
}
function deleteMeal() {
  if (!confirm('Delete this meal?')) return;
  const id = det.m.id;
  db.meals = db.meals.filter(x => x.id !== id); save(); idb.del(id); delete photoCache[id];
  $('#detail')?.remove(); document.body.style.overflow = ''; det = null; renderHome(); toast('Meal deleted');
}

/* ================= Progress ================= */
function renderProgress() {
  const p = db.profile, t = targets(), ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
  const cur = currentWeight(), st = streak(), today = iso();
  const dow = (new Date().getDay() + 6) % 7, mon = addDays(today, -dow);
  const has = new Set(db.meals.map(m => m.date));

function expectedText(p, cur) {
  if (!p || p.goal === 'maintain' || !cur) return '';

  if ((p.goal === 'lose' && rem >= 0) || (p.goal === 'gain' && rem <= 0)) return `<div class="tip">🎉 You reached your goal weight! Update your goal in Settings.</div>`;
  const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(rem) / p.pace * 7));
  return `<div class="tip">At your pace you'll reach <b>${p.targetWeight} kg</b> around <b>${d.toLocaleDateString(LOC, { day: 'numeric', month: 'long', year: 'numeric' })}</b>.</div>`;
}

function weightChart(ws, target) {
  const W = 340, H = 170, P = { l: 30, r: 8, t: 12, b: 20 };
  const vals = ws.map(w => w.kg).concat(target ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const t0 = dt(ws[0].date).getTime(), t1 = Math.max(dt(ws.at(-1).date).getTime(), t0 + 864e5);
  const x = d => P.l + (dt(d).getTime() - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const pts = ws.map(w => [x(w.date), y(w.kg)]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${pts.at(-1)[0].toFixed(1)},${H - P.b} L${pts[0][0].toFixed(1)},${H - P.b} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight chart">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity=".14"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs>
    ${[hi, (hi + lo) / 2, lo].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${r1(v)}</text>`).join('')}
    ${target ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(target)}" y2="${y(target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - P.r}" y="${y(target) - 5}" font-size="10" text-anchor="end" fill="var(--good)" font-weight="600">Goal</text>` : ''}
    <path d="${area}" fill="url(#wg)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>`).join('') : ''}
    <text x="${P.l}" y="${H - 4}" font-size="10" fill="var(--muted)">${fmtDate(ws[0].date)}</text>
    <text x="${W - P.r}" y="${H - 4}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtDate(ws.at(-1).date)}</text></svg>`;
}

function md(text) {
  // Tiny Markdown: bold, italics, headings, bullet and numbered lists
  const lines = esc(text).split('\n'), out = [];
  let list = null;
  const inline = l => l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<i>$2</i>');
  for (const raw of lines) {
    const l = raw.trim(), ul = l.match(/^[-*•]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/);
    const kind = ul ? 'ul' : ol ? 'ol' : null;
    if (list && list !== kind) { out.push(`</${list}>`); list = null; }
    if (kind) { if (!list) { out.push(`<${kind}>`); list = kind; } out.push(`<li>${inline((ul || ol)[1])}</li>`); continue; }
    if (!l) continue;
    const h = l.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<p><b>${inline(h[1])}</b></p>` : `<p>${inline(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join('');
}

  };
  $('#dExp').onclick = () => {
    const blob = new Blob([JSON.stringify(db)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `foodtracker-backup-${iso()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  $('#dImp').onclick = () => $('#fileImport').click();
  $('#dDel').onclick = async () => {
    if (!confirm('Delete ALL meals, weights and goals? This cannot be undone.')) return;
    db = EMPTY(); save(); await idb.clear(); toast('All data deleted'); startOnboarding();
  };
}
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.meals) || !Array.isArray(d.weights)) throw 0;
    if (!confirm(`Restore backup with ${d.meals.length} meals and ${d.weights.length} weights? Current data will be replaced.`)) return;
    db = migrate(Object.assign(EMPTY(), d)); save(); toast('✓ Backup restored'); go('home');
  } catch { toast('This is not a valid backup file'); }
};
function profileFields(p) {
  const opt = (arr, v) => arr.map(([k, l]) => `<option value="${k}" ${String(v) === String(k) ? 'selected' : ''}>${l}</option>`).join('');
  return `<div class="row"><div class="grow"><label class="lbl">Gender</label><select id="pSex">${opt([['m', 'Male'], ['f', 'Female'], ['o', 'Other']], p.sex)}</select></div>
    <div class="grow"><label class="lbl">Birthday</label><input id="pBirth" type="date" value="${p.birth}"></div></div>
    <div class="row"><div class="grow"><label class="lbl">Height (cm)</label><input id="pH" inputmode="numeric" value="${p.height}"></div>
    <div class="grow"><label class="lbl">Workouts / week</label><select id="pW">${opt([['0-2', '0–2'], ['3-5', '3–5'], ['6+', '6+']], p.workouts)}</select></div></div>
    <label class="lbl">Goal</label><select id="pGoal">${opt([['lose', 'Lose weight'], ['maintain', 'Maintain'], ['gain', 'Gain weight']], p.goal)}</select>
    <div class="row"><div class="grow"><label class="lbl">Goal weight (kg)</label><input id="pT" inputmode="decimal" value="${p.targetWeight || ''}"></div>
    <div class="grow"><label class="lbl">Speed (kg / week)</label><select id="pPace">${opt([[0.25, '0.25'], [0.5, '0.5'], [0.75, '0.75'], [1, '1.0']], p.pace)}</select></div></div>`;
}
function openPersonalSheet() {
  if (!db.profile) return startOnboarding();
  sheet(`<h3>Personal details</h3>${profileFields(db.profile)}<button class="btn" id="pSave" style="margin-top:20px">Save</button>`, s => {
    s.querySelector('#pSave').onclick = () => {
      const p = db.profile;
      Object.assign(p, { sex: $('#pSex').value, birth: $('#pBirth').value || p.birth, height: num($('#pH').value) || p.height, workouts: $('#pW').value,
        goal: $('#pGoal').value, targetWeight: r1(num($('#pT').value)) || p.targetWeight, pace: num($('#pPace').value) });
      save(); closeSheet(); toast('✓ Saved'); renderSettings();
    };
  });
}
function openGoalsSheet() {
  const t = targets();
  sheet(`<h3>Adjust macronutrients</h3><p class="muted" style="margin-top:4px">Leave a field empty to use the calculated value.</p>
    ${[['kcal', '🔥 Calorie goal', 'kcal'], ['protein', '🍗 Protein goal', 'g'], ['carbs', '🌾 Carb goal', 'g'], ['fat', '🥑 Fat goal', 'g']].map(([k, l, u]) =>
      `<label class="lbl">${l} (${u})</label><input data-ov="${k}" inputmode="numeric" value="${db.overrides[k] || ''}" placeholder="${t.auto[k] ?? ''} (auto)">`).join('')}
    <button class="btn" id="gSave" style="margin-top:20px">Save</button>
    <button class="btn outline" id="gAuto" style="margin-top:10px">✨ Auto-generate goals</button>`, s => {
    s.querySelector('#gSave').onclick = () => {
      s.querySelectorAll('[data-ov]').forEach(i => { const v = num(i.value); if (v > 0) db.overrides[i.dataset.ov] = v; else delete db.overrides[i.dataset.ov]; });
      save(); closeSheet(); toast('✓ Goals updated'); renderSettings();
    };
    s.querySelector('#gAuto').onclick = () => { db.overrides = {}; save(); closeSheet(); toast('✓ Goals recalculated'); renderSettings(); };
  });
}

/* ================= Onboarding ================= */
let ob = null;
const OB = ['intro', 'gender', 'workouts', 'body', 'birth', 'goal', 'target', 'speed', 'ai', 'plan'];
function startOnboarding() {
  const base = db.profile ? clone(db.profile) : {};
  ob = { step: 0, p: Object.assign({ sex: '', workouts: '', height: 175, weight: 75, birth: '', goal: '', targetWeight: null, pace: 0.5 }, base) };
  if (db.profile) ob.p.weight = currentWeight();
  closeSheet(); renderOb();
}
const obSkip = i => ob.p.goal === 'maintain' && (OB[i] === 'target' || OB[i] === 'speed');
function obMove(d) { let i = ob.step + d; while (i > 0 && i < OB.length - 1 && obSkip(i)) i += d; ob.step = clamp(i, 0, OB.length - 1); renderOb(); }
function renderOb() {
  let pg = $('#onb');
  if (!pg) { pg = document.createElement('div'); pg.id = 'onb'; pg.className = 'page'; pg.style.zIndex = 45; document.body.appendChild(pg); }
  const p = ob.p, s = OB[ob.step];
  const opts = (field, list) => list.map(([v, l, sub]) => `<button class="opt ${p[field] === v ? 'on' : ''}" data-set="${field}" data-v="${v}">${l}${sub ? `<small>${sub}</small>` : ''}</button>`).join('');
  const kgOpts = (v, from, to) => { let o = ''; for (let k = from; k <= to; k += 0.5) o += `<option value="${k}" ${Math.abs(k - v) < 0.01 ? 'selected' : ''}>${k} kg</option>`; return o; };
  let title = '', sub = '', body = '', ok = true, cta = 'Continue';
  if (s === 'intro') {
    pg.innerHTML = `<div class="onb" style="justify-content:center;text-align:center">
      <div class="onb-body" style="display:flex;flex-direction:column;justify-content:center;align-items:center">
        <img src="icon-512.png" alt="" style="width:110px;height:110px;border-radius:28px;box-shadow:var(--shadow)">
        <h1 style="margin-top:30px">Calorie tracking<br>made easy</h1>
        <p class="muted" style="max-width:300px">Just snap a photo of your meal and let AI do the rest.</p></div>
      <button class="btn" id="obNext">Get started</button></div>`;
    pg.querySelector('#obNext').onclick = () => obMove(1);
    return;
  }
  if (s === 'gender') { title = 'Choose your gender'; sub = 'This will be used to calibrate your custom plan.'; body = opts('sex', [['m', 'Male'], ['f', 'Female'], ['o', 'Other']]); ok = !!p.sex; }
  if (s === 'workouts') { title = 'How many workouts do you do per week?'; sub = 'This will be used to calibrate your custom plan.';
    body = opts('workouts', [['0-2', '0–2', 'Workouts now and then'], ['3-5', '3–5', 'A few workouts per week'], ['6+', '6+', 'Dedicated athlete']]); ok = !!p.workouts; }
  if (s === 'body') { title = 'Height & weight'; sub = 'This will be used to calibrate your custom plan.';
    let h = ''; for (let c = 120; c <= 230; c++) h += `<option value="${c}" ${c === r0(p.height) ? 'selected' : ''}>${c} cm</option>`;
    body = `<div class="row"><div class="grow"><label class="lbl">Height</label><select id="obH">${h}</select></div><div class="grow"><label class="lbl">Weight</label><select id="obW">${kgOpts(Math.round(p.weight * 2) / 2, 35, 250)}</select></div></div>`; }
  if (s === 'birth') { title = 'When were you born?'; sub = 'This will be used to calibrate your custom plan.';
    body = `<input type="date" id="obB" value="${p.birth}" max="${addDays(iso(), -365 * 12)}" min="1920-01-01" style="font-size:20px;text-align:center;padding:18px">`; ok = !!p.birth; }
  if (s === 'goal') { title = 'What is your goal?'; sub = 'This helps us generate a plan for your calorie intake.';
    body = opts('goal', [['lose', 'Lose weight'], ['maintain', 'Maintain'], ['gain', 'Gain weight']]); ok = !!p.goal; }
  if (s === 'target') {
    if (!p.targetWeight) p.targetWeight = Math.round((p.goal === 'lose' ? p.weight - 5 : p.weight + 5) * 2) / 2;
    title = 'What is your desired weight?';
    const diff = r1(p.targetWeight - p.weight);
    ok = p.goal === 'lose' ? diff < 0 : diff > 0;
    body = `<div style="text-align:center"><div class="muted" style="font-weight:600">${p.goal === 'lose' ? 'Lose weight' : 'Gain weight'}</div>
      <div class="speedv">${p.targetWeight} kg</div><div class="small ${ok ? 'muted' : ''}" style="${ok ? '' : 'color:var(--bad)'}">${ok ? `${diff > 0 ? '+' : ''}${diff} kg from now` : `Must be ${p.goal === 'lose' ? 'below' : 'above'} your current ${p.weight} kg`}</div></div>
      <select id="obT" style="margin-top:22px">${kgOpts(p.targetWeight, 35, 250)}</select>`;
  }
  if (s === 'speed') {
    title = 'How fast do you want to reach your goal?';
    body = `<div style="text-align:center"><div class="muted" style="font-weight:600">${p.goal === 'lose' ? 'Loss' : 'Gain'} speed per week</div><div class="speedv" id="obSv">${p.pace} kg</div></div>
      <div class="animals"><span>🦥</span><span>🐇</span><span>🐆</span></div>
      <input type="range" id="obS" min="0.1" max="1.5" step="0.1" value="${p.pace}"><div class="spread small muted"><span>0.1 kg</span><span>0.8 kg</span><span>1.5 kg</span></div>
      <div class="tip" id="obTip"></div>`;
  }
  if (s === 'ai') {
    title = 'Turn on AI food scanning'; sub = 'Free with a Google account. It takes 1 minute.';
    body = `<div class="tip" style="margin-top:0">1. Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener"><b>aistudio.google.com/apikey</b></a><br>2. Sign in with Google and tap <b>Create API key</b><br>3. Copy it and paste it here</div>
      <input id="obK" type="password" autocomplete="off" placeholder="Paste your key (AIza…)" value="${esc(getKey())}" style="margin-top:16px">
      <p class="small muted">The key stays only on this phone. You can also add it later in Settings.</p>`;
    cta = getKey() ? 'Continue' : 'Save & continue';
  }
  if (s === 'plan') {
    const t = calcTargets(p, p.weight);
    let reach = '';
    if (p.goal !== 'maintain') { const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(p.targetWeight - p.weight) / p.pace * 7));
      reach = `<div class="tip" style="text-align:center;margin:0 0 18px">You should ${p.goal === 'lose' ? 'lose' : 'gain'}:<br><b style="font-size:18px">${r1(Math.abs(p.targetWeight - p.weight))} kg by ${d.toLocaleDateString(LOC, { day: 'numeric', month: 'long', year: 'numeric' })}</b></div>`; }
    title = 'Congratulations, your custom plan is ready!';
    body = `${reach}<b>Daily recommendation</b><p class="small muted" style="margin:2px 0 12px">You can edit this any time in Settings.</p>
      <div class="plan4">${[['🔥', 'Calories', t.kcal, '', 'var(--ink)'], ['🌾', 'Carbs', t.carbs, 'g', 'var(--carbs)'], ['🍗', 'Protein', t.protein, 'g', 'var(--protein)'], ['🥑', 'Fats', t.fat, 'g', 'var(--fat)']]
        .map(([ic, l, v, u, c]) => `<div class="card"><span class="small" style="font-weight:600">${ic} ${l}</span>${ring(80, 7, 0.75, c, `<b style="font-size:17px">${v}${u}</b>`)}</div>`).join('')}</div>
      <div class="tip"><b>How to reach your goals</b><br>📷 Snap every meal, even snacks<br>🍗 Hit your protein goal every day<br>⚖️ Weigh yourself in the morning a few times a week</div>`;
    cta = "Let's get started!";
  }
  const pct = ob.step / (OB.length - 1) * 100;
  pg.innerHTML = `<div class="onb"><div class="onb-top"><button class="onb-back" id="obBack">←</button><div class="prog"><i style="width:${pct}%"></i></div></div>
    <h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : '<div style="height:20px"></div>'}
    <div class="onb-body">${body}</div>
    <button class="btn" id="obNext" ${ok ? '' : 'disabled'} style="margin-top:20px">${cta}</button></div>`;
  pg.scrollTo(0, 0);
  pg.querySelector('#obBack').onclick = () => obMove(-1);
  pg.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { p[b.dataset.set] = b.dataset.v; if (b.dataset.set === 'goal') p.targetWeight = null; renderOb(); });
  const bind = (id, fn) => { const el = pg.querySelector(id); if (el) el.onchange = el.oninput = () => fn(el); };
  bind('#obH', el => p.height = +el.value);
  bind('#obW', el => p.weight = +el.value);
  bind('#obB', el => { p.birth = el.value; pg.querySelector('#obNext').disabled = !p.birth; });
  bind('#obT', el => { p.targetWeight = +el.value; renderOb(); });
  const tip = () => { const t = pg.querySelector('#obTip'); if (t) t.innerHTML = p.pace <= 0.3 ? '🐢 Slow and steady. Very easy to keep up.' : p.pace <= 0.8 ? '✅ <b>Recommended.</b> The best balance of speed and comfort.' : '⚡ Fast. You may feel very tired. Make sure to eat enough protein.'; };
  bind('#obS', el => { p.pace = +el.value; pg.querySelector('#obSv').textContent = p.pace + ' kg'; tip(); });
  tip();
  pg.querySelector('#obNext').onclick = () => {
    if (s === 'ai') { const k = pg.querySelector('#obK').value.trim(); if (k) LS.set('ft_key', k); }
    if (s === 'plan') return finishOnboarding();
    obMove(1);
  };
}
function finishOnboarding() {
  const p = ob.p;
  if (p.goal === 'maintain') p.targetWeight = p.weight;
  p.pace = num(p.pace) || 0.5; p.height = num(p.height); p.weight = num(p.weight);
  db.profile = p;
  if (!db.weights.length || currentWeight() !== p.weight) { db.weights = db.weights.filter(w => w.date !== iso()); db.weights.push({ date: iso(), kg: p.weight }); }
  save(); ob = null; $('#onb')?.remove(); go('home'); toast('🎉 Your plan is ready');
}

/* ================= Utils ================= */
function scaleImage(src, max) {
  return new Promise((res, rej) => {
    const img = new Image(), isFile = src instanceof Blob, url = isFile ? URL.createObjectURL(src) : src;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      if (isFile) URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { if (isFile) URL.revokeObjectURL(url); rej(new Error('Could not open this image.')); };
    img.src = url;
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s);
  });
}

/* ================= Start ================= */
go('home');
if (!db.profile) startOnboarding();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
