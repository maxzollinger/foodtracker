/* ================= Weekly meal plan & grocery list =================
   The AI plans 7 days of meals that fit the user's goal, daily targets, preferences and what the coach
   remembers, plus one merged shopping list for the week. A plan week runs Saturday → Friday: every
   Saturday morning a new plan is made by itself (unless the user chose to keep their plan). Old plans are
   kept for a few weeks so the next plan doesn't repeat them. The coach sees the current plan too. */
let mpMigrated = false;
function mealPlans() {
  const ps = (db.mealPlans = db.mealPlans || {});
  if (!mpMigrated) {   // plans from the first version were filed under Mondays: move them to their Saturday
    mpMigrated = true;
    for (const k of Object.keys(ps)) {
      if (!ps[k].start) ps[k].start = k;
      if (dt(k).getDay() !== 6) { const nk = satOnOrBefore(k); if (!ps[nk]) ps[nk] = ps[k]; delete ps[k]; }
    }
  }
  return ps;
}
const mealPrefs = () => (db.mealPrefs = db.mealPrefs || { set: false, diet: 'all', avoid: '', likes: '', cook: 'normal', budget: 'normal', meals: '3+1', people: 1 });
const satOnOrBefore = s => addDays(s, -((dt(s).getDay() + 1) % 7));
const planKey = () => satOnOrBefore(iso(new Date(Date.now() - 6 * 3600e3)));   // the new week starts Saturday 06:00
const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const autoPlan = () => mealPrefs().auto !== false;
function curPlan() {
  const ps = mealPlans(), k = planKey();
  if (ps[k]) return ps[k];
  if (!autoPlan()) { const last = Object.keys(ps).filter(x => x <= k).sort().pop(); return last ? ps[last] : undefined; }
}
// The 7 days shown right now (a kept plan simply repeats every week)
const cycleStart = plan => { const d = daysBetween(plan.start, iso()); return d > 0 ? addDays(plan.start, Math.floor(d / 7) * 7) : plan.start; };
const todayIdx = plan => daysBetween(cycleStart(plan), iso());
const engDay = (start, i) => dt(addDays(start, i)).toLocaleDateString('en-GB', { weekday: 'long' });
const weekLabel = ws => `${fmtDate(ws)} – ${fmtDate(addDays(ws, 6))}`;
const MP_DIET = [['all', N('I eat everything')], ['vegetarian', N('Vegetarian')], ['vegan', N('Vegan')], ['pescatarian', N('Pescatarian (fish, no meat)')], ['nopork', N('No pork')], ['halal', N('Halal')]];
const MP_COOK = [['quick', N('Quick (under 20 min)')], ['normal', N('Normal')], ['prep', N('Meal prep (cook 2–3× a week)')]];
const MP_BUDGET = [['low', N('Low budget')], ['normal', N('Normal')], ['high', N('No limit')]];
const MP_MEALS = [['2', N('2 meals')], ['3', N('3 meals')], ['3+1', N('3 meals + 1 snack')], ['3+2', N('3 meals + 2 snacks')]];
let mpBusy = null, mpTab = 'list', mpTried = 0;   // mpBusy: null, 'all' (whole plan) or 'day-meal' (one swap)

function prefsText(pr) {
  const lab = (list, v) => (list.find(x => x[0] === v) || list[0])[1];
  return `diet: ${lab(MP_DIET, pr.diet)}; allergies / does not eat: ${pr.avoid || 'nothing special'}; loves: ${pr.likes || 'no special wishes'}; cooking time: ${lab(MP_COOK, pr.cook)}; budget: ${lab(MP_BUDGET, pr.budget)}; meals per day: ${lab(MP_MEALS, pr.meals)}; cooking for ${pr.people} person(s)`;
}
function planGoalText() {
  const p = db.profile, t = targets(), id = planOf(p).id;
  let s = `Daily targets per person: ${t.kcal} kcal, ${t.protein} g protein, ${t.carbs} g carbs, ${t.fat} g fat. Main goal: ${planOf(p).name} (${planOf(p).sub}). ${PLAN_COACH[id]}`;
  if (id === 'if') { const f = fastState(p); s += ` Eating window ${f.startStr}-${f.endStr}: every meal must fit inside it.`; }
  return s;
}
function planBrief(plan, withList) {
  let s = plan.days.map((d, i) => `${engDay(plan.start, i)}: ${d.meals.map(m => `${m.type} "${m.name}" (${m.kcal} kcal, ${m.protein} g P)`).join('; ')}`).join('\n');
  if (withList) s += '\nGrocery list: ' + plan.groceries.map(g => `${g.cat}: ${g.items.map(i => `${i.name} ${i.qty}`).join(', ')}`).join(' | ');
  return s;
}
const cleanMeal = m => ({ type: String(m.type || ''), name: String(m.name || ''), desc: String(m.desc || ''), min: r0(num(m.min)), g: r0(num(m.g)),
  kcal: r0(num(m.kcal)), protein: r0(num(m.protein)), carbs: r0(num(m.carbs)), fat: r0(num(m.fat)) });
const cleanGroceries = gs => gs.map(g => ({ cat: String(g.cat || ''), items: (g.items || []).filter(i => i && i.name)
  .map(i => ({ name: String(i.name), qty: String(i.qty || ''), have: false })) })).filter(g => g.items.length);
function trimPlans() { const ks = Object.keys(mealPlans()).sort(); ks.slice(0, Math.max(0, ks.length - 8)).forEach(k => delete db.mealPlans[k]); }

async function generatePlan(change, background) {
  if (mpBusy) return;
  if (!hasAI()) return background ? null : toast(T('Add your free AI key in Settings first.'));
  const ws = planKey(), pr = mealPrefs(), old = curPlan();
  const recent = Object.keys(mealPlans()).filter(k => k < ws).sort().slice(-2).flatMap(k => mealPlans()[k].days.flatMap(d => d.meals.map(m => m.name)));
  mpBusy = 'all'; mpTried = Date.now(); renderMealPlan(); if (tab === 'home' && !$('#mplan')) renderHome();
  const prompt = `Create a weekly meal plan and ONE grocery list for the whole week (${engDay(ws, 0)} to ${engDay(ws, 6)}, starting ${ws}).

THE USER
${planGoalText()}
Preferences: ${prefsText(pr)}
${memList().length ? 'What their nutrition coach knows about them: ' + memList().map(m => m.text).join('; ') : ''}

RULES
- 7 days, in order from ${engDay(ws, 0)}. Every day has exactly the meals from "meals per day" (snacks use type "Snack"). Each day adds up to the daily kcal target (within ±5%) and reaches the protein target.
- Tasty, varied, realistic home cooking with ingredients that are easy to find in a normal supermarket in the user's country (app locale ${LOC}). Different main dishes on different days; leftovers may be planned on purpose to save time.
- Follow the diet, allergies and dislikes strictly. Match the cooking time and budget.
- Reuse ingredients across the week so little is wasted.
${recent.length ? `- Do NOT repeat these meals from the previous weeks: ${[...new Set(recent)].slice(0, 40).join(', ')}.` : ''}
${change && old ? `- The user wants to CHANGE the current plan: "${change}". Keep what doesn't need to change.\nCurrent plan:\n${planBrief(old)}` : change ? `- Extra wish from the user: "${change}".` : ''}
- The grocery list covers ALL meals for ${pr.people} person(s) for the whole week, merged (each ingredient once with the total amount, metric units or pieces), grouped into supermarket sections in a sensible shopping order. Leave out water; basic spices and oil go once into a pantry section.
- "prep": 3 to 6 short, practical meal-prep tips for exactly this plan (what to cook ahead, on which day, how to store it).
- Write all names, descriptions, section names and tips in ${langInfo().ai}. Nutrition numbers are per person, per serving.${isLb() ? ' Grocery quantities in US units (lb, oz, fl oz, pieces).' : ''}

Return JSON only:
{"days":[{"meals":[{"type":"Breakfast","name":"","desc":"one short sentence: main ingredients and how it is made","min":15,"g":350,"kcal":0,"protein":0,"carbs":0,"fat":0}]}],"groceries":[{"cat":"","items":[{"name":"","qty":""}]}],"prep":[""]}`;
  try {
    const r = await askAI([{ text: prompt }], { timeout: 120000 });
    if (!r || !Array.isArray(r.days) || r.days.length < 7 || !Array.isArray(r.groceries)) throw new Error(T('The AI answer was incomplete. Please try again.'));
    mealPlans()[ws] = { created: Date.now(), start: ws, days: r.days.slice(0, 7).map(d => ({ meals: (d.meals || []).map(cleanMeal) })),
      groceries: cleanGroceries(r.groceries), prep: (r.prep || []).map(String).filter(Boolean).slice(0, 8) };
    trimPlans(); save(); mpTab = 'list'; LS.set('ft_mp_week', ws);
    if (background) planPopup(true); else toast('✓ ' + T('Your meal plan is ready'));
  } catch (e) { if (!background) toast(aiMsg(e)); }
  mpBusy = null; renderMealPlan(); if (tab === 'home') renderHome();
}

async function swapMeal(di, mi) {
  const plan = curPlan();
  if (!plan || mpBusy) return;
  if (!hasAI()) return toast(T('Add your free AI key in Settings first.'));
  const m = plan.days[di].meals[mi];
  mpBusy = di + '-' + mi; renderMealPlan();
  const prompt = `The user's weekly meal plan and grocery list:
${planBrief(plan, true)}

THE USER
${planGoalText()}
Preferences: ${prefsText(mealPrefs())}

Replace ONLY this meal: ${engDay(plan.start, di)}, ${m.type} "${m.name}" (${m.kcal} kcal, ${m.protein} g protein). Give a different, tasty meal of the same type with about the same calories and protein that is not already in the plan. Then return the complete updated grocery list (remove what is no longer needed, add what the new meal needs, keep the same sections). Write in ${langInfo().ai}.
Return JSON only: {"meal":{"type":"","name":"","desc":"","min":15,"g":350,"kcal":0,"protein":0,"carbs":0,"fat":0},"groceries":[{"cat":"","items":[{"name":"","qty":""}]}]}`;
  try {
    const r = await askAI([{ text: prompt }], { timeout: 90000 });
    if (!r || !r.meal || !r.meal.name) throw new Error(T('The AI answer was incomplete. Please try again.'));
    plan.days[di].meals[mi] = cleanMeal(r.meal);
    if (Array.isArray(r.groceries) && r.groceries.length) {
      const had = new Set(plan.groceries.flatMap(g => g.items.filter(i => i.have).map(i => i.name.toLowerCase())));
      plan.groceries = cleanGroceries(r.groceries);
      plan.groceries.forEach(g => g.items.forEach(i => { if (had.has(i.name.toLowerCase())) i.have = true; }));
    }
    save(); toast('✓ ' + T('Meal swapped'));
  } catch (e) { toast(aiMsg(e)); }
  mpBusy = null; renderMealPlan(); if (tab === 'home') renderHome();
}

// "I ate this": logs a planned meal in one tap (on its planned day, or today if that day is still ahead)
function logPlanMeal(di, mi) {
  const plan = curPlan(); if (!plan) return;
  const m = plan.days[di].meals[mi], day = addDays(cycleStart(plan), di), date = day > iso() ? iso() : day;
  if (m.ate === day && !confirm(T('Already logged. Log it again?'))) return;
  db.meals.push({ id: uid(), date, time: nowTime(), name: m.name, servings: 1, health: null, source: 'plan', photo: false,
    items: [{ name: m.name, grams: m.g || 0, kcal: m.kcal, protein: m.protein, carbs: m.carbs, fat: m.fat }] });
  m.ate = day; save(); toast(T('✓ {name} logged', { name: m.name })); renderMealPlan();
}

// Home card
function mealPlanCard() {

}

function openMealPlan() {

function closeMealPlan() { $('#mplan')?.remove(); document.body.style.overflow = ''; if (tab === 'home') renderHome(); }

    const list = `<p class="small muted" style="margin:12px 4px">${left ? T('{n} of {t} items still to buy · tap an item when you have it', { n: left, t: total }) : '✓ ' + T('You have everything for this week!')}</p>
      ${plan.groceries.map((g, gi) => `<div class="card mp-cat"><div class="mp-catname">${esc(g.cat)}</div>${g.items.map((it, ii) =>

    const meals = plan.days.map((d, di) => {
      const date = addDays(ws, di), isToday = date === iso();
      const tk = d.meals.reduce((a, m) => a + m.kcal, 0), tp = d.meals.reduce((a, m) => a + m.protein, 0);
      return `<div class="card mp-day ${isToday ? 'today' : ''}"><div class="spread mp-dayhead"><b>${esc(fmtDate(date, { weekday: 'long', day: 'numeric', month: 'short' }))}${isToday ? ` · ${T('Today')}` : ''}</b><span class="small muted">${tk} kcal · ${tp} g P</span></div>
        ${d.meals.map((m, mi) => `<div class="mp-meal"><div class="grow"><div class="mp-type">${esc(m.type)}${m.min ? ` · ${m.min} min` : ''}</div><div class="mp-name">${esc(m.name)}</div>
          ${m.desc ? `<div class="small muted">${esc(m.desc)}</div>` : ''}<div class="mp-mac">${m.kcal} kcal · P ${m.protein} g · C ${m.carbs} g · F ${m.fat} g</div>
          <button class="mp-ate ${m.ate === date ? 'done' : ''}" data-ate="${di}-${mi}">${m.ate === date ? '✓ ' + T('Logged') : '＋ ' + T('I ate this')}</button></div>
          <button class="mp-swap" data-sw="${di}-${mi}" aria-label="${T('Swap meal')}">${mpBusy === di + '-' + mi ? '<span class="spin"></span>' : '🔄'}</button></div>`).join('')}</div>`;
    }).join('') + (plan.prep.length ? `<div class="card"><b>🥡 ${T('Meal prep tips')}</b><ul class="mp-tips">${plan.prep.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : '');
    body = `<button class="btn" id="mpCoach" style="font-size:15px;padding-left:12px;padding-right:12px">👨‍🍳 ${T('Get cooking & prep help from your coach')}</button>
      <div class="row mp-actions" style="margin-top:10px"><button class="btn outline sm grow" id="mpEdit">✏️ ${T('Change plan')}</button><button class="btn outline sm grow" id="mpSave">⬇️ ${T('Save / share')}</button></div>
      <div class="seg" style="margin-top:16px"><button data-mt="list" class="${mpTab === 'list' ? 'on' : ''}">🛒 ${T('Grocery list')}</button><button data-mt="meals" class="${mpTab === 'meals' ? 'on' : ''}">🍽 ${T('Meals')}</button></div>
      ${mpTab === 'list' ? list : `<div style="height:12px"></div>${meals}`}`;
  }
  pg.innerHTML = `<div class="mp-head"><button class="mp-back" id="mpBack" aria-label="${T('Close')}">‹</button>
      <div class="grow"><div class="mp-title">${T('Meal plan')}</div><div class="small muted">${weekLabel(ws)}</div></div>
      <button class="chipbtn" id="mpPrefs">⚙︎ ${T('Preferences')}</button></div>
    <div class="wrap mp-body"><button class="mp-auto" id="mpAuto">${autoPlan() ? '🔄 ' + T('New plan every Saturday') : '📌 ' + T('Plan kept, no weekly change')} ›</button>${body}</div>`;
  pg.scrollTop = y;
  pg.querySelector('#mpBack').onclick = closeMealPlan;

// Saves the grocery list + meal plan as one image (iPhone: "Save Image" → Photos, or "Save to Files")
async function exportPlan() {
  const plan = curPlan(); if (!plan) return;
  const ws = cycleStart(plan), W = 1080, P = 72, c = document.createElement('canvas'), x = c.getContext('2d');
  const font = (s, w) => `${w} ${s}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
  const layout = draw => {
    let y = P;
    const text = (t, size, w, color, gap = 1.4) => {
      t = unitText(String(t)); x.font = font(size, w);
      const max = W - P * 2, lines = []; let line = '';
      for (const wd of String(t).split(' ')) { const tl = line ? line + ' ' + wd : wd; if (line && x.measureText(tl).width > max) { lines.push(line); line = wd; } else line = tl; }
      lines.push(line);
      for (const l of lines) { y += size * gap; if (draw) { x.fillStyle = color; x.fillText(l, P, y); } }
    };
    text(T('Grocery list'), 62, 800, '#111', 1.2);
    text(`${weekLabel(ws)} · Food Tracker`, 30, 500, '#8a8a8e');
    for (const g of plan.groceries) {
      y += 30; text(g.cat, 36, 700, '#f08000');
      for (const it of g.items) text(`${it.have ? '☑' : '☐'}  ${it.name}${it.qty ? ' — ' + it.qty : ''}`, 32, 400, it.have ? '#b0b0b4' : '#222', 1.5);
    }
    y += 56; text(T('Meal plan'), 52, 800, '#111', 1.2);
    plan.days.forEach((d, i) => {
      y += 26; text(fmtDate(addDays(ws, i), { weekday: 'long', day: 'numeric', month: 'short' }), 34, 700, '#f08000');
      for (const m of d.meals) text(`${m.type}: ${m.name} · ${m.kcal} kcal, ${m.protein} g P`, 29, 400, '#222', 1.5);
    });
    if (plan.prep.length) { y += 44; text(T('Meal prep tips'), 40, 800, '#111', 1.2); for (const t of plan.prep) text('• ' + t, 29, 400, '#222', 1.5); }
    return Math.ceil(y + P);
  };
  c.width = W; c.height = 10; const H = layout(false);
  c.width = W; c.height = H; x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); layout(true);
  // Made without waiting, so the iPhone still allows the share menu for this tap
  const bin = atob(c.toDataURL('image/png').split(',')[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const file = new File([bytes], `grocery-list-${ws}.png`, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function setTotal(f, v) {
  const m = det.m, cur = mealTotals(m)[f];

  else m.items[0][f] = f === 'kcal' ? r0(v / m.servings) : r1(v / m.servings);

function renderProgress() {
  const p = db.profile, t = targets(), ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
  const cur = currentWeight(), st = streak(), today = iso();
  const dow = (new Date().getDay() + 6) % 7, mon = addDays(today, -dow);

function expectedText(p, cur) {
  if (!p || !cur) return '';

  if ((p.goal === 'lose' && rem >= 0) || (isGain(p.goal) && rem <= 0)) return `<div class="tip">🎉 ${T('You reached your goal weight! Update your goal in Settings.')}</div>`;
  let check = '';
  if (p.goal === 'lean') {
    const rate = weeklyRate();
    if (rate !== null) {
      check = '<br>' + (rate > p.pace + 0.15 ? '📈 ' + T("You're gaining <b>{r} kg/week</b>. That's faster than planned, so more of it is fat. Eat about 150 kcal less per day.", { r: rate })

        : '✅ ' + T("You're gaining <b>{r} kg/week</b>. Right on track for lean muscle.", { r: rate }));
    }
  }
  const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(rem) / p.pace * 7));
  return `<div class="tip">${T("At your pace you'll reach <b>{w} kg</b> around <b>{d}</b>.", { w: p.targetWeight, d: fmtLong(d) })}${check}</div>`;

// Real weight change per week over the last ~4 weeks (null until there are 2+ weeks of weigh-ins)
function weeklyRate() {
  const ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date)).filter(w => w.date >= addDays(iso(), -28));
  const days = ws.length >= 2 ? (dt(ws.at(-1).date) - dt(ws[0].date)) / 864e5 : 0;
  return days >= 14 ? Math.round((ws.at(-1).kg - ws[0].kg) / days * 7 * 100) / 100 : null;
}
function delWeight(date) { if (!confirm(T('Delete this weight entry?'))) return; db.weights = db.weights.filter(w => w.date !== date); save(); renderProgress(); }
function weightChart(ws, target) {
  const W = 340, H = 170, P = { l: 30, r: 8, t: 12, b: 20 };
  const vals = ws.map(w => w.kg).concat(target ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const t0 = dt(ws[0].date).getTime(), t1 = Math.max(dt(ws.at(-1).date).getTime(), t0 + 864e5);
  const x = d => P.l + (dt(d).getTime() - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const pts = ws.map(w => [x(w.date), y(w.kg)]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const area = line + ` L${pts.at(-1)[0].toFixed(1)},${H - P.b} L${pts[0][0].toFixed(1)},${H - P.b} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Weight')}">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity=".14"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs>
    ${[hi, (hi + lo) / 2, lo].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${showW(v)}</text>`).join('')}
    ${target ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(target)}" y2="${y(target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - P.r}" y="${y(target) - 5}" font-size="10" text-anchor="end" fill="var(--good)" font-weight="600">${T('Goal')}</text>` : ''}
    <path d="${area}" fill="url(#wg)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>`).join('') : ''}
    <text x="${P.l}" y="${H - 4}" font-size="10" fill="var(--muted)">${fmtDate(ws[0].date)}</text>
    <text x="${W - P.r}" y="${H - 4}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtDate(ws.at(-1).date)}</text></svg>`;
}

function md(text) {
  // Tiny Markdown: bold, italics, headings, bullet and numbered lists
  const lines = esc(text).split('\n'), out = [];
  let list = null;
  const inline = l => l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<i>$2</i>');
  for (const raw of lines) {
    const l = raw.trim(), ul = l.match(/^[-*•]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/);
    const kind = ul ? 'ul' : ol ? 'ol' : null;
    if (list && list !== kind) { out.push(`</${list}>`); list = null; }
    if (kind) { if (!list) { out.push(`<${kind}>`); list = kind; } out.push(`<li>${inline((ul || ol)[1])}</li>`); continue; }
    if (!l) continue;
    const h = l.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<p><b>${inline(h[1])}</b></p>` : `<p>${inline(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join('');
}
// A half-typed answer can end in the middle of **bold** or a list marker; tidy that up so no stray

function tidyPartial(t) {
  t = t.replace(/\n[-*•\d.)\s]*$/, '\n').replace(/\*+$/, '');
  if ((t.match(/\*\*/g) || []).length % 2) t += '**';
  return t;
}

/* --- Coach memory: lasting facts the user told the coach. The coach adds/removes them with

const memList = () => (db.coachMemory = db.coachMemory || []);
function applyMemoryTags(text) {
  let changed = 0;
  for (const [, f] of text.matchAll(/<memory>([\s\S]*?)<\/memory>/gi)) {
    const fact = f.trim();
    if (fact && !memList().some(m => m.text.toLowerCase() === fact.toLowerCase())) { memList().push({ id: uid(), text: fact, date: iso() }); changed++; }
  }
  for (const [, f] of text.matchAll(/<forget>([\s\S]*?)<\/forget>/gi)) {
    const q = f.trim().toLowerCase(), before = memList().length;
    if (q) db.coachMemory = memList().filter(m => !m.text.toLowerCase().includes(q) && !q.includes(m.text.toLowerCase()));
    changed += before - memList().length;
  }
  if (changed) save();
  return changed;
}

  // The most recent photos/files stay with the conversation, so follow-up questions ("what should I order?") still see them
  let kept = null; try { kept = await idb.get('chatatt'); } catch {}
  const recent = chat.filter(m => !m.err).slice(-30), keptIdx = kept ? recent.findIndex(m => m.t === kept.t) : -1;
  const history = recent.map((m, i) => {
    const n = m.imgs ? m.imgs.length : m.img ? 1 : 0, fs = m.files || (m.file ? [m.file] : []);
    const textPart = { text: m.text + (n ? `\n[${n} photo(s) attached]` : '') + (fs.length ? `\n[file(s) attached: ${fs.join(', ')}]` : '') };
    return { role: m.role, parts: i === keptIdx && i >= recent.length - 12 ? [...kept.parts, textPart] : [textPart] };
  });
  const usesKept = keptIdx >= 0 && keptIdx >= recent.length - 12;
  const sentAt = Date.now();
  chat.push({ role: 'user', text: q, imgs: pics.length ? pics.map(x => x.thumb) : null, files: docs.length ? docs.map(x => x.name) : null, t: sentAt });
  saveChat(); chatBusy = true; renderChat(true);

  /* Calm typing: the stream fills `target` as fast as the AI sends it; the bubble shows it word by
     word at a steady reading pace (a bit quicker when a lot is waiting, so long answers don't drag). */
  let target = '', shown = 0, done = false;
  const near = chatNear;
  const nextWordEnd = (s, from) => { const m = /\S+\s*/y; m.lastIndex = from; return m.exec(s) ? m.lastIndex : s.length; };
  const typer = setInterval(() => {
    const live = $('#live'), clean = stripTags(target);
    if (!live || shown >= clean.length) return;
    const backlog = clean.slice(shown).split(/\s+/).length;
    for (let i = 0, n = backlog > 120 ? 3 : backlog > 50 ? 2 : 1; i < n; i++) shown = nextWordEnd(clean, shown);
    const stick = near();
    live.innerHTML = md(tidyPartial(clean.slice(0, shown))).replace(/(<\/(p|li)>(<\/[uo]l>)?)$/, '<span class="caret"></span>$1');
    if (stick) chatToBottom();
  }, 55);

  let entry;
  try {
    const attach = att.map(x => x.kind === 'image' ? { image: x.full } : x.text != null ? { text: `Attached file "${x.name}":\n${x.text}` } : { inline: { mime: x.mime, data: x.data } });
    if (att.length) {
      attach.push({ text: `[The user attached ${pics.length ? pics.length + ' photo(s)' : ''}${pics.length && docs.length ? ' and ' : ''}${docs.length ? docs.length + ' file(s)' : ''} above, in order${pics.length > 1 ? ' (e.g. several pages of one menu: look at ALL of them together)' : ''}. Read them carefully and answer from what is actually in them.]` });
      idb.set('chatatt', { t: sentAt, parts: attach }).catch(() => {});   // for follow-up questions
    }
    const parts = [...attach, { text: `${liveNumbers()}\n\n${q}` }];
    const answer = await askAI(parts, { json: false, system: coachSystem(), history, strong: att.length > 0 || usesKept, timeout: att.length || usesKept ? 90000 : undefined, onText: t => { target = t; } });
    target = answer;
    const mem = applyMemoryTags(answer);
    entry = { role: 'assistant', text: stripTags(answer), mem: mem > 0, t: Date.now() };
  } catch (e) {
    entry = { role: 'assistant', err: true, text: aiMsg(e), t: Date.now() };
  }
  done = true;
  // Let the typing finish before swapping in the final message
  if (!entry.err) await new Promise(r => { const wait = () => (shown >= stripTags(target).length || tab !== 'chat' || !$('#live')) ? r() : setTimeout(wait, 40); wait(); });
  clearInterval(typer);
  chat.push(entry); chatBusy = false; saveChat();
  if (tab === 'chat') {
    const live = $('#live');
    if (live) { const stick = near(); live.outerHTML = chatBubble(entry); if (stick) chatToBottom(true); }
    else renderChat(true);
  }
}

// Sends this phone's notification address to the server (again whenever it changes)
async function syncPush() {

    const js = JSON.stringify(sub); LS.set('ft_push', js);
    const pf = db.profile, fasting = pf && planOf(pf).id === 'if' && pf.fast;
    const prefs = { ...pushPrefs(), tz: userTZ(), fo: fasting && pushPrefs().fo ? 1 : 0, fs: fasting ? pf.fast.start : '', fh: fasting ? pf.fast.h : 0 },
      sent = js + JSON.stringify(prefs);   // resend when the address, times or time zone change

/* ---------- Silent updates: when the app comes back to the screen, load a new version if there is one ---------- */
let updReady = false, updChecked = 0;
const safeToReload = () => !$('.backdrop') && !$('.page') && !document.body.classList.contains('typing') && !pending.length && !rec && !$('.msg .caret');
async function checkUpdate() {
  if (Date.now() - updChecked < 60e3 || !location.protocol.startsWith('http')) return;
  updChecked = Date.now();
  try {
    const t = await (await fetch('sw.js?u=' + Date.now(), { cache: 'no-store' })).text();
    const v = (t.match(/CACHE = '([^']+)'/) || [])[1];
    // Only one try per new version, so a half-finished upload can never cause repeated reloads
    if (v && v !== APP_VERSION && LS.get('ft_upd_tried', '') !== v) { LS.set('ft_upd_tried', v); updReady = true; navigator.serviceWorker?.getRegistration().then(r => r && r.update()).catch(() => {}); if (safeToReload()) location.reload(); }
  } catch {}
}
let lastTouch = Date.now();
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (!updReady) checkUpdate();
  else if (Date.now() - lastTouch > 45e3 && safeToReload()) kvWait().then(() => location.reload());   // nobody is using it right now
}, 5 * 60e3);
setInterval(() => { if (updReady && document.visibilityState === 'visible' && Date.now() - lastTouch > 45e3 && safeToReload()) kvWait().then(() => location.reload()); }, 20e3);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { checkUpdate(); setTimeout(processQueue, 1000); setTimeout(() => linkSync(false), 1200); if ($('#setupPg')) setTimeout(openSetupPage, 600); syncPush(); setTimeout(checkPlanWeek, 800); setTimeout(autoBackup, 3000); setTimeout(askAccount, 5000); setTimeout(weeklyCheckin, 1500); setTimeout(syncDone, 2500); }

});

// Shared preview under the goal / personal-details forms: what the daily goals will become
function goalPreview(el, p, w, custom) {

    const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(p.targetWeight - w) / p.pace * 7));

  }
  el.innerHTML = T('New daily goals: <b>{k} kcal</b> · {p} g protein · {c} g carbs · {f} g fat', { k: t.kcal, p: t.protein, c: t.carbs, f: t.fat }) + when +

}

// Settings → Your goal: pick one of the 10 goals; the whole app follows. Past days are not changed.

      const pl = planOf(d), [mn, , mx] = paceRange(d), paces = [];

        ${pl.id === 'keto' ? `<label class="lbl">${T('How strict?')}</label><div class="seg">${[['keto', N('Keto (max 30 g carbs)')], ['lowcarb', N('Low carb (max 100 g carbs)')]].map(([v, l]) => `<button data-carb="${v}" class="${d.carbs === v ? 'on' : ''}">${T(l)}</button>`).join('')}</div>` : ''}
        ${pl.id === 'if' ? fastPicker(d.fast) : ''}
        ${needsTarget(d) ? `<div class="row"><div class="grow"><label class="lbl">${T('Goal weight (kg)').replace('kg', wUnit())}</label><input id="gT" inputmode="decimal" value="${showW(d.targetWeight)}"></div>
          <div class="grow"><label class="lbl">${T('Speed (kg / week)')}</label><select id="gP">${paces.map(v => `<option value="${v}" ${v === d.pace ? 'selected' : ''}>${v} kg</option>`).join('')}</select></div></div>` : ''}

      const box = s.querySelector('#gBody'), preview = () => goalPreview(box.querySelector('#gPrev'), d, w, custom);

/* ================= Onboarding ================= */
let ob = null;
const OB = ['intro', 'gender', 'workouts', 'body', 'birth', 'goal', 'dir', 'carbs', 'fasting', 'target', 'speed', 'ai', 'ready'];
function startOnboarding() {
  const base = db.profile ? clone(db.profile) : {};
  ob = { step: 0, p: Object.assign({ sex: '', workouts: '', height: 175, weight: 75, birth: '', plan: '', goal: '', targetWeight: null, pace: 0.5,
    carbs: 'keto', fast: { h: 16, start: '12:00' } }, base) };
  if (db.profile) ob.p.weight = currentWeight();
  closeSheet(); renderOb();
}
// Steps that don't apply to the chosen goal are skipped
function obSkip(i) {
  const s = OB[i], p = ob.p;
  if (s === 'dir') return planOf(p).dir !== null;
  if (s === 'carbs') return p.plan !== 'keto';
  if (s === 'fasting') return p.plan !== 'if';
  if (s === 'target' || s === 'speed') return p.goal === 'maintain';
  if (s === 'ai') return !!SERVER_URL;
  return false;
}
function obMove(d) { let i = ob.step + d; while (i > 0 && i < OB.length - 1 && obSkip(i)) i += d; ob.step = clamp(i, 0, OB.length - 1); renderOb(); }
// Goal-specific tips on the "plan is ready" screen
function planTips(p) {
  const t = [], id = planOf(p).id;
  t.push('📷 ' + T('Snap every meal, even snacks'));
  if (id === 'keto') t.push('🥑 ' + T('Keep carbs under {n} g a day', { n: p.carbs === 'lowcarb' ? 100 : 30 }));
  if (id === 'if') { const f = fastState(p); t.push('⏱️ ' + T('Eat only between {a} and {b}', { a: f.startStr, b: f.endStr })); }
  if (id === 'healthy') t.push('🥗 ' + T('Aim for 30 g fiber a day and less sugar and salt'));
  t.push('🍗 ' + T('Hit your protein goal every day'));
  if (['lean', 'bulk', 'dirty', 'recomp'].includes(id) || p.goal === 'lean') t.push('🏋️ ' + T('Train with weights 3–5× a week and get stronger over time'));
  if (id === 'recomp') t.push('🔄 ' + T('Your weight may stay similar while your body changes'));
  t.push('⚖️ ' + T('Weigh yourself once a week, in the morning before breakfast'));
  return t;
}

    else for (let k = from; k <= to; k += 0.5) o += `<option value="${k}" ${Math.abs(k - v) < 0.01 ? 'selected' : ''}>${k} kg</option>`;

  };
  const calib = T('This will be used to calibrate your custom plan.');
  let title = '', sub = '', body = '', ok = true, cta = T('Continue');
  if (s === 'intro') {
    pg.innerHTML = `<div class="onb" style="justify-content:center;text-align:center">
      <div class="spread">${db.profile ? `<button class="chipbtn" id="obCancel">✕ ${T('Close')}</button>` : '<span></span>'}<span></span></div>

        <p class="muted" style="max-width:300px">${T('Just snap a photo of your meal and let AI do the rest.')}</p></div>
      <div class="langpick"><button id="obLang" class="lp-btn">🌐 <span class="lp-flag">${langInfo().f}</span> ${langInfo().n} <span class="lp-change">⌄</span></button></div>
      <button class="btn" id="obNext">${T('Get started')}</button>
      ${SERVER_URL && !db.profile ? `<button class="small muted" id="obRestore" style="margin-top:14px;padding:6px">${T('Already have an account? Sign in')}</button>` : ''}</div>`;
    pg.querySelector('#obNext').onclick = () => obMove(1);
    if (pg.querySelector('#obRestore')) pg.querySelector('#obRestore').onclick = () => openAccountSheet('login');

  if (s === 'body') { title = T('Height & weight'); sub = calib;
    let h = '';
    if (isIn()) { const sel = Math.round(p.height / CM_IN); for (let i = 48; i <= 90; i++) h += `<option value="${r1(i * CM_IN)}" ${i === sel ? 'selected' : ''}>${Math.floor(i / 12)}′${i % 12}″</option>`; }
    else for (let c = 120; c <= 230; c++) h += `<option value="${c}" ${c === r0(p.height) ? 'selected' : ''}>${c} cm</option>`;
    body = `<div class="seg" style="margin-bottom:14px"><button data-obu="metric" class="${isLb() ? '' : 'on'}">kg · cm</button><button data-obu="us" class="${isLb() ? 'on' : ''}">lb · ft</button></div><div class="row"><div class="grow"><label class="lbl">${T('Height')}</label><select id="obH">${h}</select></div><div class="grow"><label class="lbl">${T('Weight')}</label><select id="obW">${kgOpts(isLb() ? p.weight : Math.round(p.weight * 2) / 2, 35, 250)}</select></div></div>`; }
  if (s === 'birth') { title = T('When were you born?'); sub = calib;
    body = `<input type="date" id="obB" value="${p.birth}" max="${addDays(iso(), -365 * 12)}" min="1920-01-01" style="font-size:20px;text-align:center;padding:18px">`; ok = !!p.birth; }
  if (s === 'goal') { title = T('What is your main goal?'); sub = T('Everything in the app adapts to it. You can change it any time in Settings.');
    body = PLANS.map(x => `<button class="opt cmp ${p.plan === x.id ? 'on' : ''}" data-plan="${x.id}">${x.ic} ${T(x.name)}<small>${T(x.sub)}</small></button>`).join(''); ok = !!p.plan; }
  if (s === 'dir') { title = T('What about your weight?'); sub = T('{goal} works with any weight goal.', { goal: T(planOf(p).name) });
    body = opts('goal', [['lose', T('Lose weight')], ['maintain', T('Keep my weight')], ['lean', T('Gain weight'), T('Slowly, mostly muscle')]]); ok = ['lose', 'maintain', 'lean'].includes(p.goal); }
  if (s === 'carbs') { title = T('How strict do you want to be?');
    body = opts('carbs', [['keto', T('Keto'), T('Max 30 g carbs a day')], ['lowcarb', T('Low carb'), T('Max 100 g carbs a day')]]); }
  if (s === 'fasting') { const f = fastState(p); title = T('Choose your fasting rhythm'); sub = T('You only eat inside your eating window.');
    body = fastPicker(p.fast) + `<div class="tip">${T('Eating window: {a} – {b}', { a: f.startStr, b: f.endStr })}</div>`; }
  if (s === 'target') {
    fixTarget(p, p.weight);
    title = T('What is your desired weight?');
    const diff = r1(p.targetWeight - p.weight);
    ok = p.goal === 'lose' ? diff < 0 : diff > 0;
    body = `<div style="text-align:center"><div class="muted" style="font-weight:600">${planOf(p).ic} ${T(planOf(p).name)}</div>
      <div class="speedv">${p.targetWeight} kg</div><div class="small ${ok ? 'muted' : ''}" style="${ok ? '' : 'color:var(--bad)'}">${ok ? T('{d} kg from now', { d: (diff > 0 ? '+' : '') + diff }) : (p.goal === 'lose' ? T('Must be below your current {w} kg', { w: p.weight }) : T('Must be above your current {w} kg', { w: p.weight }))}</div></div>
      <select id="obT" style="margin-top:22px">${kgOpts(p.targetWeight, 35, 250)}</select>`;
  }
  if (s === 'speed') {
    title = T('How fast do you want to reach your goal?');
    const [mn, df, mx] = paceRange(p);
    if (!(p.pace >= mn && p.pace <= mx)) p.pace = df;
    body = `<div style="text-align:center"><div class="muted" style="font-weight:600">${p.goal === 'lose' ? T('Loss speed per week') : T('Gain speed per week')}</div><div class="speedv" id="obSv">${p.pace} kg</div></div>
      <div class="animals"><span>🦥</span><span>🐇</span><span>🐆</span></div>
      <input type="range" id="obS" min="${mn}" max="${mx}" step="0.05" value="${p.pace}"><div class="spread small muted"><span>${mn} kg</span><span>${df} kg</span><span>${mx} kg</span></div>
      <div class="tip" id="obTip"></div>`;
  }
  if (s === 'ai') {
    title = T('Turn on AI food scanning'); sub = T('Free with a Google account. It takes 1 minute.');
    body = `<div class="tip" style="margin-top:0">${T('1. Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener"><b>aistudio.google.com/apikey</b></a><br>2. Sign in with Google and tap <b>Create API key</b><br>3. Copy it and paste it here')}</div>
      <input id="obK" type="password" autocomplete="off" placeholder="${T('Paste your key (AIza…)')}" value="${esc(getKey())}" style="margin-top:16px">
      <p class="small muted">${T('The key stays only on this phone. You can also add it later in Settings.')}</p>`;
    cta = getKey() ? T('Continue') : T('Save & continue');
  }
  if (s === 'ready') {
    const t = calcTargets(p, p.weight);
    let reach = '';
    if (needsTarget(p)) { const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(p.targetWeight - p.weight) / p.pace * 7));
      reach = `<div class="tip" style="text-align:center;margin:0 0 18px">${p.goal === 'lose' ? T('You should lose:') : T('You should gain:')}<br><b style="font-size:18px">${T('{n} kg by {d}', { n: r1(Math.abs(p.targetWeight - p.weight)), d: fmtLong(d) })}</b></div>`; }
    title = T('Congratulations, your custom plan is ready!');
    sub = `${planOf(p).ic} ${T(planOf(p).name)}`;
    body = `${reach}<b>${T('Daily recommendation')}</b><p class="small muted" style="margin:2px 0 12px">${T('You can edit this any time in Settings.')}</p>
      <div class="plan4">${[['🔥', T('Calories'), t.kcal, '', 'var(--ink)'], ['🌾', T('Carbs'), t.carbs, 'g', 'var(--carbs)'], ['🍗', T('Protein'), t.protein, 'g', 'var(--protein)'], ['🥑', T('Fats'), t.fat, 'g', 'var(--fat)']]
        .map(([ic, l, v, u, c]) => `<div class="card"><span class="small" style="font-weight:600">${ic} ${l}</span>${ring(80, 7, 0.75, c, `<b style="font-size:17px">${v}${u}</b>`)}</div>`).join('')}</div>
      <div class="tip"><b>${T('How to reach your goals')}</b><br>${planTips(p).join('<br>')}</div>`;
    cta = T("Let's get started!");
  }
  const pct = ob.step / (OB.length - 1) * 100;
  pg.innerHTML = `<div class="onb"><div class="onb-top"><button class="onb-back" id="obBack">←</button><div class="prog"><i style="width:${pct}%"></i></div></div>
    <h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : '<div style="height:20px"></div>'}
    <div class="onb-body">${body}</div>
    <button class="btn" id="obNext" ${ok ? '' : 'disabled'} style="margin-top:20px">${cta}</button></div>`;
  pg.scrollTo(0, 0);
  pg.querySelector('#obBack').onclick = () => obMove(-1);
  pg.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => { applyPlan(p, b.dataset.plan, p.weight); renderOb(); });
  pg.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { p[b.dataset.set] = b.dataset.v; if (b.dataset.set === 'goal') { p.pace = paceRange(p)[1]; fixTarget(p, p.weight); } renderOb(); });
  if (pg.querySelector('#fH')) bindFast(pg, p.fast, renderOb);
  const bind = (id, fn) => { const el = pg.querySelector(id); if (el) el.onchange = el.oninput = () => fn(el); };
  bind('#obH', el => p.height = +el.value);
  pg.querySelectorAll('[data-obu]').forEach(b => b.onclick = () => { db.settings.units = b.dataset.obu === 'us' ? { w: 'lb', h: 'in', v: 'oz' } : { w: 'kg', h: 'cm', v: 'ml' }; renderOb(); });
  bind('#obW', el => p.weight = +el.value);
  bind('#obB', el => { p.birth = el.value; pg.querySelector('#obNext').disabled = !p.birth; });
  bind('#obT', el => { p.targetWeight = +el.value; renderOb(); });
  const tip = () => {
    const t = pg.querySelector('#obTip'); if (!t) return;
    t.innerHTML = p.goal === 'lean'
      ? (p.pace <= 0.15 ? '🐢 ' + T('Very slow. Almost no fat gain, but muscle also comes slowly.') : p.pace <= 0.35 ? '✅ ' + T('<b>Recommended.</b> Mostly muscle, very little fat.') : '⚡ ' + T('Upper limit. A bit more fat will come along with the muscle.'))
      : p.plan === 'dirty' ? '🍔 ' + T('Dirty bulk: you gain fast, but a good part of it will be fat.')
      : p.pace <= 0.3 ? '🐢 ' + T('Slow and steady. Very easy to keep up.') : p.pace <= 0.8 ? '✅ ' + T('<b>Recommended.</b> The best balance of speed and comfort.') : '⚡ ' + T('Fast. You may feel very tired. Make sure to eat enough protein.');
  };
  bind('#obS', el => { p.pace = +el.value; pg.querySelector('#obSv').textContent = p.pace + ' kg'; tip(); });
  tip();
  pg.querySelector('#obNext').onclick = () => {
    if (s === 'ai') { const k = pg.querySelector('#obK').value.trim(); if (k) LS.set('ft_key', k); }
    if (s === 'ready') return finishOnboarding();
    obMove(1);
  };
}
function finishOnboarding() {
  const p = ob.p;
  if (p.goal === 'maintain') p.targetWeight = p.weight;
  p.pace = num(p.pace) || 0.5; p.height = num(p.height); p.weight = num(p.weight);
  db.profile = p; db.overrides = {};
  if (!db.weights.length || currentWeight() !== p.weight) { db.weights = db.weights.filter(w => w.date !== iso()); db.weights.push({ date: iso(), kg: p.weight }); }
  LS.set('ft_lang', LANG);
  save(); ob = null; $('#onb')?.remove(); go('home'); toast('🎉 ' + T('Your plan is ready'));
  if (!LS.get('ft_tour', '')) setTimeout(() => openTour(() => setTimeout(() => askReminders(true), 600)), 700);
  else setTimeout(() => askReminders(true), 1800);
}

/* ================= Utils ================= */
// The page area ends exactly where the tab bar starts (so the scroll line never runs behind it)
function measureTabbar() { const t = $('.tabbar'); if (t && t.offsetHeight) document.documentElement.style.setProperty('--tabh', t.offsetHeight + 'px'); }
window.addEventListener('resize', measureTabbar);
// The iPhone shows its photo/file menu next to the (invisible) file input, so move the input
// to where the menu should appear before opening it
function openPicker(sel, anchor) {
  const input = $(sel);
  if (anchor) { const r = anchor.getBoundingClientRect(); input.style.left = Math.max(0, r.left + 16) + 'px'; input.style.top = Math.max(0, r.top) + 'px'; }
  input.click();
}
function scaleImage(src, max, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), isFile = src instanceof Blob, url = isFile ? URL.createObjectURL(src) : src;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      if (isFile) URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { if (isFile) URL.revokeObjectURL(url); rej(new Error(T('Could not open this image.'))); };
    img.src = url;
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s);
  });
}

<script>
/* Starts the app. Meals, chats and settings are kept in two places: the quick small storage
   (localStorage, about 5 MB) and the phone's much larger storage (IndexedDB). As long as the quick copy
   fits, the app starts from it right away; when it gets too big, the app reads the large copy first. */
(function () {
  var BIG = ['ft_data', 'ft_chat'], started = false;
  window.__kv = {};
  function start() {
    if (started) return; started = true;
    var s = document.createElement('script');
    s.textContent = document.getElementById('appjs').textContent;
    document.body.appendChild(s);
  }
  var need = BIG.filter(function (k) {
    try { var v = localStorage.getItem(k); if (v !== null) { window.__kv[k] = v; return false; } } catch (e) {}
    return true;
  });
  if (!need.length || !window.indexedDB) return start();
  try {
    var r = indexedDB.open('foodtracker', 2);
    r.onupgradeneeded = function () {
      var d = r.result;
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = function () {
      var d = r.result, t;
      try { t = d.transaction('kv', 'readonly'); } catch (e) { window.__idbBroken = true; d.close(); return start(); }
      var st = t.objectStore('kv');
      need.forEach(function (k) { var q = st.get(k); q.onsuccess = function () { if (q.result != null) window.__kv[k] = q.result; }; });
      t.oncomplete = function () { d.close(); start(); };
      t.onerror = t.onabort = function () { window.__idbBroken = true; d.close(); start(); };
    };
    r.onerror = function () { window.__idbBroken = true; start(); };
  } catch (e) { window.__idbBroken = true; start(); }
})();
</script>
