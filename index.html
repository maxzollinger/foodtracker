<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Food Tracker</title>
<meta name="theme-color" content="#f7f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Tracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<script>
  // Apply the saved light/dark choice before anything is drawn (no flash)
  try { const t = localStorage.getItem('ft_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f7f7f9;--card:#fff;--text:#111113;--muted:#8e8e93;--line:#ececf0;--track:#efeff3;
  --ink:#111113;--on-ink:#fff;--chip:#f2f2f5;
  --protein:#e3605b;--carbs:#ef9f45;--fat:#4b8cf5;--flame:#ff9500;--good:#34c759;--bad:#ff3b30;
  --shadow:0 2px 14px rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#2c2c2e;--track:#2c2c2e;
  --ink:#f5f5f7;--on-ink:#000;--chip:#2c2c2e;--shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#2c2c2e;--track:#2c2c2e;
    --ink:#f5f5f7;--on-ink:#000;--chip:#2c2c2e;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased}
body{transition:background .25s;overflow:hidden;height:100%}
html{height:100%;overflow:hidden}
#scroller{position:fixed;left:0;right:0;top:0;bottom:var(--tabh,82px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#scroller #view{padding-bottom:36px}
/* Soft fade at the bottom edge so the page blends into the tab bar instead of stopping at a hard line */
#scroller,.msgscroll{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
.tabbar{border-top-color:transparent}
body.chatting #scroller{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);width:100%;padding:14px 16px;border-radius:14px;
  border:0;background:var(--chip);outline:none}
textarea{resize:none;min-height:96px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:22px 0 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);color:var(--on-ink);
  border-radius:999px;padding:17px;font-weight:600;font-size:17px}
.btn:disabled{opacity:.3}
.btn.outline{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{width:auto;padding:10px 18px;font-size:15px}
.chipbtn{background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}

/* Rings */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{transition:stroke-dashoffset .6s ease}
.ring-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}

/* Header + week */
.top{padding:calc(8px + env(safe-area-inset-top)) 0 4px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand img{width:30px;height:30px;border-radius:8px}
.brand,.chipbtn{white-space:nowrap}
.streak{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;box-shadow:var(--shadow)}
.themebtn{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:17px}
.week{display:flex;align-items:center;margin:12px -6px 14px}
.week .nav{width:22px;color:var(--muted);font-size:20px}
.days{flex:1;display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 5px;border-radius:16px;min-width:42px}
.day.sel{background:var(--card);box-shadow:var(--shadow)}
.day.future{opacity:.35;pointer-events:none}
.day .dl{font-size:12px;color:var(--muted);font-weight:600}
.day .dn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  border:2px dashed var(--line)}
.day .dn.logged{border:2px solid var(--text)}
.day .dn.over{border:2px solid var(--bad)}

/* Home cards */
.calcard{display:flex;justify-content:space-between;align-items:center;padding:24px 22px}
.bignum{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.bignum small{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.mcard{background:var(--card);border-radius:20px;padding:16px 12px 14px;box-shadow:var(--shadow);text-align:left}
.mcard .v{font-size:21px;font-weight:800;letter-spacing:-.02em}
.mcard .v small{font-size:13px;color:var(--muted);font-weight:600}
.mcard .l{font-size:12.5px;color:var(--muted);margin:2px 0 12px;font-weight:500}
.mcard .ring{margin:0 auto}
.burncard{display:flex;align-items:center;gap:14px;margin-top:4px;flex-wrap:wrap}
.burncard .note{flex-basis:100%;margin-top:-4px}
.hcard .spread{flex-wrap:wrap;row-gap:4px}
.hcard .spread>span:first-child{white-space:nowrap}
.burncard .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.planchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-size:14px;margin:0 0 12px;white-space:nowrap;overflow:hidden}
.planchip .muted{overflow:hidden;text-overflow:ellipsis}
.frow{margin-top:12px}
.frow .spread{font-size:14px}
.opt.cmp{padding:14px 16px;font-size:16px;margin-bottom:8px}
.hcard .hscale{height:10px;border-radius:5px;background:linear-gradient(90deg,#ff5a4f 0%,#f5b83d 45%,#34c759 75%,#1fa64a 100%);position:relative;margin:14px 0 8px}
.hcard .hscale b{position:absolute;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--card);border:4px solid var(--text);transform:translateX(-50%);transition:left .6s ease}

/* Entries */
.entry{display:flex;gap:12px;background:var(--card);border-radius:20px;padding:10px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:92px;height:92px;border-radius:14px;flex:none;background:var(--chip);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.einfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-right:4px}
.ename{font-weight:650;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.einfo>.spread{align-items:flex-start}
.etime{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 8px;border-radius:999px;flex:none}
.ecal{font-weight:700;font-size:15px}
.emac{display:flex;gap:12px;font-size:13px;color:var(--muted);font-weight:500}
.skel{height:10px;border-radius:6px;background:var(--chip);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.empty{text-align:center;padding:30px 20px;background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.empty b{display:block;font-size:17px;margin-bottom:6px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  padding:8px 18px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--text)}
.fab{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);margin:-26px 0 0 18px;flex:none}
.fab svg{width:28px;height:28px}
/* Smooth page switches: the new page fades and glides in; tab icons react to taps */
.tab{transition:color .25s ease}
.tab svg{transition:transform .18s ease}
.tab:active svg{transform:scale(.86)}
.fab{animation:fabIn .3s cubic-bezier(.2,1.4,.4,1)}
.fab:active{transform:scale(.92)}
@keyframes fabIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#view.pagein{animation:pageIn .32s cubic-bezier(.2,.8,.2,1)}
#chatScreen.pagein{animation:pageFade .26s ease}
#chatScreen.pagein #msgScroll{animation:pageIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#view.pagein,#chatScreen.pagein,#chatScreen.pagein #msgScroll,.fab{animation:none}}

/* Sheets & pages */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheethead{position:sticky;top:-8px;z-index:2;background:var(--card);margin:-8px -20px 6px;padding:10px 20px 4px;display:flex;justify-content:center;touch-action:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheetx{position:absolute;right:14px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--muted);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sheet h3{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.addtile{background:var(--chip);border-radius:20px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;text-align:center}
.addtile span{font-size:30px}

/* Detail */
.hero{height:330px;background:var(--chip);position:relative;display:flex;align-items:center;justify-content:center;font-size:90px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero.short{height:calc(130px + env(safe-area-inset-top))}
.herobar{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px;display:flex;justify-content:space-between}
.circ{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dbody{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-30px;position:relative;padding:22px 18px calc(110px + env(safe-area-inset-bottom))}
.tinput{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;background:none;padding:4px 0;border-radius:0;min-height:0;resize:none;overflow:hidden}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;font-size:20px;font-weight:600}
.stepper b{min-width:28px;text-align:center}
.bigcal{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:left}
.bigcal .ic{width:48px;height:48px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px}
.dmac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dm{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left}
.dm .t{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;gap:4px;align-items:center}
.dm b{font-size:19px;display:block;margin-top:4px}
.hbar{height:8px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:10px}
.hbar i{display:block;height:100%;border-radius:5px;background:var(--good)}
.ing{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden}
.ing-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;width:100%;text-align:left}
.ing-edit{padding:0 16px 16px}
.ing-edit .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ing-edit .g4 input{padding:11px 4px;text-align:center}
.ing-edit .g4 .lbl{text-align:center;margin:8px 0 4px;font-size:11px}
.dfoot{position:fixed;left:0;right:0;bottom:0;z-index:31;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.dfoot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}

/* Onboarding */
.onb{display:flex;flex-direction:column;min-height:100%;padding:calc(10px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.onb-top{display:flex;align-items:center;gap:14px;height:44px}
.onb-back{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:18px;flex:none}
.prog{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.onb h1{font-size:31px;line-height:1.12;letter-spacing:-.03em;margin:26px 0 8px}
.onb .sub{color:var(--muted);margin:0 0 28px}
.onb-body{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--chip);border-radius:18px;padding:19px 20px;font-weight:600;font-size:17px;margin-bottom:12px;transition:.15s}
.opt small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.opt.on{background:var(--ink);color:var(--on-ink)}
.opt.on small{color:inherit;opacity:.7}
.speedv{text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em;margin:10px 0}
.animals{display:flex;justify-content:space-between;font-size:30px;padding:0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:16px 0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--ink);margin-top:-11px;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tip{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:14px;margin-top:16px}
.plan4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan4 .card{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px}

/* Progress */
.pills{display:flex;gap:6px;background:var(--chip);border-radius:999px;padding:4px}
.pills button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.pills button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.two .card{margin:0}
.wdots{display:flex;justify-content:space-between;margin-top:12px}
.wdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.wdots i{width:14px;height:14px;border-radius:50%;background:var(--track)}
.wdots i.on{background:var(--flame)}
.bmi-bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#5aa9f2 0%,#5aa9f2 14%,#34c759 14%,#34c759 40%,#f5b83d 40%,#f5b83d 60%,#ff5a4f 60%);position:relative;margin:18px 0 10px}
.bmi-bar b{position:absolute;top:-6px;width:4px;height:22px;border-radius:2px;background:var(--text);transform:translateX(-50%)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.nbars{display:flex;align-items:flex-end;gap:10px;height:150px;position:relative;margin-top:14px}
.nbars .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px}
.nbars .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;background:var(--track);min-height:4px}
.nbars .col span{font-size:11px;color:var(--muted);font-weight:600}
.nbars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.chart{width:100%;height:auto;display:block}

/* Settings */
.list{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;text-align:left;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{font-size:20px;width:26px;text-align:center}
.li .chev{color:var(--muted)}
.li .val{color:var(--muted);font-size:15px}
.stats3{display:flex;justify-content:space-around;text-align:center}
.stats3 b{display:block;font-size:20px}
.seg{display:flex;gap:6px;background:var(--chip);border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* Chat */
body.chatting{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body.chatting .fab,body.nofab .fab{display:none}
body.typing .tabbar{display:none}
#chatScreen{position:fixed;left:0;right:0;top:0;height:100%;z-index:5;display:flex;flex-direction:column;background:var(--bg)}
body.chatting{overflow:hidden;padding-bottom:0}
.chathead{flex:none;width:100%}
.msgscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msgscroll .wrap{padding-bottom:14px}
#chatScreen .chatbar{position:relative;left:auto;right:auto;bottom:auto;flex:none;padding:8px 14px calc(74px + env(safe-area-inset-bottom))}
body.typing #chatScreen .chatbar{padding-bottom:8px}
body.typing .chatbar{bottom:0;padding-bottom:6px}
.chatbar.hasText .chips{display:none}

.msgs{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.55;word-wrap:break-word}
.msg.new{animation:msgIn .35s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}
.memnote{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}
.msg.user{align-self:flex-end;background:var(--chip);color:var(--text);border-radius:18px;padding:10px 16px}
.msg.ai{align-self:stretch;max-width:100%;background:none;padding:2px 2px 6px;border-radius:0}
.msg.err{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad);padding:10px 14px;border-radius:14px}
.msg img{display:block;max-width:180px;border-radius:12px;margin-bottom:6px}
.msg ul,.msg ol{margin:6px 0 8px;padding-left:20px}
.msg li{margin:3px 0}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.caret{display:inline-block;width:7px;height:15px;margin-left:2px;border-radius:2px;background:var(--muted);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:pulse 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.chatbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:19;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 14px}
.chatbar .in{max-width:560px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--ink);color:var(--on-ink);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600}
.chatbar .in{position:relative}
.chatbar .mic{color:var(--muted)}
.chatbar .mic svg{width:22px;height:22px}
.chatbar .composer .send{display:none}
.chatbar.hasText .composer .send{display:flex}
.chatbar.hasText .composer .mic{display:none}
.composer textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmenu{position:absolute;left:0;bottom:62px;z-index:3;width:min(300px,82vw);padding:8px 6px;border-radius:24px;background:var(--card);
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);
  opacity:0;transform:translateY(10px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:.18s ease}
.chatbar.menuOpen .pmenu{opacity:1;transform:none;pointer-events:auto}
.pmenu button{display:flex;align-items:center;gap:16px;width:100%;padding:15px 16px;text-transform:uppercase;letter-spacing:.09em;font-size:14px;font-weight:700;text-align:left}
.pmenu svg{width:28px;height:28px;color:var(--muted);flex:none}
.recbar{display:none;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:6px 8px;box-shadow:inset 0 0 0 1.5px var(--line),0 0 24px color-mix(in srgb,var(--fat) 35%,transparent)}
.chatbar.recording .recbar{display:flex}
.chatbar.recording .crow{display:none}
.recbar .cbtn{width:42px;height:42px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.recbar .ok{color:var(--fat);font-size:24px}
.wave{flex:1;min-width:0;height:40px;display:flex;align-items:center;justify-content:flex-end;gap:3px;overflow:hidden}
.wave i{width:4px;border-radius:2px;background:var(--muted);transition:height .07s}
.wave i.dot{height:4px;opacity:.5}
.downbtn{position:absolute;left:50%;top:-58px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:20px;font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.downbtn.show{opacity:1;transform:none;pointer-events:auto}
.filetag{font-size:13px;font-weight:600;margin-bottom:4px}
.crow{display:flex;gap:10px;align-items:flex-end}
.plusbtn{width:50px;height:50px;border-radius:16px;flex:none;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center}
.composer{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-end;background:var(--card);border-radius:18px;padding:5px 5px 5px 10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.composer textarea{min-height:0;height:40px;max-height:120px;overflow-y:hidden;background:none;padding:10px 6px;border-radius:0}

<!-- Launch animation: food flies into the ring, the ring fills like a calorie ring, the dot pops, the name appears -->
<div id="splash" aria-hidden="true">
  <style>
    #splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;
      background:radial-gradient(120% 75% at 50% 42%,#221c16 0%,#0b0b0d 62%);transition:opacity 0.675s ease}
    #splash.out{opacity:0;pointer-events:none}
    #splash .sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform 0.675s ease}
    #splash.out .sp-stage{transform:scale(1.06)}
    #splash .sp-stage{backface-visibility:hidden;-webkit-backface-visibility:hidden}
    #splash .sp-logo{position:relative;width:124px;height:124px;overflow:visible}
    #splash .sp-glow{position:absolute;left:50%;top:62px;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,149,0,.20) 0%,rgba(255,149,0,.08) 35%,rgba(255,149,0,0) 68%);opacity:0;animation:spGlow 1.2s ease .3s forwards}
    @keyframes spGlow{to{opacity:1}}
    #splash .sp-sq{transform-origin:60px 60px;animation:spSq 0.9s cubic-bezier(.2,1.5,.4,1) both}
    #splash .sp-ring{stroke-dasharray:83.33 100;stroke-dashoffset:83.33;animation:spRing 1.575s cubic-bezier(.65,0,.25,1) 0.375s forwards}
    #splash .sp-dot{transform-origin:76.8px 30.9px;transform:scale(0);animation:spDot 0.75s cubic-bezier(.2,1.7,.4,1) 1.875s forwards}
    #splash .sp-pulse{fill:none;stroke:#ff9500;stroke-width:2.5;opacity:0;transform-origin:76.8px 30.9px;animation:spPulse 1.275s ease-out 1.95s}
    #splash .sp-food{position:absolute;left:50%;top:62px;width:36px;height:36px;margin:-18px 0 0 -18px;font-size:30px;line-height:36px;text-align:center;
      opacity:0;animation:spFly 1.125s cubic-bezier(.55,0,.8,.2) var(--d) both}
    #splash .sp-spark{position:absolute;left:calc(50% + 17px);top:30px;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#ffb340;
      opacity:0;animation:spSpark 0.975s cubic-bezier(.2,.8,.3,1) 1.98s}
    #splash .sp-title{margin-top:28px;display:flex;font:800 38px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;letter-spacing:-.035em;color:#fff}
    #splash .sp-title span{display:inline-block;opacity:0;transform:translateY(20px) scale(.9);animation:spUp 0.825s cubic-bezier(.2,1.3,.4,1) calc(2.1s + var(--i) * 0.068s) forwards}
    #splash .sp-title .o{color:#ff9f1c}
    #splash .sp-line{height:3px;width:0;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,#ff8a00,#ffcc66);animation:spLine 0.825s cubic-bezier(.6,0,.2,1) 2.925s forwards}
    @keyframes spSq{from{transform:scale(.15) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes spRing{to{stroke-dashoffset:0}}
    @keyframes spDot{0%{transform:scale(0)}55%{transform:scale(1.6)}100%{transform:scale(1)}}
    @keyframes spPulse{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(3.4)}}
    @keyframes spFly{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.15) rotate(var(--r))}18%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(.12) rotate(0deg)}}
    @keyframes spSpark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}
    @keyframes spUp{to{opacity:1;transform:none}}
    @keyframes spLine{to{width:72px}}
    @media (prefers-reduced-motion:reduce){#splash *{animation-duration:0.015s!important;animation-delay:0s!important}}
  </style>
  <div class="sp-stage">
    <span class="sp-food" style="--x:-150px;--y:-190px;--r:-40deg;--d:0.15s">🥑</span>
    <span class="sp-food" style="--x:160px;--y:-170px;--r:35deg;--d:0.33s">🍗</span>
    <span class="sp-food" style="--x:-185px;--y:20px;--r:-25deg;--d:0.51s">🍎</span>
    <span class="sp-food" style="--x:185px;--y:40px;--r:30deg;--d:0.66s">🥦</span>
    <span class="sp-food" style="--x:-110px;--y:200px;--r:-35deg;--d:0.81s">🍳</span>
    <span class="sp-food" style="--x:120px;--y:210px;--r:45deg;--d:0.945s">🍌</span>
    <span class="sp-food" style="--x:0px;--y:-240px;--r:20deg;--d:1.08s">🍣</span>
    <div class="sp-glow"></div>
    <svg class="sp-logo" viewBox="0 0 120 120">
      <rect class="sp-sq" width="120" height="120" rx="28" fill="#141416" stroke="rgba(255,255,255,.08)"/>
      <circle class="sp-ring" cx="60" cy="60" r="33.6" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" pathLength="100" transform="rotate(-60 60 60)"/>
      <circle class="sp-pulse" cx="76.8" cy="30.9" r="9"/>
      <circle class="sp-dot" cx="76.8" cy="30.9" r="9" fill="#ff9500"/>
    </svg>
    <span class="sp-spark" style="--x:46px;--y:-30px"></span><span class="sp-spark" style="--x:52px;--y:10px"></span>
    <span class="sp-spark" style="--x:18px;--y:-52px"></span><span class="sp-spark" style="--x:-14px;--y:-48px"></span>
    <span class="sp-spark" style="--x:36px;--y:38px"></span><span class="sp-spark" style="--x:58px;--y:-12px"></span>
    <div class="sp-title"><span style="--i:0">F</span><span style="--i:1">o</span><span style="--i:2">o</span><span style="--i:3">d</span><span style="--i:4">&nbsp;</span><span class="o" style="--i:5">T</span><span class="o" style="--i:6">r</span><span class="o" style="--i:7">a</span><span class="o" style="--i:8">c</span><span class="o" style="--i:9">k</span><span class="o" style="--i:10">e</span><span class="o" style="--i:11">r</span></div>
    <div class="sp-line"></div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('splash'), quick = matchMedia('(prefers-reduced-motion: reduce)').matches;
      function done() { if (!s || s.classList.contains('out')) return; s.classList.add('out'); setTimeout(function () { s.remove(); }, 700); }
      setTimeout(done, quick ? 350 : 4200);
      s.addEventListener('click', done);   // tap to skip
    })();
  </script>
</div>

<script>
/* ================= Storage ================= */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const EMPTY = () => ({ profile: null, overrides: {}, meals: [], weights: [], exercises: [], settings: { burnMode: 'smart', burnV3: true, leanV1: true } });
let db;
try { db = JSON.parse(LS.get('ft_data', '{}')) || {}; } catch { db = {}; }
db = migrate(Object.assign(EMPTY(), db));
function migrate(d) {
  d.settings = Object.assign({}, d.settings);
  // Goal changed from plain "gain weight" to "build lean muscle" (2026-10-14). Details and history stay;
  // the speed is capped at a lean pace and old custom macro numbers are dropped so the new plan applies.
  const pr = d.profile;
  if (pr && !d.settings.leanV1) {
    if (pr.goal === 'gain') { pr.goal = 'lean'; pr.pace = Math.min(parseFloat(pr.pace) || 0.25, 0.25); d.overrides = {}; }
    d.settings.leanV1 = true;
  }
  // 10 main goals (2026-10-15): map the old goal to the matching new one; nothing else changes
  if (pr && !pr.plan) pr.plan = { lose: 'cut', maintain: 'maintain', lean: 'lean', gain: 'bulk' }[pr.goal] || 'maintain';
  if (pr && !pr.fast) pr.fast = { h: 16, start: '12:00' };
  if (pr && !pr.carbs) pr.carbs = 'keto';
  if (!d.settings.burnV3) { d.settings.burnMode = 'smart'; d.settings.burnV3 = true; }
  d.settings.burnMode = d.settings.burnMode || 'smart';
  d.exercises = d.exercises || [];
  d.meals.forEach(m => { if (!m.servings) m.servings = 1; });
  if (pr && !pr.birth) {
    pr.birth = `${new Date().getFullYear() - (pr.age || 30)}-06-15`;
    pr.workouts = pr.activity >= 1.7 ? '6+' : pr.activity >= 1.5 ? '3-5' : '0-2';
  }
  return d;
}
function save() { if (!LS.set('ft_data', JSON.stringify(db))) toast(T('Could not save. Is your phone storage full?')); if (typeof saveReminderTexts === 'function') saveReminderTexts(); }
const getKey = () => LS.get('ft_key', '');

// Food photos live in IndexedDB (more space than localStorage)
const idb = (() => {
  let conn;
  const open = () => conn || (conn = new Promise((res, rej) => {
    const r = indexedDB.open('foodtracker', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('photos', mode), req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => run('readonly', s => s.get(k)).catch(() => null),
    set: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => {}),
    del: k => run('readwrite', s => s.delete(k)).catch(() => {}),
    clear: () => run('readwrite', s => s.clear()).catch(() => {})
  };
})();
const photoCache = {};
async function hydratePhotos(root = document) {
  for (const img of root.querySelectorAll('img[data-photo]')) {
    const id = img.dataset.photo;
    if (!(id in photoCache)) photoCache[id] = await idb.get(id);
    if (photoCache[id]) img.src = photoCache[id];
    else img.replaceWith(Object.assign(document.createElement('span'), { textContent: '🍽️' }));
  }
}

/* ================= Language =================
   English text is the key; lang.js (window.I18N) holds the translations. N() only marks a string
   for translation where it's defined, T() translates when it's shown. {name} = placeholder. */
const LANGS = [
  { c: 'en', n: 'English', f: '🇬🇧', loc: 'en-GB', ai: 'English' },
  { c: 'de', n: 'Deutsch', f: '🇩🇪', loc: 'de-DE', ai: 'German' },
  { c: 'fr', n: 'Français', f: '🇫🇷', loc: 'fr-FR', ai: 'French' },
  { c: 'es', n: 'Español', f: '🇪🇸', loc: 'es-ES', ai: 'Spanish' },
  { c: 'it', n: 'Italiano', f: '🇮🇹', loc: 'it-IT', ai: 'Italian' },
  { c: 'pt', n: 'Português', f: '🇵🇹', loc: 'pt-PT', ai: 'Portuguese' },
  { c: 'nl', n: 'Nederlands', f: '🇳🇱', loc: 'nl-NL', ai: 'Dutch' },
  { c: 'pl', n: 'Polski', f: '🇵🇱', loc: 'pl-PL', ai: 'Polish' },
  { c: 'tr', n: 'Türkçe', f: '🇹🇷', loc: 'tr-TR', ai: 'Turkish' },
  { c: 'ru', n: 'Русский', f: '🇷🇺', loc: 'ru-RU', ai: 'Russian' },
  { c: 'zh', n: '中文', f: '🇨🇳', loc: 'zh-CN', ai: 'Simplified Chinese' },
  { c: 'ja', n: '日本語', f: '🇯🇵', loc: 'ja-JP', ai: 'Japanese' }
];
const DICT = window.I18N || {};
// Existing users keep English until they choose; new users start in their phone's language
let LANG = LS.get('ft_lang', '') || (db.profile ? 'en' : ((navigator.language || 'en').slice(0, 2).toLowerCase()));
if (!LANGS.some(l => l.c === LANG)) LANG = 'en';
let LOC = LANGS.find(l => l.c === LANG).loc;
const langInfo = () => LANGS.find(l => l.c === LANG);
const N = s => s;
function T(s, v) {
  let r = (DICT[LANG] && DICT[LANG][s]) || s;
  if (v) r = r.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  return r;
}
function i18nStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = T(e.dataset.i18n));
}
function setLang(c) {
  LANG = c; LOC = langInfo().loc; LS.set('ft_lang', c);
  i18nStatic(); saveReminderTexts();
}
function openLangSheet(after) {
  sheet(`<h3>🌐 ${T('Language')}</h3>
    <div class="list" style="box-shadow:none;background:var(--chip);margin-top:12px">${LANGS.map(l =>
      `<button class="li" data-l="${l.c}"><span class="ic">${l.f}</span><span class="grow">${l.n}</span>${l.c === LANG ? '<b>✓</b>' : ''}</button>`).join('')}</div>`, s => {
    s.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { setLang(b.dataset.l); closeSheet(); (after || render)(); });
  });
}

/* ================= Light / dark mode ================= */
const getTheme = () => LS.get('ft_theme', 'auto');

function applyTheme() {
  const t = getTheme(), root = document.documentElement;

  document.querySelector('meta[name=theme-color]').content = isDark() ? '#000000' : '#f7f7f9';
}
function setTheme(t) { LS.set('ft_theme', t); applyTheme(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { applyTheme(); if (tab === 'home') renderHome(); });

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(n), r1 = n => Math.round(n * 10) / 10;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const dt = s => new Date(s + 'T12:00');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowTime = () => new Date().toTimeString().slice(0, 5);
const fmtDate = (s, o = { day: 'numeric', month: 'short' }) => dt(s).toLocaleDateString(LOC, o);
const fmtLong = d => d.toLocaleDateString(LOC, { day: 'numeric', month: 'long', year: 'numeric' });
const clone = o => JSON.parse(JSON.stringify(o));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

function ring(size, stroke, pct, color, inner = '') {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - clamp(pct || 0, 0, 1))}"/></svg><div class="ring-in">${inner}</div></div>`;
}
const MAC = [
  { k: 'protein', label: N('Protein'), left: N('Protein left'), over: N('Protein over'), eaten: N('Protein eaten'), ic: '🍗', c: 'var(--protein)' },
  { k: 'carbs', label: N('Carbs'), left: N('Carbs left'), over: N('Carbs over'), eaten: N('Carbs eaten'), ic: '🌾', c: 'var(--carbs)' },
  { k: 'fat', label: N('Fats'), left: N('Fats left'), over: N('Fats over'), eaten: N('Fats eaten'), ic: '🥑', c: 'var(--fat)' }
];

/* ================= Calculations ================= */
const ACT = { '0-2': 1.375, '3-5': 1.55, '6+': 1.725 };
// "lean" = build lean muscle: a small surplus so most of the gain is muscle, not fat.
const isGain = g => g === 'gain' || g === 'lean';
const LEAN_MAX = 0.5;   // kg/week; faster than this mostly adds fat
/* The 10 main goals. "dir" is the weight direction the rest of the app works with (profile.goal:
   lose / maintain / lean / gain). Diet-style goals (dir: null) let the user pick the weight direction. */
const PLANS = [
  { id: 'cut', ic: '🔥', name: N('Lose weight'), sub: N('Cutting / fat loss: eat in a calorie deficit'), dir: 'lose' },
  { id: 'maintain', ic: '⚖️', name: N('Maintain weight'), sub: N('Eat at maintenance'), dir: 'maintain' },
  { id: 'bulk', ic: '💪', name: N('Build muscle (bulk)'), sub: N('Calorie surplus to gain weight and muscle'), dir: 'gain' },
  { id: 'lean', ic: '🥩', name: N('Lean bulk'), sub: N('Small surplus, mostly whole foods, little fat'), dir: 'lean' },
  { id: 'dirty', ic: '🍔', name: N('Dirty bulk'), sub: N('Big surplus, fast gain, more fat'), dir: 'gain' },
  { id: 'recomp', ic: '🔄', name: N('Recomp'), sub: N('Lose fat and build muscle at the same time'), dir: 'maintain' },
  { id: 'healthy', ic: '🥗', name: N('Eat healthier'), sub: N('Less sugar, salt and processed food'), dir: null },
  { id: 'protein', ic: '🍗', name: N('High protein'), sub: N('Hit a daily protein target'), dir: null },
  { id: 'keto', ic: '🥑', name: N('Keto / low carb'), sub: N('Very few carbs, more fat'), dir: null },
  { id: 'if', ic: '⏱️', name: N('Intermittent fasting'), sub: N('Eat within a daily time window (16:8 etc.)'), dir: null }
];
const planOf = p => PLANS.find(x => x.id === (p && p.plan)) || PLANS[1];
const DIRS = [['lose', N('Lose weight')], ['maintain', N('Keep my weight')], ['lean', N('Gain weight')]];
const FASTS = [[14, '14:10'], [16, '16:8'], [18, '18:6'], [20, '20:4']];
const needsTarget = p => p.goal !== 'maintain';
// Speed limits per goal in kg/week: [min, default, max]
function paceRange(p) {
  const id = planOf(p).id;
  if (p.goal === 'lean') return [0.1, 0.25, LEAN_MAX];
  if (id === 'bulk') return [0.1, 0.35, 0.75];
  if (id === 'dirty') return [0.25, 0.75, 1];
  return [0.1, 0.5, 1];
}
// Picking a goal sets the weight direction, a sensible goal weight and a speed inside the allowed range
function applyPlan(p, id, w) {
  const pl = PLANS.find(x => x.id === id);
  p.plan = id;
  if (pl.dir) p.goal = pl.dir;
  else if (!['lose', 'maintain', 'lean'].includes(p.goal)) p.goal = p.goal === 'gain' ? 'lean' : 'maintain';
  p.pace = paceRange(p)[1];   // each goal starts at its typical speed (adjustable)
  fixTarget(p, w);
}
function fixTarget(p, w) {
  if (p.goal === 'maintain') p.targetWeight = w;
  else if (p.goal === 'lose' && !(p.targetWeight < w)) p.targetWeight = Math.round((w - 5) * 2) / 2;
  else if (isGain(p.goal) && !(p.targetWeight > w)) p.targetWeight = Math.round((w + 5) * 2) / 2;
  const [mn, df, mx] = paceRange(p);
  if (!(p.pace >= mn && p.pace <= mx)) p.pace = df;
}
function age(p) { const b = new Date(p.birth), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a || 30; }
function currentWeight() {
  if (db.weights.length) return [...db.weights].sort((a, b) => a.date.localeCompare(b.date)).at(-1).kg;
  return db.profile ? db.profile.weight : 0;
}
function calcTargets(p, w) {
  const bmr = 10 * w + 6.25 * p.height - 5 * age(p) + (p.sex === 'm' ? 5 : p.sex === 'f' ? -161 : -78);
  const tdee = bmr * (ACT[p.workouts] || 1.375), plan = planOf(p).id;
  let kcal = tdee;
  if (p.goal === 'lose') kcal -= p.pace * 7700 / 7;
  if (p.goal === 'gain') kcal += p.pace * 7700 / 7;
  if (p.goal === 'lean') kcal += Math.min(num(p.pace) || 0.25, LEAN_MAX) * 7700 / 7;
  if (plan === 'recomp') kcal = tdee - Math.min(300, tdee * 0.1);   // small deficit; high protein + training do the rest
  kcal = Math.max(kcal, p.sex === 'm' ? 1500 : 1200);
  let perKg = p.goal === 'lose' || p.goal === 'lean' ? 2.0 : p.goal === 'gain' ? 1.8 : 1.6;
  if (plan === 'cut' || plan === 'recomp' || plan === 'protein') perKg = 2.2;
  if (plan === 'dirty') perKg = 1.6;
  const protein = w * perKg;
  let fat, carbs;
  if (plan === 'keto') {
    carbs = p.carbs === 'lowcarb' ? 100 : 30;
    fat = Math.max(0, (kcal - protein * 4 - carbs * 4) / 9);
  } else {
    fat = kcal * (plan === 'healthy' || plan === 'dirty' ? 0.3 : 0.27) / 9;
    carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  }
  return { kcal: r0(kcal), protein: r0(protein), carbs: r0(carbs), fat: r0(fat), tdee: r0(tdee), bmr: r0(bmr) };
}
function targets() {
  if (!db.profile) return { kcal: 2000, protein: 150, carbs: 200, fat: 60, bmr: 1700, auto: {} };
  const t = calcTargets(db.profile, currentWeight());
  t.auto = { ...t };
  for (const k of ['kcal', 'protein', 'carbs', 'fat']) if (num(db.overrides[k]) > 0) t[k] = r0(num(db.overrides[k]));
  return t;
}
function mealTotals(m) {
  const s = m.servings || 1, t = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
  for (const it of m.items) for (const k in t) t[k] += num(it[k]) * s;
  return t;
}
function dayTotals(date) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0, count: 0 };
  for (const m of db.meals) if (m.date === date) { t.count++; const mt = mealTotals(m); for (const k in mt) t[k] += mt[k]; }
  return t;
}
const dayBurned = date => db.exercises.filter(e => e.date === date).reduce((a, e) => a + num(e.kcal), 0);
// Exercise the base goal already pays for each day: the step from "mostly sitting" (x1.2) to the chosen
// workouts-per-week level. Logged workouts up to this amount don't raise the goal again.
function includedExercise() { const t = targets(), p = db.profile; return p ? r0(t.bmr * ((ACT[p.workouts] || 1.375) - 1.2)) : 0; }
// The goals for one day. "smart": watches overestimate, so count 75% of what was logged, and only the part
// beyond the training already in the base goal is added. "all": add everything. "off": never add.
// Extra energy is given back mostly as carbs (75%) and some fat (25%); protein stays the same.
function dayGoals(date) {
  const t = targets(), burned = r0(dayBurned(date)), mode = db.settings.burnMode, included = includedExercise();
  const extra = !burned || mode === 'off' ? 0 : mode === 'all' ? burned : Math.max(0, r0(burned * 0.75 - included));
  const keto = db.profile && planOf(db.profile).id === 'keto';
  return { ...t, kcal: t.kcal + extra, carbs: t.carbs + (keto ? 0 : r0(extra * 0.75 / 4)), fat: t.fat + r0(extra * (keto ? 1 : 0.25) / 9), burned, extra, included };
}
/* Health score (1-10). AI gives one per meal; meals without one (manual entries, older meals)
   get an estimate from their macros. The day score is a calorie-weighted average, so a big
   lunch counts more than a small snack. */
function estimateHealth(m) {
  const t = mealTotals(m); if (t.kcal < 1) return null;
  const pP = t.protein * 4 / t.kcal, fP = t.fat * 9 / t.kcal, cP = t.carbs * 4 / t.kcal;
  let h = 5;
  h += pP >= 0.3 ? 2 : pP >= 0.2 ? 1 : pP < 0.1 ? -1 : 0;
  h -= fP > 0.5 ? 1.5 : fP > 0.4 ? 0.5 : 0;
  if (cP > 0.7 && pP < 0.1) h -= 1;
  return clamp(Math.round(h), 1, 10);
}
const mealHealth = m => m.health || estimateHealth(m);
function healthAvg(meals) {
  let sum = 0, w = 0;
  for (const m of meals) { const h = mealHealth(m); if (!h) continue; const k = Math.max(mealTotals(m).kcal, 50); sum += h * k; w += k; }
  return w ? r1(sum / w) : null;
}
const healthLabel = h => T(h >= 8 ? N('Excellent') : h >= 6.5 ? N('Good') : h >= 5 ? N('Okay') : h >= 3.5 ? N('Could be better') : N('Poor'));
const healthColor = h => h >= 6.5 ? 'var(--good)' : h >= 5 ? 'var(--carbs)' : 'var(--bad)';
function healthCard(date) {
  const avg = healthAvg(db.meals.filter(m => m.date === date));
  return `<div class="card hcard"><div class="spread"><span style="font-weight:700">💚 ${T('Health score')}</span>
      <span>${avg === null ? `<span class="muted" style="font-weight:600">${T('No meals yet')}</span>`
        : `<span style="color:${healthColor(avg)};font-weight:700;margin-right:8px">${healthLabel(avg)}</span><b style="font-size:22px">${avg}</b><span class="muted" style="font-weight:600">/10</span>`}</span></div>
    <div class="hscale" style="margin-bottom:4px">${avg === null ? '' : `<b style="left:${(avg - 1) / 9 * 100}%"></b>`}</div></div>`;
}
// Sugar, fibre and sodium for a day (only meals analysed since these were added carry them)
function dayExtras(date) {
  const x = { sugar: 0, fiber: 0, sodium: 0, known: 0, meals: 0 };
  for (const m of db.meals) if (m.date === date) {
    x.meals++;
    let has = false;
    for (const it of m.items) for (const k of ['sugar', 'fiber', 'sodium']) if (it[k] != null && it[k] !== '') { x[k] += num(it[k]) * (m.servings || 1); has = true; }
    if (has) x.known++;
  }
  return x;
}
// Intermittent fasting: where are we in the day's fasting / eating window?
function fastState(p) {
  const f = (p && p.fast) || { h: 16, start: '12:00' }, win = 24 - f.h, [sh, sm] = f.start.split(':').map(Number);
  const now = new Date(), mins = now.getHours() * 60 + now.getMinutes(), s = sh * 60 + sm, e = (s + win * 60) % 1440;
  const inside = t => s < e ? (t >= s && t < e) : (t >= s || t < e);
  const until = x => ((x - mins) % 1440 + 1440) % 1440;
  const hm = v => `${Math.floor(v / 60)}h ${String(v % 60).padStart(2, '0')}m`;
  const fmt = x => `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`;
  return { h: f.h, win, inWin: inside(mins), inside, startStr: fmt(s), endStr: fmt(e), toEnd: hm(until(e)), toStart: hm(until(s)),
    fasted: hm(f.h * 60 - until(s)), pct: inside(mins) ? 1 - until(e) / (win * 60) : 1 - until(s) / (f.h * 60) };
}
function fastingHTML() {
  const f = fastState(db.profile);
  const outside = db.meals.filter(m => m.date === iso() && /^\d\d:\d\d/.test(m.time || '') && !f.inside(+m.time.slice(0, 2) * 60 + +m.time.slice(3, 5))).length;
  return `<div class="card" id="fastCard"><div class="spread"><b>⏱️ ${T('Intermittent fasting')} ${f.h}:${f.win}</b><span class="etime">${f.startStr}–${f.endStr}</span></div>
    <div style="font-size:22px;font-weight:800;margin-top:8px">${f.inWin ? '🍽️ ' + T('Eating window open') : '🌙 ' + T('Fasting')}</div>
    <div class="small muted" style="margin-top:2px">${f.inWin ? T('Closes at {t} · {d} left', { t: f.endStr, d: f.toEnd }) : T('{d} fasted · window opens at {t} (in {r})', { d: f.fasted, t: f.startStr, r: f.toStart })}</div>
    <div class="hbar"><i style="width:${r0(f.pct * 100)}%;background:${f.inWin ? 'var(--good)' : 'var(--flame)'}"></i></div>
    ${outside ? `<p class="small" style="color:var(--bad);margin:8px 0 0">${T('Meals outside your eating window today: {n}', { n: outside })}</p>` : ''}</div>`;
}
// The extra Home card that fits the chosen goal
function focusCard(date, t, tot) {
  const p = db.profile; if (!p) return '';
  const id = planOf(p).id, bar = (v, max, color) => `<div class="hbar"><i style="width:${clamp(v / max * 100, 0, 100)}%;background:${color}"></i></div>`;
  if (id === 'if') return date === iso() ? fastingHTML() : '';
  if (id === 'healthy') {
    const x = dayExtras(date), sugarMax = r0(t.kcal * 0.1 / 4);
    const row = (ic, label, v, lim, unit, isMax) => `<div class="frow"><div class="spread"><span>${ic} ${label}</span><span><b>${r0(v)}</b> <span class="muted">/ ${isMax ? T('max') + ' ' : ''}${lim} ${unit}</span></span></div>
      ${bar(v, lim, isMax ? (v > lim ? 'var(--bad)' : 'var(--good)') : (v >= lim ? 'var(--good)' : 'var(--carbs)'))}</div>`;
    return `<div class="card"><b>🥗 ${T('Healthy eating')}</b>
      ${row('🍬', T('Sugar'), x.sugar, sugarMax, 'g', true)}${row('🌾', T('Fiber'), x.fiber, 30, 'g', false)}${row('🧂', T('Sodium'), x.sodium, 2000, 'mg', true)}
      ${x.meals > x.known ? `<p class="small muted" style="margin:10px 0 0">${T('Meals logged before this goal have no sugar, fiber or sodium data.')}</p>` : ''}</div>`;
  }
  if (id === 'keto') {
    const v = tot.carbs, lim = t.carbs, over = v > lim;
    return `<div class="card"><div class="spread"><b>🥑 ${T('Carb limit')}</b><span><b style="${over ? 'color:var(--bad)' : ''}">${r0(v)}</b> <span class="muted">/ ${lim} g</span></span></div>${bar(v, lim, over ? 'var(--bad)' : 'var(--good)')}
      <p class="small muted" style="margin:8px 0 0">${over ? T('You are over your carb limit today.') : p.carbs === 'lowcarb' ? T('Stay under {n} g of carbs today.', { n: lim }) : T('Stay under {n} g of carbs to keep ketosis.', { n: lim })}</p></div>`;
  }
  if (id === 'protein' || id === 'recomp') {
    const v = tot.protein, g = t.protein, left = r0(g - v);
    return `<div class="card"><div class="spread"><b>${id === 'recomp' ? '🔄 ' + T('Recomp') : '🍗 ' + T('Protein target')}</b><span><b>${r0(v)}</b> <span class="muted">/ ${g} g</span></span></div>${bar(v, g, 'var(--protein)')}
      <p class="small muted" style="margin:8px 0 0">${left > 0 ? T('{n} g protein to go today.', { n: left }) : T('Protein goal reached! 🎉')}${id === 'recomp' ? ' ' + T('Train with weights; your weight may stay similar while your body changes.') : ''}</p></div>`;
  }

}
// Small "your goal" pill on Home
function planChip() {
  const p = db.profile; if (!p) return '';
  const pl = planOf(p), t = targets(), diff = r0(t.kcal - t.tdee);
  let detail;
  if (pl.id === 'keto') detail = T('max {n} g carbs', { n: t.carbs });
  else if (pl.id === 'if') { const f = fastState(p); detail = `${f.h}:${f.win} · ${f.startStr}–${f.endStr}`; }
  else detail = diff > 30 ? T('+{n} kcal/day surplus', { n: diff }) : diff < -30 ? T('{n} kcal/day deficit', { n: diff }) : T('maintenance calories');

function streak() {
  const has = new Set(db.meals.map(m => m.date));
  let d = iso(), n = 0;
  if (!has.has(d)) d = addDays(d, -1);
  while (has.has(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ================= Navigation ================= */
let tab = 'home', sel = iso(), weekOff = 0, calMode = 'left', pending = [];
let progRange = 90, nutWeek = 0;

document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
$('#fab').onclick = openAddMenu;

/* ================= Home ================= */
function renderHome() {
  const t = dayGoals(sel), tot = dayTotals(sel), burned = t.burned;
  const goalK = t.kcal;
  const today = iso(), st = streak();
  // Week strip (Mon–Sun)
  const dow = (new Date().getDay() + 6) % 7, mon = addDays(today, -dow + weekOff * 7);
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const week = days.map(d => {
    const dtot = dayTotals(d), cls = dtot.count ? (dtot.kcal > dayGoals(d).kcal * 1.1 ? 'over' : 'logged') : '';
    return `<button class="day ${d === sel ? 'sel' : ''} ${d > today ? 'future' : ''}" data-d="${d}">
      <span class="dl">${dt(d).toLocaleDateString(LOC, { weekday: 'short' }).replace('.', '').slice(0, 3)}</span><span class="dn ${cls}">${dt(d).getDate()}</span></button>`;
  }).join('');
  const left = goalK - tot.kcal;
  const calBig = calMode === 'left'
    ? `<div class="bignum">${Math.abs(r0(left))}</div><div class="muted" style="margin-top:6px;font-weight:500">${left < 0 ? T('Calories over') : T('Calories left')}</div>`
    : `<div class="bignum">${r0(tot.kcal)}<small> /${goalK}</small></div><div class="muted" style="margin-top:6px;font-weight:500">${T('Calories eaten')}</div>`;
  const macros = MAC.map(m => {
    const v = tot[m.k], g = t[m.k], l = g - v;
    const top = calMode === 'left' ? `${Math.abs(r0(l))}g` : `${r0(v)}<small> /${g}g</small>`;
    const lab = T(calMode === 'left' ? (l < 0 ? m.over : m.left) : m.eaten);
    return `<button class="mcard" data-toggle><div class="v">${top}</div><div class="l">${lab}</div>${ring(62, 6, v / g, m.c, `<span style="font-size:20px">${m.ic}</span>`)}</button>`;
  }).join('');

  // Entries for selected day
  const entries = [
    ...pending.filter(p => p.date === sel).map(p => ({ kind: 'pending', time: p.time, p })),
    ...db.meals.filter(m => m.date === sel).map(m => ({ kind: 'meal', time: m.time, m }))
  // Calories burned always first, then photos still being analysed, then meals (newest first)
  ].sort((a, b) => { const rank = k => k === 'ex' ? 0 : k === 'pending' ? 1 : 2; return rank(a.kind) - rank(b.kind) || (b.time || '').localeCompare(a.time || ''); });

  let list = entries.map(en => {
    if (en.kind === 'pending') {
      const p = en.p;
      return `<div class="entry"><div class="thumb">${p.preview ? `<img src="${p.preview}" alt="">` : '💬'}

function sheet(html, mount) {
  closeSheet();
  const b = document.createElement('div');
  b.className = 'backdrop';
  b.innerHTML = `<div class="sheet"><div class="sheethead"><div class="grab"></div><button class="sheetx" aria-label="${T('Close')}">✕</button></div>${html}</div>`;
  b.onclick = e => { if (e.target === b) dismissSheet(); };
  document.body.appendChild(b);
  const sh = b.querySelector('.sheet');
  sh.querySelector('.sheetx').onclick = dismissSheet;
  // Swipe down to close: from the top bar, or anywhere while the sheet is scrolled to the top
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => {
    const onHead = e.target.closest('.sheethead');
    y0 = (onHead || sh.scrollTop <= 0) && !e.target.closest('input,textarea,select') ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0 && (sh.scrollTop <= 0 || e.target.closest('.sheethead'))) { e.preventDefault(); sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
    else if (dy < 0) y0 = null;
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 === null) return;
    y0 = null; sh.style.transition = 'transform .2s ease';
    if (dy > 90) dismissSheet(); else sh.style.transform = '';
  });
  if (mount) mount(sh);
}
function closeSheet() { document.querySelectorAll('.backdrop').forEach(x => x.remove()); }
// Closing by hand slides the sheet down first
function dismissSheet() {
  const b = $('.backdrop'), sh = b && b.querySelector('.sheet');
  if (!sh) return;
  sh.style.transition = 'transform .2s ease'; sh.style.transform = 'translateY(105%)'; b.style.transition = 'opacity .2s'; b.style.opacity = '0';
  setTimeout(() => b.remove(), 200);
}

// Food names come back in the app language
const foodPrompt = () => `You are an expert nutritionist powering a calorie tracking app.
Identify every food and drink in the meal. Estimate each portion in grams using visual cues (plate size, cutlery, hands, packaging). Include cooking oils, sauces and dressings.
Return ONLY JSON in this exact shape:
{"name": "short appetising meal name", "items": [{"name": "ingredient", "grams": 0, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0, "sugar": 0, "fiber": 0, "sodium": 0}], "health_score": 7, "notes": "short"}
Numbers are for the whole portion (not per 100 g); macros, sugar and fiber in grams, sodium in milligrams. health_score is an integer 1-10 (10 = very healthy: whole foods, high protein and fibre, low sugar). If there is no food, return "items": [] and explain in notes.
Write "name", every ingredient name and "notes" in ${langInfo().ai}.`;

/* --- AI engine ---
   Parts format: [{ text }, { image: base64jpeg }]. Tries every free Google model in turn (each has its
   own daily limit), skipping ones that are rate-limited, then Claude if a Claude key is set. */
const getClaudeKey = () => LS.get('ft_claude_key', '');
const hasAI = () => !!(getKey() || getClaudeKey());
let lastAI = '';
const GEMINI = [
  { id: 'gemini-3.5-flash-lite' },                                   // fastest, minimal thinking by default
  { id: 'gemini-3.1-flash-lite' },
  { id: 'gemini-3.6-flash', think: { thinkingLevel: 'minimal' } },
  { id: 'gemini-3.8-flash', think: { thinkingLevel: 'low' } },
  { id: 'gemini-flash-latest' },
  { id: 'gemini-2.5-flash-lite' },
  { id: 'gemini-2.5-flash', think: { thinkingBudget: 0 } }
];
const aiErr = (msg, fatal) => Object.assign(new Error(msg), { fatal });
function parseJSON(text) {
  const t = String(text || '').replace(/```(json)?/g, '').trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) try { return JSON.parse(t.slice(a, b + 1)); } catch {}
  throw aiErr(T('The AI gave an unreadable answer. Please try again.'));
}
function untilQuotaReset() { const d = new Date(); d.setUTCHours(8, 5, 0, 0); if (d <= new Date()) d.setUTCDate(d.getUTCDate() + 1); return d - new Date(); }
// Merge consecutive same-role messages so the conversation alternates user/assistant
function normMsgs(msgs) {
  const out = [];
  for (const m of msgs) { const prev = out.at(-1); if (prev && prev.role === m.role) prev.parts = prev.parts.concat(m.parts); else out.push({ role: m.role, parts: [...m.parts] }); }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}
async function askAI(parts, opt = {}) {
  const json = opt.json !== false;
  const msgs = normMsgs([...(opt.history || []), { role: 'user', parts }]);
  const g = getKey(), c = getClaudeKey();
  if (!g && !c) throw new Error('NOKEY');
  const prov = [];
  if (g) prov.push(() => geminiChain(g, msgs, opt.system, json, opt.onText));
  if (c) prov.push(() => claudeCall(c, msgs, opt.system, json, opt.onText));
  if (LS.get('ft_ai_first', 'gemini') === 'claude') prov.reverse();
  let err;
  for (const run of prov) {
    try { const text = await run(); return json ? parseJSON(text) : text; }
    catch (e) { err = e; }
  }
  throw err;
}
const aiMsg = e => e.message === 'NOKEY' ? T('Add your free AI key in Settings first.') : e.message;
// Reads a server-sent-events stream and calls onEvent with each parsed JSON "data:" payload
async function readSSE(res, onEvent) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf = (buf + dec.decode(value, { stream: true })).replace(/\r\n/g, '\n');
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const data = buf.slice(0, i).split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n');
      buf = buf.slice(i + 2);
      if (data && data !== '[DONE]') { let ev; try { ev = JSON.parse(data); } catch { continue; } onEvent(ev); }
    }
  }
}
async function geminiOnce(key, model, msgs, system, json, onText) {
  const def = GEMINI.find(m => m.id === model) || {};
  const noThink = JSON.parse(LS.get('ft_nothink', '[]'));
  const think = def.think && !noThink.includes(model) ? def.think : null;
  const body = {
    contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user',
      parts: m.parts.map(p => p.image ? { inlineData: { mimeType: 'image/jpeg', data: p.image } } : p.inline ? { inlineData: { mimeType: p.inline.mime, data: p.inline.data } } : { text: p.text }) })),
    generationConfig: { temperature: json ? 0.2 : 0.7, ...(json ? { responseMimeType: 'application/json' } : {}), ...(think ? { thinkingConfig: think } : {}) }
  };
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:${onText ? 'streamGenerateContent?alt=sse' : 'generateContent'}`, {
      method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body) });
  } catch (e) { return { ok: false, status: e.name === 'AbortError' ? 504 : 0, msg: e.name === 'AbortError' ? 'took too long' : 'no connection' }; }
  finally { clearTimeout(timer); }
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    const msg = (Array.isArray(data) ? data[0] : data)?.error?.message || 'HTTP ' + res.status;
    if (think && res.status === 400 && /think/i.test(msg)) { noThink.push(model); LS.set('ft_nothink', JSON.stringify(noThink)); return geminiOnce(key, model, msgs, system, json, onText); }
    return { ok: false, status: res.status, msg };
  }
  if (onText) {
    let full = '', why = '';
    try {
      await readSSE(res, ev => {
        const c = ev.candidates?.[0];
        const piece = (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
        if (piece) { full += piece; onText(full); }
        if (c?.finishReason) why = c.finishReason;
      });
    } catch { if (!full) return { ok: false, status: 0, msg: 'connection lost' }; }
    return full ? { ok: true, text: full } : { ok: false, status: 500, msg: 'empty answer (' + (why || 'unknown') + ')' };
  }
  const data = await res.json().catch(() => ({}));
  const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  return text ? { ok: true, text } : { ok: false, status: 500, msg: 'empty answer (' + (data.candidates?.[0]?.finishReason || data.promptFeedback?.blockReason || 'unknown') + ')' };
}
async function geminiChain(key, msgs, system, json, onText) {
  const cool = JSON.parse(LS.get('ft_cool', '{}')), now = Date.now();
  let list = GEMINI.map(m => m.id);
  const custom = LS.get('ft_model', ''), last = LS.get('ft_lastModel', '');
  if (last && list.includes(last)) list = [last, ...list.filter(x => x !== last)];
  if (custom) list = [custom, ...list.filter(x => x !== custom)];
  const ready = list.filter(m => !(cool[m] > now));
  let err = aiErr(getClaudeKey() ? T('All free Google AI models are busy right now. Try again in a minute.') : T('All free Google AI models are busy right now. Try again in a minute, or add a Claude key in Settings.'));
  let offline = 0;
  for (const model of (ready.length ? ready : list)) {
    const r = await geminiOnce(key, model, msgs, system, json, onText);
    if (r.ok) { LS.set('ft_lastModel', model); lastAI = model; return r.text; }
    if (r.status === 0 && ++offline >= 2) throw aiErr(T('No connection to the AI. Check your internet.'));
    if (/api[_ ]?key|API_KEY_INVALID|unauthenticated/i.test(r.msg) || r.status === 401) throw aiErr(T('Your Google AI key was rejected. Check it in Settings.'), true);
    let wait = 0;
    if (r.status === 429) wait = /day|PerDay/i.test(r.msg) ? untilQuotaReset() : 60e3;
    else if (r.status === 404 || r.status === 403 || (r.status === 400 && /not (found|supported|available)|no longer|deprecat|access/i.test(r.msg))) wait = 7 * 864e5;
    else if (r.status >= 500) wait = 20e3;
    else err = aiErr('Google AI: ' + r.msg);
    if (wait) { cool[model] = Date.now() + wait; LS.set('ft_cool', JSON.stringify(cool)); }
  }
  throw err;
}
async function claudeCall(key, msgs, system, json, onText) {
  const model = LS.get('ft_claude_model', '') || 'claude-opus-5-5', isOpus = model === 'claude-opus-5-5';
  const jsonRule = 'Respond with only the JSON object, no other text.';
  const body = {
    model, max_tokens: 8000, output_config: { effort: 'low' },
    messages: msgs.map(m => ({ role: m.role, content: m.parts.map(p => p.image
      ? { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.image } }
      : p.inline ? (p.inline.mime === 'application/pdf' ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: p.inline.data } } : { type: 'text', text: '[attachment type not supported]' })
      : { type: 'text', text: p.text }) }))
  };
  if (system || json) body.system = [system, json ? jsonRule : ''].filter(Boolean).join('\n\n');
  if (isOpus) body.fallbacks = 'default';   // re-runs a declined request on Anthropic's recommended fallback model
  if (onText) body.stream = true;
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', body: JSON.stringify(body), headers: {
      'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true',
      ...(isOpus ? { 'anthropic-beta': 'server-side-fallback-2026-07-01' } : {}) } });
  } catch { throw aiErr(T('No connection to Claude. Check your internet.')); }
  if (onText && res.ok) {
    let full = '', stop = '', err = '';
    await readSSE(res, ev => {
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { full += ev.delta.text; onText(full); }
      else if (ev.type === 'message_delta' && ev.delta?.stop_reason) stop = ev.delta.stop_reason;
      else if (ev.type === 'error') err = ev.error?.message || 'stream error';
    }).catch(() => { err = err || 'connection lost'; });
    if (stop === 'refusal') throw aiErr(T('Claude declined this request.'));
    if (!full) throw aiErr(err ? 'Claude: ' + err : T('Claude gave an empty answer. Please try again.'));
    lastAI = 'Claude'; return full;
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || 'HTTP ' + res.status;
    if (res.status === 401 || res.status === 403) throw aiErr(T('Your Claude key was rejected. Check it in Settings.'));
    if (/credit balance/i.test(msg)) throw aiErr(T('Your Claude account has no credit left. Add credit at console.anthropic.com.'));
    if (res.status === 429 || res.status === 529) throw aiErr(T('Claude is busy right now. Try again in a moment.'));
    throw aiErr('Claude: ' + msg);
  }
  if (data.stop_reason === 'refusal') throw aiErr(T('Claude declined this request.'));
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if (!text) throw aiErr(T('Claude gave an empty answer. Please try again.'));
  lastAI = 'Claude'; return text;
}
const normItems = items => (items || []).map(it => ({
  name: String(it.name || T('Food')), grams: r0(num(it.grams)), kcal: r0(num(it.kcal)),
  protein: r1(num(it.protein)), carbs: r1(num(it.carbs)), fat: r1(num(it.fat)),
  sugar: it.sugar == null ? null : r1(num(it.sugar)), fiber: it.fiber == null ? null : r1(num(it.fiber)), sodium: it.sodium == null ? null : r0(num(it.sodium))
}));
const healthOf = v => { const n = r0(num(v)); return n >= 1 && n <= 10 ? n : null; };

function addPending(preview, parts) {

async function runAnalysis(p) {
  p.status = 'analyzing'; p.pct = 2;

    p.pct += (95 - p.pct) * 0.045;
    const el = document.querySelector(`[data-pct="${p.id}"]`); if (el) el.textContent = r0(p.pct) + '%';
  }, 200);

    const res = await askAI(p.parts);
    const items = normItems(res.items);
    if (!items.length) throw new Error(res.notes || T('No food recognised. Try a clearer photo.'));
    const m = { id: p.id, date: p.date, time: p.time, name: res.name || items.map(i => i.name).join(', '), items, servings: 1,
      health: healthOf(res.health_score), source: p.preview ? 'photo' : 'text', photo: !!p.preview };
    if (p.preview) { await idb.set(m.id, p.preview); photoCache[m.id] = p.preview; }
    db.meals.push(m); save();

  } catch (e) {
    clearInterval(p.timer); p.status = 'error'; p.error = aiMsg(e);
  }

    const sc = new Html5Qrcode('qr-hidden');

async function lookupBarcode(code) {
  bMsg(`<span class="spin"></span> ${T('Looking up product…')}`);
  try {
    const lc = LANG === 'zh' ? 'zh' : LANG;
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?lc=${lc}&fields=product_name,product_name_${lc},brands,nutriments,serving_quantity,nutriscore_grade`);
    const d = await r.json();
    if (d.status !== 1 || !d.product) return bMsg(T('Product {code} not found. Try a photo instead.', { code: esc(code) }), true);
    const p = d.product, n = p.nutriments || {};
    const pname = p['product_name_' + lc] || p.product_name;
    const kcal100 = num(n['energy-kcal_100g']) || num(n['energy_100g']) / 4.184;
    const g = num(p.serving_quantity) || 100, f = g / 100;
    const brand = p.brands ? p.brands.split(',')[0].trim() : '';
    const name = (pname || T('Product') + ' ' + code) + (brand && !(pname || '').toLowerCase().includes(brand.toLowerCase()) ? ' – ' + brand : '');
    const ns = { a: 9, b: 7, c: 5, d: 3, e: 2 }[p.nutriscore_grade] || null;
    closeSheet();
    openNewMeal({ id: uid(), date: sel, time: nowTime(), name, servings: 1, health: ns, source: 'barcode', photo: false,
      items: [{ name, grams: r0(g), kcal: r0(kcal100 * f), protein: r1(num(n.proteins_100g) * f), carbs: r1(num(n.carbohydrates_100g) * f), fat: r1(num(n.fat_100g) * f),
        sugar: 'sugars_100g' in n ? r1(num(n.sugars_100g) * f) : null, fiber: 'fiber_100g' in n ? r1(num(n.fiber_100g) * f) : null,
        sodium: 'sodium_100g' in n ? r0(num(n.sodium_100g) * 1000 * f) : null }] });
  } catch { bMsg(T('No internet connection?'), true); }
}

let det = null;
function setBase(it) { it.base = { grams: num(it.grams), kcal: num(it.kcal), protein: num(it.protein), carbs: num(it.carbs), fat: num(it.fat) }; return it; }
function openMeal(id) { const m = db.meals.find(x => x.id === id); if (m) { det = { m: clone(m), isNew: false, open: -1 }; det.m.items.forEach(setBase); renderDetail(); } }

function renderDetTotals() {
  const m = det.m, t = mealTotals(m);
  $('#dTot').innerHTML = `
    <button class="card bigcal" data-edit="kcal"><div class="ic">🔥</div><div><div class="small muted">${T('Calories')}</div><div style="font-size:30px;font-weight:800;letter-spacing:-.03em">${r0(t.kcal)}</div></div></button>
    <div class="dmac">${MAC.map(x => `<button class="dm" data-edit="${x.k}"><div class="t">${x.ic} ${T(x.label)}</div><b>${r0(t[x.k])}g</b></button>`).join('')}</div>
    ${mealHealth(m) ? `<div class="card" style="margin-top:14px"><div class="spread"><span style="font-weight:600">💚 ${T('Health score')}${m.health ? '' : ` <span class="small muted">(${T('estimated')})</span>`}</span><b>${mealHealth(m)}/10</b></div>
      <div class="hbar"><i style="width:${mealHealth(m) * 10}%;background:${healthColor(mealHealth(m))}"></i></div></div>` : ''}`;
  $('#dTot').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const f = b.dataset.edit, label = f === 'kcal' ? T('Calories') : T(MAC.find(x => x.k === f).label) + ' (g)';
    numberSheet(label, r0(mealTotals(det.m)[f]), f === 'kcal' ? 'kcal' : 'g', v => setTotal(f, v), f === 'kcal' ? 10 : 1);

function setTotal(f, v) {
  const m = det.m, cur = mealTotals(m)[f];
  if (!m.items.length) m.items.push({ name: m.name || T('Food'), grams: 100, kcal: 0, protein: 0, carbs: 0, fat: 0 });
  if (cur > 0) { const k = v / cur; m.items.forEach(it => it[f] = f === 'kcal' ? r0(it[f] * k) : r1(it[f] * k)); }
  else m.items[0][f] = f === 'kcal' ? r0(v / m.servings) : r1(v / m.servings);
  m.items.forEach(setBase); renderDetTotals(); renderIngredients();
}
function renderIngredients() {
  const box = $('#dIng'), m = det.m;
  const flabel = { kcal: N('Calories'), protein: N('Protein'), carbs: N('Carbs'), fat: N('Fats') };
  box.innerHTML = m.items.map((it, i) => `<div class="ing" data-i="${i}">
    <button class="ing-head"><span><b data-h="name">${esc(it.name || T('New ingredient'))}</b><br><span class="small muted" data-h="grams">${it.grams} g</span></span>
      <span style="font-weight:600"><span data-h="kcal">${r0(it.kcal)}</span> kcal <span class="muted">${det.open === i ? '⌃' : '›'}</span></span></button>
    ${det.open === i ? `<div class="ing-edit">
      <div class="row"><input data-f="name" value="${esc(it.name)}" placeholder="${T('Ingredient')}" class="grow"><input data-f="grams" inputmode="decimal" value="${it.grams}" style="width:90px;text-align:right"><span class="muted">g</span></div>
      <div class="g4">${['kcal', 'protein', 'carbs', 'fat'].map(f => `<div><label class="lbl">${T(flabel[f])}</label><input data-f="${f}" inputmode="decimal" value="${it[f]}"></div>`).join('')}</div>
      <button class="chipbtn" data-rm style="margin-top:12px;color:var(--bad)">${T('Remove ingredient')}</button></div>` : ''}</div>`).join('')
    || `<p class="muted">${T('No ingredients yet.')}</p>`;
  box.querySelectorAll('.ing-head').forEach(h => h.onclick = () => { const i = +h.parentNode.dataset.i; det.open = det.open === i ? -1 : i; renderIngredients(); });
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { m.items.splice(+b.closest('.ing').dataset.i, 1); det.open = -1; renderIngredients(); renderDetTotals(); });
  box.querySelectorAll('[data-f]').forEach(inp => inp.oninput = e => {
    const card = e.target.closest('.ing'), it = m.items[+card.dataset.i], f = e.target.dataset.f;
    if (f === 'name') { it.name = e.target.value; card.querySelector('[data-h=name]').textContent = it.name || T('New ingredient'); return; }
    it[f] = num(e.target.value);
    if (f === 'grams' && it.base.grams > 0) {
      const k = it.grams / it.base.grams;   // scale nutrition with portion size
      for (const x of ['kcal', 'protein', 'carbs', 'fat']) { it[x] = x === 'kcal' ? r0(it.base[x] * k) : r1(it.base[x] * k); card.querySelector(`[data-f="${x}"]`).value = it[x]; }
    } else setBase(it);
    card.querySelector('[data-h=grams]').textContent = it.grams + ' g';
    card.querySelector('[data-h=kcal]').textContent = r0(it.kcal);
    renderDetTotals();
  });
}

  const cur = currentWeight(), st = streak(), today = iso();

function weightChart(ws, target) {

  const vals = ws.map(w => w.kg).concat(target ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const t0 = dt(ws[0].date).getTime(), t1 = Math.max(dt(ws.at(-1).date).getTime(), t0 + 864e5);
  const x = d => P.l + (dt(d).getTime() - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const pts = ws.map(w => [x(w.date), y(w.kg)]);
  const line = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');

function md(text) {
  // Tiny Markdown: bold, italics, headings, bullet and numbered lists
  const lines = esc(text).split('\n'), out = [];
  let list = null;
  const inline = l => l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<i>$2</i>');
  for (const raw of lines) {
    const l = raw.trim(), ul = l.match(/^[-*•]\s+(.*)/), ol = l.match(/^\d+[.)]\s+(.*)/);
    const kind = ul ? 'ul' : ol ? 'ol' : null;
    if (list && list !== kind) { out.push(`</${list}>`); list = null; }
    if (kind) { if (!list) { out.push(`<${kind}>`); list = kind; } out.push(`<li>${inline((ul || ol)[1])}</li>`); continue; }
    if (!l) continue;
    const h = l.match(/^#{1,4}\s+(.*)/);
    out.push(h ? `<p><b>${inline(h[1])}</b></p>` : `<p>${inline(l)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join('');
}
// A half-typed answer can end in the middle of **bold** or a list marker; tidy that up so no stray

function tidyPartial(t) {
  t = t.replace(/\n[-*•\d.)\s]*$/, '\n').replace(/\*+$/, '');

}

function applyMemoryTags(text) {
  let changed = 0;
  for (const [, f] of text.matchAll(/<memory>([\s\S]*?)<\/memory>/gi)) {
    const fact = f.trim();
    if (fact && !memList().some(m => m.text.toLowerCase() === fact.toLowerCase())) { memList().push({ id: uid(), text: fact, date: iso() }); changed++; }
  }
  for (const [, f] of text.matchAll(/<forget>([\s\S]*?)<\/forget>/gi)) {
    const q = f.trim().toLowerCase(), before = memList().length;
    if (q) db.coachMemory = memList().filter(m => !m.text.toLowerCase().includes(q) && !q.includes(m.text.toLowerCase()));
    changed += before - memList().length;
