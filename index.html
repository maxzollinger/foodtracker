<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodTracker</title>
<meta name="theme-color" content="#2f9e5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FoodTracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f6f7f4;--card:#fff;--text:#1c2321;--muted:#6b7570;--line:#e3e7e2;
  --accent:#2f9e5b;--accent-soft:#e3f4ea;--warn:#d9822b;--danger:#d64545;
  --protein:#3b7dd8;--carbs:#d9a21b;--fat:#c2569b;--shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101412;--card:#1a201d;--text:#e8ede9;--muted:#94a09a;--line:#2a322e;
    --accent:#45c27a;--accent-soft:#183626;--protein:#6aa0ee;--carbs:#e8b83a;--fat:#e07cbd;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:28px;margin:0;font-weight:750;letter-spacing:-.02em}
main{max-width:560px;margin:0 auto;padding:0 16px}
.view[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
a{color:var(--accent)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button.secondary,.btn.secondary{background:var(--accent-soft);color:var(--accent)}
button.ghost{background:transparent;color:var(--muted);padding:8px}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
button:disabled{opacity:.5}
button.block{width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text)}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 input{padding:9px 6px;text-align:center}
.grid4 label{margin:6px 0 2px;text-align:center;font-size:11px}

/* Today */
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.datenav strong{font-size:17px}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:26px;font-weight:750;line-height:1}
.macro{margin:8px 0}
.macro .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.macro .bar i{display:block;height:100%;border-radius:5px}
.meal{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 2px}
.banner{background:var(--accent-soft);color:var(--text);border:0}

/* Add */
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbtn{flex-direction:column;padding:18px 10px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;font-weight:600;box-shadow:var(--shadow)}
.addbtn .ic{font-size:30px}
.addbtn.primary{grid-column:1/-1;background:var(--accent);color:#fff;border-color:var(--accent);padding:24px}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0}
.spinner{width:34px;height:34px;border:4px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Review */
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.item .row input:first-child{font-weight:600}
.item .grams{width:92px;flex:none;text-align:right}
.totals{display:flex;justify-content:space-between;font-weight:600;padding:8px 2px}
.totals span{text-align:center}
.totals small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.conf{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.conf.low{background:#f9e6d3;color:#9a5a17}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;position:relative;margin-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.bars .col i{width:100%;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:2px}
.bars .col i.over{background:var(--warn)}
.bars .col span{font-size:11px;color:var(--muted)}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.5}
.chart{width:100%;height:auto;display:block}
.wlist div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;color:var(--muted);flex-direction:column;gap:2px;padding:6px 10px;font-size:11px;font-weight:600;flex:1}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.active{color:var(--accent)}
nav.tabs .plus{background:var(--accent);color:#fff;width:52px;height:52px;flex:none;border-radius:50%;padding:0;margin-top:-18px;box-shadow:0 4px 12px rgba(47,158,91,.35)}
nav.tabs .plus.active{color:#fff}
nav.tabs .plus svg{width:28px;height:28px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;
  max-width:calc(100% - 32px);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hiddenfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<header class="top"><h1 id="title">Today</h1><span id="headerExtra"></span></header>

<main>
  <section class="view" id="v-today"></section>
  <section class="view" id="v-add" hidden></section>
  <section class="view" id="v-review" hidden></section>
  <section class="view" id="v-progress" hidden></section>
  <section class="view" id="v-goals" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="today" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
  <button data-tab="add" class="plus" aria-label="Add food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>

<input type="file" accept="image/*" capture="environment" id="fileCam" class="hiddenfile">
<input type="file" accept="image/*" id="fileLib" class="hiddenfile">
<input type="file" accept="image/*" capture="environment" id="fileBar" class="hiddenfile">
<input type="file" accept="application/json,.json" id="fileImport" class="hiddenfile">
<div id="qr-hidden" style="display:none"></div>
<div id="toast"></div>

<script>
/* ---------- Storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let db;
try { db = JSON.parse(LS.get('ft_data', '{}')) || {}; } catch { db = {}; }
db = Object.assign({ profile: null, overrides: {}, meals: [], weights: [] }, db);
function save() { if (!LS.set('ft_data', JSON.stringify(db))) toast('Could not save – phone storage full?'); }
const getKey = () => LS.get('ft_key', '');
const getModel = () => LS.get('ft_model', '') || 'gemini-2.5-flash';

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(n);
const r1 = n => Math.round(n * 10) / 10;
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const MEAL_TYPES = ['breakfast', 'lunch', 'dinner', 'snack'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function guessType() { const h = new Date().getHours() + new Date().getMinutes() / 60; return h < 10.5 ? 'breakfast' : h < 15 ? 'lunch' : h < 17.5 ? 'snack' : h < 22 ? 'dinner' : 'snack'; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

/* ---------- Targets ---------- */
function currentWeight() {
  if (db.weights.length) return [...db.weights].sort((a, b) => a.date.localeCompare(b.date)).at(-1).kg;
  return db.profile ? db.profile.weight : 0;
}
function targets() {
  const p = db.profile; if (!p) return null;
  const w = currentWeight();
  const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * p.activity;
  let kcal = tdee;
  if (p.goal === 'lose') kcal = tdee - p.pace * 7700 / 7;
  if (p.goal === 'gain') kcal = tdee + p.pace * 7700 / 7;
  kcal = Math.max(kcal, p.sex === 'm' ? 1500 : 1200);
  const protein = w * (p.goal === 'lose' ? 2.0 : p.goal === 'gain' ? 1.8 : 1.6);
  const fat = kcal * 0.25 / 9;
  const carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  const t = { kcal: r0(kcal), protein: r0(protein), carbs: r0(carbs), fat: r0(fat), bmr: r0(bmr), tdee: r0(tdee) };
  t.auto = { ...t };
  for (const k of ['kcal', 'protein', 'carbs', 'fat']) if (num(db.overrides[k]) > 0) t[k] = r0(num(db.overrides[k]));
  return t;
}
function dayTotals(date) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0, count: 0 };
  for (const m of db.meals) if (m.date === date) { t.count++; for (const it of m.items) for (const k of ['kcal', 'protein', 'carbs', 'fat']) t[k] += num(it[k]); }
  return t;
}
const mealTotals = m => m.items.reduce((a, it) => ({ kcal: a.kcal + num(it.kcal), protein: a.protein + num(it.protein) }), { kcal: 0, protein: 0 });

/* ---------- Navigation ---------- */
let curDate = iso();
let draft = null;
let addState = { mode: null, busy: false, preview: null, error: null };
const TITLES = { today: 'Today', add: 'Add food', review: 'Check & save', progress: 'Progress', goals: 'Goals', settings: 'Settings' };
function show(tab) {
  const view = tab === 'settings' ? 'goals' : tab;
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'v-' + view);
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('#title').textContent = TITLES[tab];
  window.scrollTo(0, 0);
  ({ today: renderToday, add: renderAdd, review: renderReview, progress: renderProgress, goals: () => renderGoals(false), settings: () => renderGoals(true) })[tab]();
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  if (b.dataset.tab === 'add') addState = { mode: null, busy: false, preview: null, error: null };
  show(b.dataset.tab);
});

/* ---------- Today ---------- */
function renderToday() {
  const t = targets(), d = dayTotals(curDate);
  const isToday = curDate === iso();
  let h = `<div class="datenav">
    <button class="ghost" id="prevDay" aria-label="Previous day">‹ Prev</button>
    <strong>${isToday ? 'Today' : curDate === addDays(iso(), -1) ? 'Yesterday' : fmtDate(curDate)}</strong>
    <button class="ghost" id="nextDay" ${isToday ? 'disabled' : ''} aria-label="Next day">Next ›</button></div>`;
  if (!t) h += `<div class="card banner"><h2>👋 Welcome!</h2><p>Set your body data and goal first, so the app can calculate your daily calories and protein.</p>
    <button class="block" onclick="show('goals')">Set my goals</button></div>`;
  if (!getKey()) h += `<div class="card banner"><b>AI photo analysis is off.</b> <span class="muted">Add your free Google AI key in Settings.</span>
    <div style="margin-top:10px"><button class="secondary" onclick="show('settings')">Open Settings</button></div></div>`;
  const goal = t ? t.kcal : 2000;
  const left = goal - d.kcal, pct = Math.min(d.kcal / goal, 1), C = 2 * Math.PI * 56;
  h += `<div class="card"><div class="ringwrap">
    <div class="ring"><svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="56" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="66" cy="66" r="56" fill="none" stroke="${left < 0 ? 'var(--warn)' : 'var(--accent)'}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
      <div class="center"><span class="big">${Math.abs(r0(left))}</span><span class="small muted">${left < 0 ? 'kcal over' : 'kcal left'}</span></div></div>
    <div class="grow">
      <div class="small muted">Eaten</div><div style="font-size:20px;font-weight:700">${r0(d.kcal)} <span class="small muted">/ ${goal} kcal</span></div>
      ${macroBar('Protein', d.protein, t?.protein, 'var(--protein)')}
    </div></div>
    ${macroBar('Carbs', d.carbs, t?.carbs, 'var(--carbs)')}
    ${macroBar('Fat', d.fat, t?.fat, 'var(--fat)')}
  </div>`;
  const meals = db.meals.filter(m => m.date === curDate);
  h += `<div class="card"><div class="spread"><h2 style="margin:0">Meals</h2><button class="secondary" onclick="startAdd()">＋ Add</button></div>`;
  if (!meals.length) h += `<p class="muted">Nothing logged ${isToday ? 'yet today' : 'this day'}. Tap ＋ to snap a photo of your food.</p>`;
  for (const type of MEAL_TYPES) {
    const list = meals.filter(m => m.type === type).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    if (!list.length) continue;
    const tot = list.reduce((a, m) => a + mealTotals(m).kcal, 0);
    h += `<div class="tag">${cap(type)} · ${r0(tot)} kcal</div>`;
    for (const m of list) {
      const mt = mealTotals(m);
      h += `<div class="meal"><div class="grow" onclick="editMeal('${m.id}')" style="cursor:pointer">
        <div class="name">${esc(m.name)}</div>
        <div class="small muted">${r0(mt.kcal)} kcal · ${r0(mt.protein)} g protein${m.time ? ' · ' + esc(m.time) : ''}</div></div>
        <button class="ghost" onclick="editMeal('${m.id}')" aria-label="Edit">✎</button>
        <button class="ghost" onclick="deleteMeal('${m.id}')" aria-label="Delete">🗑</button></div>`;
    }
  }
  h += `</div>`;
  $('#v-today').innerHTML = h;
  $('#prevDay').onclick = () => { curDate = addDays(curDate, -1); renderToday(); };
  $('#nextDay').onclick = () => { if (curDate < iso()) { curDate = addDays(curDate, 1); renderToday(); } };
}
function macroBar(label, val, goal, color) {
  const pct = goal ? Math.min(val / goal * 100, 100) : 0;
  return `<div class="macro"><div class="spread small"><span>${label}</span><span class="muted">${r0(val)}${goal ? ' / ' + goal : ''} g</span></div>
    <div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function deleteMeal(id) {
  const m = db.meals.find(x => x.id === id);
  if (!m || !confirm(`Delete "${m.name}"?`)) return;
  db.meals = db.meals.filter(x => x.id !== id); save(); renderToday(); toast('Meal deleted');
}
function editMeal(id) {
  const m = db.meals.find(x => x.id === id); if (!m) return;
  draft = JSON.parse(JSON.stringify(m)); draft.items.forEach(setBase); show('review');
}
function startAdd() { addState = { mode: null, busy: false, preview: null, error: null }; show('add'); }

/* ---------- Add ---------- */
function renderAdd() {
  const s = addState;
  let h = '';
  if (s.busy) {
    h += `<div class="card">${s.preview ? `<img class="preview" src="${s.preview}" alt="">` : ''}
      <div class="loading"><div class="spinner"></div><div>${esc(s.busy)}</div></div></div>`;
    $('#v-add').innerHTML = h; return;
  }
  if (s.error) h += `<div class="card" style="border-color:var(--danger)"><b style="color:var(--danger)">Something went wrong</b><p>${esc(s.error)}</p></div>`;
  if (!getKey()) h += `<div class="card banner"><b>Photo AI needs a free key.</b> <span class="muted">Barcode and manual entry work without it.</span>
    <div style="margin-top:10px"><button class="secondary" onclick="show('settings')">Add key in Settings</button></div></div>`;
  h += `<div class="addgrid">
    <button class="addbtn primary" id="bCam"><span class="ic">📷</span>Take a photo of your food</button>
    <button class="addbtn" id="bLib"><span class="ic">🖼️</span>Choose photo</button>
    <button class="addbtn" id="bBar"><span class="ic">🏷️</span>Scan barcode</button>
    <button class="addbtn" id="bText"><span class="ic">💬</span>Describe it</button>
    <button class="addbtn" id="bMan"><span class="ic">✏️</span>Enter manually</button>
  </div>
  <div class="card" style="margin-top:14px">
    <label for="hint" style="margin-top:0">Optional note for the AI</label>
    <input id="hint" placeholder="e.g. cooked in butter, large portion, 2 eggs" value="${esc(s.hint || '')}">
  </div>`;
  if (s.mode === 'text') h += `<div class="card"><h2>What did you eat?</h2>
    <textarea id="descr" placeholder="e.g. 2 scrambled eggs, 1 slice whole-grain toast with butter, a cappuccino">${esc(s.descr || '')}</textarea>
    <button class="block" id="bAnalyzeText" style="margin-top:10px">Analyze with AI</button></div>`;

function newDraft(source) { return { id: null, date: curDate, type: guessType(), name: '', items: [], source, notes: '', confidence: '' }; }
function setBase(it) { it.base = { grams: num(it.grams), kcal: num(it.kcal), protein: num(it.protein), carbs: num(it.carbs), fat: num(it.fat) }; return it; }

async function onPhoto(file) {
  if (!file) return;
  addState.error = null;
  try {
    const dataUrl = await fileToJpeg(file, 1024);
    addState.preview = dataUrl; addState.busy = 'Looking at your food…'; renderAdd();
    const prompt = FOOD_PROMPT + (addState.hint ? `\nExtra info from the user: ${addState.hint}` : '');
    const res = await askGemini([{ text: prompt }, { inlineData: { mimeType: 'image/jpeg', data: dataUrl.split(',')[1] } }]);
    toDraft(res, 'photo');
  } catch (e) { fail(e); }
}
async function analyzeText(text) {
  addState.error = null; addState.busy = 'Calculating nutrition…'; addState.preview = null; renderAdd();
  try {
    const res = await askGemini([{ text: FOOD_PROMPT + `\nThere is no photo. The user describes the meal: ${text}` + (addState.hint ? `\nExtra info: ${addState.hint}` : '') }]);
    toDraft(res, 'text');
  } catch (e) { fail(e); }
}
function fail(e) {
  addState.busy = false;
  addState.error = e.message === 'NOKEY' ? 'Add your free Google AI key in Settings first.' : e.message;
  renderAdd();
}
function toDraft(res, source) {
  addState.busy = false;
  const items = (res.items || []).map(it => setBase({
    name: String(it.name || 'Food'), grams: r0(num(it.grams)), kcal: r0(num(it.kcal)),
    protein: r1(num(it.protein)), carbs: r1(num(it.carbs)), fat: r1(num(it.fat))
  }));
  if (!items.length) { addState.error = res.notes || 'No food recognised. Try another photo with better light, or describe it in words.'; renderAdd(); return; }
  draft = newDraft(source);
  draft.name = res.meal_name || items.map(i => i.name).join(', ');
  draft.items = items; draft.notes = res.notes || ''; draft.confidence = res.confidence || '';
  show('review');
}

async function onBarcodePhoto(file) {
  if (!file) return;
  addState.error = null; addState.busy = 'Reading barcode…';
  addState.preview = await fileToJpeg(file, 600).catch(() => null); renderAdd();
  try {
    await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    const scanner = new Html5Qrcode('qr-hidden');
    let code;
    try { code = await scanner.scanFile(file, false); } finally { try { scanner.clear(); } catch {} }
    addState.code = String(code).replace(/\D/g, '');
    await lookupBarcode(addState.code);
  } catch (e) {
    addState.busy = false; addState.mode = 'barcode';
    addState.error = 'Could not read the barcode from the photo. Hold the phone closer and keep it sharp, or type the number below.';
    renderAdd();
  }
}
async function lookupBarcode(code) {
  addState.error = null; addState.busy = 'Looking up product…'; renderAdd();
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
    const d = await r.json();
    if (d.status !== 1 || !d.product) throw new Error(`Product ${code} was not found in the Open Food Facts database. Try a photo or enter it manually.`);
    const p = d.product, n = p.nutriments || {};
    const kcal100 = num(n['energy-kcal_100g']) || num(n['energy_100g']) / 4.184;
    const g = num(p.serving_quantity) || 100, f = g / 100;
    const brand = p.brands ? p.brands.split(',')[0].trim() : '';
    const name = (p.product_name || 'Product ' + code) + (brand && !(p.product_name || '').toLowerCase().includes(brand.toLowerCase()) ? ' – ' + brand : '');
    addState.busy = false;
    draft = newDraft('barcode');
    draft.name = p.product_name || name;
    draft.notes = 'Values from Open Food Facts (per 100 g: ' + r0(kcal100) + ' kcal). Set the grams you actually ate.';
    draft.items = [setBase({ name, grams: r0(g), kcal: r0(kcal100 * f), protein: r1(num(n.proteins_100g) * f), carbs: r1(num(n.carbohydrates_100g) * f), fat: r1(num(n.fat_100g) * f) })];
    show('review');
  } catch (e) { addState.busy = false; addState.mode = 'barcode'; addState.error = e.message.includes('fetch') ? 'No internet connection?' : e.message; renderAdd(); }
}

function fileToJpeg(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not open this image.')); };
    img.src = url;
  });
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s);
  });
}

/* ---------- AI (Google Gemini, free tier) ---------- */
const FOOD_PROMPT = `You are an expert nutritionist. Identify every food and drink in the meal.
Estimate each portion's weight in grams using visual cues (plate size, cutlery, hands, packaging). Include visible oils, sauces and dressings.
Return ONLY JSON in this exact shape:
{"meal_name": "short name of the meal", "items": [{"name": "food", "grams": 0, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}], "confidence": "low|medium|high", "notes": "one short sentence about assumptions"}
All numbers are for the estimated portion (not per 100 g); macros in grams. If no food is visible, return "items": [] and explain in notes.`;

async function askGemini(parts, modelOverride) {
  const key = getKey(); if (!key) throw new Error('NOKEY');
  const call = model => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } })
  });
  let res;
  try {
    const model = modelOverride || getModel();
    res = await call(model);
    if (res.status === 404 && model !== 'gemini-flash-latest') res = await call('gemini-flash-latest');
  } catch { throw new Error('No connection to the AI. Check your internet.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || 'HTTP ' + res.status;
    if (res.status === 429) throw new Error('Free AI limit reached for now. Wait a minute and try again (daily limits reset every day).');
    if (/api key|API_KEY|permission/i.test(msg)) throw new Error('Your AI key was rejected. Check it in Settings.');
    if (res.status === 404) throw new Error('AI model not found. Change the model name in Settings (e.g. gemini-2.5-flash).');
    throw new Error('AI error: ' + msg);
  }
  const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').replace(/^```(json)?|```$/gm, '').trim();
  try { return JSON.parse(text); } catch { throw new Error('The AI gave an unreadable answer. Please try again.'); }
}

function onItemInput(e) {
  const card = e.target.closest('.item'), it = draft.items[+card.dataset.i], f = e.target.dataset.f;
  if (f === 'name') { it.name = e.target.value; return; }
  it[f] = num(e.target.value);
  if (f === 'grams') {
    // Scale nutrition with the portion size
    if (it.base.grams > 0) {
      const k = it.grams / it.base.grams;
      for (const m of ['kcal', 'protein', 'carbs', 'fat']) {
        it[m] = m === 'kcal' ? r0(it.base[m] * k) : r1(it.base[m] * k);
        card.querySelector(`[data-f="${m}"]`).value = it[m];
      }
    } else setBase(it);
  } else setBase(it);
  renderTotals();
}
function renderTotals() {
  const t = draft.items.reduce((a, it) => { for (const k in a) a[k] += num(it[k]); return a; }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });
  $('#totals').innerHTML = `<span>${r0(t.kcal)}<small>kcal</small></span><span style="color:var(--protein)">${r0(t.protein)} g<small>protein</small></span>
    <span style="color:var(--carbs)">${r0(t.carbs)} g<small>carbs</small></span><span style="color:var(--fat)">${r0(t.fat)} g<small>fat</small></span>`;
}
function saveDraft() {
  const d = draft;

/* ---------- Progress ---------- */
function renderProgress() {
  const t = targets(), p = db.profile;
  const ws = [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
  let h = `<div class="card"><h2>Log weight</h2><div class="row">
    <input id="wKg" inputmode="decimal" placeholder="kg" value="${ws.length ? ws.at(-1).kg : (p?.weight || '')}" style="max-width:110px">
    <input id="wDate" type="date" value="${iso()}" max="${iso()}" class="grow"><button id="wSave">Save</button></div></div>`;

  h += `<div class="card"><h2>Weight</h2>`;
  if (ws.length < 2) h += `<p class="muted">Log your weight a few times (e.g. every morning) to see your trend here.</p>`;
  else h += weightChart(ws.slice(-120), p && p.goal !== 'maintain' ? p.targetWeight : null);
  if (ws.length) {
    const start = ws[0].kg, cur = ws.at(-1).kg, diff = r1(cur - start);
    let toGo = '', eta = '';
    if (p && p.goal !== 'maintain' && p.targetWeight) {
      const rem = r1(p.targetWeight - cur);
      toGo = (rem > 0 ? '+' : '') + rem + ' kg';
      const reached = (p.goal === 'lose' && rem >= 0) || (p.goal === 'gain' && rem <= 0);
      if (reached) eta = 'Reached 🎉';
      else { const d = new Date(); d.setDate(d.getDate() + Math.ceil(Math.abs(rem) / p.pace * 7)); eta = d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }); }
    }
    h += `<div class="stats" style="margin-top:12px">
      <div class="stat"><span class="small muted">Current</span><b>${cur} kg</b></div>
      <div class="stat"><span class="small muted">Change</span><b>${diff > 0 ? '+' : ''}${diff} kg</b></div>
      ${toGo ? `<div class="stat"><span class="small muted">To goal (${p.targetWeight} kg)</span><b>${toGo}</b></div>
      <div class="stat"><span class="small muted">Expected</span><b>${eta}</b></div>` : ''}</div>`;
  }
  h += `</div>`;

  // Last 7 days
  const days = [...Array(7)].map((_, i) => addDays(iso(), i - 6));
  const tot = days.map(dayTotals);
  const goal = t ? t.kcal : 2000;
  const maxV = Math.max(goal * 1.25, ...tot.map(x => x.kcal));
  const logged = tot.filter(x => x.count);
  const avgK = logged.length ? r0(logged.reduce((a, x) => a + x.kcal, 0) / logged.length) : 0;
  const avgP = logged.length ? r0(logged.reduce((a, x) => a + x.protein, 0) / logged.length) : 0;
  const pHit = t ? logged.filter(x => x.protein >= t.protein * 0.95).length : 0;
  const kHit = t ? logged.filter(x => Math.abs(x.kcal - t.kcal) <= t.kcal * 0.1).length : 0;
  h += `<div class="card"><h2>Last 7 days</h2><div class="bars">
    <div class="goal" style="bottom:calc(${goal / maxV * 100}% * (130 - 20) / 130 + 20px)"></div>
    ${tot.map((x, i) => `<div class="col"><i class="${x.kcal > goal * 1.1 ? 'over' : ''}" style="height:${x.kcal / maxV * 110}px"></i>
      <span>${new Date(days[i] + 'T12:00').toLocaleDateString(undefined, { weekday: 'narrow' })}</span></div>`).join('')}
  </div><p class="small muted" style="margin:6px 0 12px">Dashed line = your calorie goal (${goal} kcal)</p>
  <div class="stats">
    <div class="stat"><span class="small muted">Avg calories</span><b>${avgK}</b></div>
    <div class="stat"><span class="small muted">Avg protein</span><b>${avgP} g</b></div>
    <div class="stat"><span class="small muted">Protein goal hit</span><b>${pHit} / 7 days</b></div>
    <div class="stat"><span class="small muted">Calories on target</span><b>${kHit} / 7 days</b></div>
    <div class="stat" style="grid-column:1/-1"><span class="small muted">Logging streak</span><b>🔥 ${streak()} day${streak() === 1 ? '' : 's'}</b></div>
  </div></div>`;

  if (ws.length) h += `<div class="card"><h2>Weight entries</h2><div class="wlist">${ws.slice(-10).reverse().map(w =>
    `<div><span>${fmtDate(w.date)}</span><span><b>${w.kg} kg</b><button class="ghost" onclick="delWeight('${w.date}')" aria-label="Delete">✕</button></span></div>`).join('')}</div></div>`;
  $('#v-progress').innerHTML = h;
  $('#wSave').onclick = () => {
    const kg = r1(num($('#wKg').value)), date = $('#wDate').value || iso();
    if (kg < 25 || kg > 350) return toast('Please enter a valid weight in kg');
    db.weights = db.weights.filter(w => w.date !== date); db.weights.push({ date, kg });
    save(); toast('Weight saved ✓'); renderProgress();
  };
}
function delWeight(date) { if (!confirm('Delete this weight entry?')) return; db.weights = db.weights.filter(w => w.date !== date); save(); renderProgress(); }
function streak() {
  const has = new Set(db.meals.map(m => m.date));
  let d = iso(), n = 0;
  if (!has.has(d)) d = addDays(d, -1);
  while (has.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function weightChart(ws, target) {
  const W = 340, H = 170, P = { l: 34, r: 10, t: 10, b: 22 };
  const vals = ws.map(w => w.kg).concat(target ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 2) { lo -= 1; hi += 1; }
  const t0 = new Date(ws[0].date).getTime(), t1 = Math.max(new Date(ws.at(-1).date).getTime(), t0 + 864e5);
  const x = d => P.l + (new Date(d).getTime() - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const pts = ws.map(w => `${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(' ');
  const ticks = [hi, (hi + lo) / 2, lo];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight chart">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="var(--muted)">${r1(v)}</text>`).join('')}
    ${target ? `<line x1="${P.l}" x2="${W - P.r}" y1="${y(target)}" y2="${y(target)}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${W - P.r}" y="${y(target) - 4}" font-size="10" text-anchor="end" fill="var(--accent)">goal</text>` : ''}
    <polyline points="${pts}" fill="none" stroke="var(--protein)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.length <= 40 ? ws.map(w => `<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3" fill="var(--protein)"/>`).join('') : ''}
    <text x="${P.l}" y="${H - 6}" font-size="10" fill="var(--muted)">${fmtDate(ws[0].date)}</text>
    <text x="${W - P.r}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtDate(ws.at(-1).date)}</text></svg>`;
}

      <option value="maintain" ${p.goal === 'maintain' ? 'selected' : ''}>Keep my weight / recomposition</option>
      <option value="gain" ${p.goal === 'gain' ? 'selected' : ''}>Build muscle (lean bulk)</option></select>
    <div class="grid2" id="paceRow" ${p.goal === 'maintain' ? 'hidden' : ''}>
      <div><label for="gTarget">Target weight (kg)</label><input id="gTarget" inputmode="decimal" value="${p.targetWeight || ''}"></div>
      <div><label for="gPace">Speed</label><select id="gPace">
        ${[[0.25, 'Slow (0.25/wk)'], [0.5, 'Normal (0.5/wk)'], [0.75, 'Fast (0.75/wk)']].map(([v, l]) => `<option value="${v}" ${p.pace == v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <button class="block" id="gSave" style="margin-top:14px">${db.profile ? 'Update goals' : 'Save & calculate'}</button></div>`;
    if (t) h += `<div class="card"><h2>Your daily targets</h2>
      <p class="small muted" style="margin-top:0">Your body burns about <b>${t.tdee} kcal</b>/day (resting: ${t.bmr}). Change any number to use your own.</p>
      <div class="grid4">${[['kcal', 'kcal'], ['protein', 'Protein g'], ['carbs', 'Carbs g'], ['fat', 'Fat g']].map(([k, l]) =>
        `<div><label>${l}</label><input data-ov="${k}" inputmode="numeric" value="${db.overrides[k] || ''}" placeholder="${t.auto[k]}"></div>`).join('')}</div>
      <p class="small muted">Empty = calculated automatically. Estimates only, not medical advice.</p></div>`;
  }
  const key = getKey();
  h += `<div class="card"><h2>AI photo analysis (free)</h2>
    <p class="small muted" style="margin-top:0">1. Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> and sign in with Google.<br>
    2. Tap <b>Create API key</b> and copy it.<br>3. Paste it here. It stays only on this phone.</p>
    <label for="sKey">Google AI key</label><input id="sKey" type="password" autocomplete="off" placeholder="AIza…" value="${esc(key)}">
    <label for="sModel">Model</label><input id="sModel" value="${esc(LS.get('ft_model', ''))}" placeholder="gemini-2.5-flash">
    <div class="row" style="margin-top:12px"><button class="grow" id="sSave">Save key</button><button class="secondary grow" id="sTest">Test</button></div>
    <p class="small muted" id="sMsg">${key ? '✓ Key saved' : 'No key yet'}</p></div>
  <div class="card"><h2>Your data</h2>
    <p class="small muted" style="margin-top:0">Everything is saved only on this phone. Make a backup now and then.</p>
    <div class="row wrap"><button class="secondary grow" id="dExport">⬇ Backup</button><button class="secondary grow" id="dImport">⬆ Restore</button></div>
    <button class="danger block" id="dReset" style="margin-top:10px">Delete all data</button></div>`;
  $('#v-goals').innerHTML = h;

  if (!settingsOnly) {
    $('#gGoal').onchange = e => $('#paceRow').hidden = e.target.value === 'maintain';
    $('#gSave').onclick = () => {
      const np = { sex: $('#gSex').value, age: num($('#gAge').value), height: num($('#gHeight').value), weight: r1(num($('#gWeight').value)),
        activity: num($('#gAct').value), goal: $('#gGoal').value, pace: num($('#gPace').value), targetWeight: r1(num($('#gTarget').value)) };
      if (np.age < 12 || np.age > 100 || np.height < 120 || np.height > 230 || np.weight < 30 || np.weight > 300) return toast('Please check age, height and weight');
      if (np.goal !== 'maintain' && !np.targetWeight) return toast('Please enter a target weight');
      const first = !db.profile;
      db.profile = np;
      if (!db.weights.length || currentWeight() !== np.weight) { db.weights = db.weights.filter(w => w.date !== iso()); db.weights.push({ date: iso(), kg: np.weight }); }
      save(); toast('Goals saved ✓');
      if (first) show('today'); else renderGoals(false);
    };
    document.querySelectorAll('[data-ov]').forEach(inp => inp.onchange = () => {
      const v = num(inp.value); if (v > 0) db.overrides[inp.dataset.ov] = v; else delete db.overrides[inp.dataset.ov];
      save(); toast('Targets updated');
    });
  }
  $('#sSave').onclick = () => {
    const k = $('#sKey').value.trim(), m = $('#sModel').value.trim();
    if (k) LS.set('ft_key', k); else LS.del('ft_key');
    if (m) LS.set('ft_model', m); else LS.del('ft_model');
    $('#sMsg').textContent = k ? '✓ Key saved' : 'Key removed'; toast('Saved');
  };
  $('#sTest').onclick = async () => {
    $('#sSave').click(); $('#sMsg').textContent = 'Testing…';
    try { const r = await askGemini([{ text: 'Return JSON {"ok": true}' }]); $('#sMsg').textContent = r.ok ? '✓ Key works! Model: ' + getModel() : '✓ Key works'; }
    catch (e) { $('#sMsg').textContent = '✕ ' + (e.message === 'NOKEY' ? 'Enter a key first' : e.message); }
  };
  $('#dExport').onclick = () => {
    const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `foodtracker-backup-${iso()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#dImport').onclick = () => $('#fileImport').click();
  $('#dReset').onclick = () => {
    if (!confirm('Delete ALL meals, weights and goals? This cannot be undone.')) return;
    db = { profile: null, overrides: {}, meals: [], weights: [] }; save(); toast('All data deleted'); show('today');
  };
}
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.meals) || !Array.isArray(d.weights)) throw 0;
    if (!confirm(`Restore backup with ${d.meals.length} meals and ${d.weights.length} weights? Current data will be replaced.`)) return;
    db = Object.assign({ profile: null, overrides: {}, meals: [], weights: [] }, d); save(); toast('Backup restored ✓'); show('today');
  } catch { toast('This is not a valid backup file'); }
};

/* ---------- Start ---------- */
show(db.profile ? 'today' : 'goals');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
