# Sends Food Tracker reminders to every phone that turned them on (free, runs on GitHub).
# Repository secrets: VAPID_PRIVATE_KEY, WORKER_URL and ADMIN_TOKEN (the server that keeps everyone's
# notification addresses), and optionally PUSH_SUBSCRIPTION (the old single-phone setup, still sent to).
# Times are UTC: 18:00 UTC = 20:00 in Central European summer time, 19:00 in winter.
name: FoodTracker reminders

on:
  schedule:
    - cron: '0 18 * * *'   # every evening: log calories burned
    - cron: '0 7 * * 0'    # every Sunday morning: log your weight
  workflow_dispatch:       # "Run workflow" button for testing
    inputs:
      reminder:
        description: Which reminder to send
        type: choice
        options: [burn, weight]
        default: burn

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: BNwyCPM2UJcV1DRBWLwm8YLYND0WVMM_Tk2vgLuuoc4gLhM-v-uU37EdwkgiSoHSDe4YmZ-NxDzvzT7782XRjxM
          REMINDER: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder || (github.event.schedule == '0 7 * * 0' && 'weight' || 'burn') }}
        run: |
          npm install --no-save --silent web-push@3.6.7
          cat > send.js <<'EOF'
          const webpush = require('web-push');
          const env = process.env;
          webpush.setVapidDetails('https://maxzollinger.github.io/foodtracker/', env.VAPID_PUBLIC_KEY, env.VAPID_PRIVATE_KEY);
          (async () => {
            const server = (env.WORKER_URL || '').replace(/\/+$/, '');
            const auth = { Authorization: 'Bearer ' + env.ADMIN_TOKEN };
            const list = [];
            if (server) {
              const r = await fetch(server + '/subs', { headers: auth });
              if (!r.ok) { console.error('Could not read the phone list:', r.status); process.exit(1); }
              list.push(...await r.json());
            }
            if (env.PUSH_SUBSCRIPTION) {
              try { const s = JSON.parse(env.PUSH_SUBSCRIPTION); if (!list.some(x => x.sub.endpoint === s.endpoint)) list.push({ id: null, sub: s }); } catch {}
            }
            let sent = 0, gone = 0, failed = 0;
            for (const { id, sub } of list) {
              try { await webpush.sendNotification(sub, JSON.stringify({ open: env.REMINDER }), { TTL: 6 * 3600 }); sent++; }
              catch (e) {
                if ((e.statusCode === 404 || e.statusCode === 410) && id && server) { await fetch(server + '/subs/' + id, { method: 'DELETE', headers: auth }); gone++; }
                else { failed++; console.error('Failed', e.statusCode, e.body); }
              }
            }
            console.log(`${env.REMINDER}: sent ${sent}, removed ${gone} old, failed ${failed} (of ${list.length} phones)`);
            if (list.length && !sent && failed) process.exit(1);
          })();
          EOF
          node send.js
