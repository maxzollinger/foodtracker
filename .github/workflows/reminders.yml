# Sends Food Tracker reminders to every phone that turned them on (free, runs on GitHub).
# Everyone picks their own times in the app (Settings → Notifications). This runs once an hour and sends
# each reminder when it's that person's chosen time in their own time zone (once per day, never twice).
# Repository secrets: VAPID_PRIVATE_KEY, WORKER_URL and ADMIN_TOKEN, and optionally PUSH_SUBSCRIPTION
# (the old single-phone setup: gets the default times, 20:00 and Sunday 09:00 Swiss time).
name: FoodTracker reminders

on:
  schedule:
    - cron: '7 * * * *'    # every hour
  workflow_dispatch:       # "Run workflow" button: sends the chosen reminder to everyone right now
    inputs:
      reminder:
        description: Which reminder to send now
        type: choice
        options: [burn, weight]
        default: burn

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VAPID_PUBLIC_KEY: BNwyCPM2UJcV1DRBWLwm8YLYND0WVMM_Tk2vgLuuoc4gLhM-v-uU37EdwkgiSoHSDe4YmZ-NxDzvzT7782XRjxM
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reminder || '' }}
        run: |
          npm install --no-save --silent web-push@3.6.7
          cat > send.js <<'EOF'
          const webpush = require('web-push');
          const env = process.env;
          webpush.setVapidDetails('https://maxzollinger.github.io/foodtracker/', env.VAPID_PUBLIC_KEY, env.VAPID_PRIVATE_KEY);
          const DEF = { burn: 20, wDay: 0, wTime: 9, tz: 'Europe/Zurich' };
          const now = new Date();
          // The date, hour and weekday right now in a person's time zone
          function local(tz) {
            let parts;
            try { parts = new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23', weekday: 'short' }).formatToParts(now); }
            catch { return local('Europe/Zurich'); }
            const p = Object.fromEntries(parts.map(x => [x.type, x.value]));
            return { date: `${p.year}-${p.month}-${p.day}`, hour: +p.hour, wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday) };
          }
          (async () => {
            const server = (env.WORKER_URL || '').replace(/\/+$/, '');
            const auth = { Authorization: 'Bearer ' + env.ADMIN_TOKEN, 'Content-Type': 'application/json' };
            const list = [];
            if (server) {
              const r = await fetch(server + '/subs', { headers: auth });
              if (!r.ok) { console.error('Could not read the phone list:', r.status); process.exit(1); }
              list.push(...await r.json());
            }
            if (env.PUSH_SUBSCRIPTION) {
              try { const s = JSON.parse(env.PUSH_SUBSCRIPTION); if (!list.some(x => x.sub.endpoint === s.endpoint)) list.push({ id: null, sub: s }); } catch {}
            }
            let sent = 0, gone = 0, failed = 0;
            for (const { id, sub } of list) {
              const p = { ...DEF, ...(sub.prefs || {}) }, L = local(p.tz), last = sub.last || {}, due = [];
              if (env.FORCE) due.push(env.FORCE);
              else {
                // Phones known to the server: any time in the 3 hours after the chosen time, once that day
                // (so a late or skipped hourly run doesn't lose a reminder). Old single phone: exactly on the hour.
                const inWin = h => id ? L.hour >= h && L.hour < h + 3 : L.hour === h;
                if (p.burn >= 0 && inWin(p.burn) && last.burn !== L.date) due.push('burn');
                if (p.wDay >= 0 && L.wd === p.wDay && inWin(p.wTime) && last.weight !== L.date) due.push('weight');
              }
              for (const kind of due) {
                try {
                  await webpush.sendNotification({ endpoint: sub.endpoint, keys: sub.keys }, JSON.stringify({ open: kind }), { TTL: 3 * 3600 });
                  sent++;
                  if (id && server && !env.FORCE) await fetch(`${server}/subs/${id}/sent`, { method: 'POST', headers: auth, body: JSON.stringify({ kind, date: L.date }) });
                } catch (e) {
                  if ((e.statusCode === 404 || e.statusCode === 410) && id && server) { await fetch(server + '/subs/' + id, { method: 'DELETE', headers: auth }); gone++; break; }
                  failed++; console.error('Failed', e.statusCode, e.body);
                }
              }
            }
            console.log(`sent ${sent}, removed ${gone} old, failed ${failed} (of ${list.length} phones)`);
          })();
          EOF
          node send.js
